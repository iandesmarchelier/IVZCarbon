const scopePill=s=>`<span class="pill s${s}">Alcance ${s}</span>`;
const catPill=r=>`<span class="pill">${esc(catLabel(catKey(r)))}</span>`;
const stateP=c=>!c?'':c.state==='auto'?`<span class="pill ok">Clasificado automáticamente</span>`:c.state==='review'?`<span class="pill warn">Requiere revisión</span>`:`<span class="pill err">Sin clasificar</span>`;
const confBar=c=>`<span class="confwrap"><span class="minibar" style="width:54px;display:inline-block;vertical-align:middle"><i style="width:${c.conf}%;background:${c.conf>=CONF_THR?'var(--ok)':'var(--warn)'}"></i></span> <span class="tiny dim num">${nf(c.conf)}%</span></span>`;
const methodPill=m=>m==='proveedor'?`<span class="methodpill ratio">Factor del proveedor</span>`:m==='spend'?`<span class="methodpill specific">Spend-based</span>`:`<span class="methodpill direct">Dato físico</span>`;

/* ------------------- cadena de trazabilidad (elemento central) ----------- */
function traceBlock(lv,ttl,meta,extra={}){
  return `<div class="tstep ${extra.origin?'origin':''}"><div class="lv">${lv}${extra.badges?' '+extra.badges:''}</div>
    <div class="bd"><div class="ttl">${ttl}</div>${meta?`<div class="meta">${meta}</div>`:''}${extra.formula?`<div class="formula">${extra.formula}</div>`:''}${extra.after||''}</div></div>`;
}
function traceHTML(r){
  const f=FBI[r.factor], st=SBI[r.site]||{name:'Sin planta asignada'}, mc=r.mach?MBI[r.mach]:null, pc=r.proc?PBI[r.proc]:null;
  const mv=r.mov?MOVBI()[r.mov]:null, L=mv?mv.legs[r.leg]:null;
  const rule=r.rule?RBI[r.rule]:null, ck=catKey(r), c=r.cls||{state:'auto',conf:99};
  const pair=r.pair?REC.find(x=>x.rid===r.pair):null;
  const blocks=[];
  /* 1 · resultado */
  let resMeta=`${scopePill(r.scope)} ${catPill(r)} <span class="pill">${pLabel(r.p)}</span>`;
  if(r.scope===2&&r.sub==='elec') resMeta+=`<br>Market-based (reportado): <b>${nf(r.kg,2)} kgCO₂e</b> · Location-based: <b>${nf(locKg(r),2)} kgCO₂e</b> <span class="dim">(${locFactor(r).id}, ${nf(locFactor(r).v,4)} kgCO₂e/kWh)</span>`;
  if(r.bio) resMeta+=`<br>CO₂ biogénico informado por separado, fuera de los alcances: <b>${nf(r.bio,1)} kg</b>`;
  blocks.push(traceBlock('Resultado',`${nf(r.kg/1000,3)} tCO₂e <span class="dim" style="font-weight:400">· ${nf(r.kg,2)} kgCO₂e</span>`,resMeta,{badges:srcBadge('calc')}));
  /* 2 · clasificación */
  blocks.push(traceBlock('Clasificación',`${r.scope===3?'Alcance 3 — '+catLabel(ck):'Alcance '+r.scope+' — '+catLabel(ck)}`,
    `${rule?`Regla <b class="num">${rule.id}</b>: ${esc(rule.when)} → ${esc(rule.method)}<br>`:'Clasificación manual del usuario<br>'}${stateP(c)} ${confBar(c)}${c.state!=='auto'?`<br><span style="color:var(--warn)">Confianza por debajo del umbral (${CONF_THR}%): el registro espera confirmación en «Transacciones y clasificación».</span>`:''}`));
  /* 3 · cálculo */
  let formula=`<b>${nfv(r.qty,2)}</b> ${f.unit} × <b>${f.v}</b> kgCO₂e/${f.unit} = <b>${nf(r.kg,2)}</b> kgCO₂e`;
  if(L) formula=`<b>${nfv(L.t,2)}</b> t × <b>${nf(L.km)}</b> km = <b>${nfv(L.tkm,2)}</b> t·km<br>`+formula;
  blocks.push(traceBlock('Cálculo','Dato de actividad × factor de emisión',`Incertidumbre estimada del factor: ±${f.unc}%`,{formula}));
  /* 4 · factor */
  blocks.push(traceBlock('Factor de emisión',`${nf(f.v,f.v<1?5:3)} kgCO₂e/${f.unit} — ${esc(f.act)}`,
    `<span class="num">${f.id}</span> · Fuente: <b>${esc(f.src)}</b> · revisión ${esc(f.rev)}${f.split?'<br>Desagregación: '+Object.entries(f.split).map(([g,v])=>`${GAS[g]} ${v}`).join(' · '):''}${f.supplier?'<br>Factor específico declarado por el proveedor '+esc((PVBI[f.supplier]||{}).name||''):''}`,
    {badges:srcBadge(f.supplier?'prov':'lib')}));
  /* 4b · asignación automática del factor */
  if(r.fm){ const m=r.fm, tied=fmTied(r);
    blocks.push(traceBlock('Asignación del factor',m.pct==null?'Elegido a mano en la revisión':`${m.pct}% de similitud con «${esc(m.text)}»`,
      `${(m.cands||[]).filter(c=>FBI[c.factor]).slice(0,5).map(c=>`<span class="num">${esc(c.factor)}</span> ${esc(FBI[c.factor].act)} · <b>${c.pct}%</b>${c.factor===r.factor?' ← asignado':''}`).join('<br>')}
       ${tied.length?`<br><span style="color:var(--bad)">⚠ Empate: ${tied.map(esc).join(', ')} tiene la misma similitud. Elegí el factor correcto.</span>`:''}
       <br>${m.ok?`<span class="pill ok">Aprobado</span> <span class="tiny dim">${esc(m.by||'')}${m.at?' · '+esc(new Date(m.at).toLocaleString('es-AR')):''}</span>`:`<span class="pill warn">Pendiente de aprobación</span> ${tied.length?'':`<button class="btn sm" onclick="fmApproveOne('${r.rid}');trace('${r.rid}')">Aprobar</button> `}<button class="btn sm ghost" onclick="closeDrawer();go('asignacion')">Revisar en Asignación de factores</button>`}
       <div class="tiny dim" style="margin-top:4px">Similitud de texto calculada por ${m.engine==='pg_trgm'?'PostgreSQL (pg_trgm)':'el servidor'} entre los factores del mismo alcance, categoría y unidad.</div>`,
      {badges:fmBadge(r)}));
  }
  /* 5 · dato de actividad */
  let act=Object.entries(r.detail||{}).map(([k,v])=>`${esc(k)}: <b>${esc(v)}</b>`).join('<br>');
  if(r.po){ const pv=PVBI[r.po.prov];
    act=`OC <b class="num">${esc(r.po.oc)}</b>${r.po.pos!=='—'?' · Posición <b class="num">'+r.po.pos+'</b>':''}<br>Proveedor: <b>${esc(pv?pv.name:'—')}</b> <span class="dim num">${esc(r.po.prov||'')}</span><br>Material: <b class="num">${esc(r.po.mat)}</b> · Grupo de material <b class="num">${esc(r.po.grp)}</b><br>${r.po.qty!=null?'Cantidad: <b>'+nf(r.po.qty)+' '+r.po.unit+'</b> · ':''}Importe: <b>${nf(r.po.amount,2)} ${r.po.cur}</b> · ${methodPill(r.po.method)}`;
  }
  if(mv){ act=`${nf(mv.qty)} kg recibidos · Documento de material <b class="num">${mv.erpDoc}</b> (MIGO ${mv.mvt})<br>OC <b class="num">${esc(mv.oc)}</b>${mv.pos!=='—'?' · Posición <b class="num">'+mv.pos+'</b>':''} · Material <b class="num">${mv.mat}</b> · ${esc(mv.provName)}`; }
  blocks.push(traceBlock('Dato de actividad',`${nfv(r.qty,2)} ${f.unit} — ${esc(r.source)}`,act,{badges:srcBadge(r.srcAct||srcOf(r))+(r.src==='calc'&&r.baseSrc?' '+srcBadge(r.baseSrc):'')}));
  /* 6 · logística (movimientos) */
  if(mv&&L){
    blocks.push(traceBlock('Información logística',`${MODES[L.mode].n} · ${PLACES[L.from].name} → ${PLACES[L.to].name}`,
      `Distancia del tramo: <b>${nf(L.km)} km</b> · Peso: <b>${nfv(L.t,2)} t</b> · Tramo ${L.i+1} de ${mv.legs.length}<br>Transportista: <b>${esc(L.carrier||mv.carrier)}</b> · Documento: <b class="num">${esc(mv.logDoc)}</b>${mv.distSrc==='calc'?'<br><span style="color:var(--warn)">'+esc(mv.reason)+'</span>':''}`,
      {badges:srcBadge(mv.distSrc),after:`<div style="margin-top:8px"><button class="btn sm" onclick="mvOpenFromTrace('${mv.id}')">Ver el movimiento completo en el mapa</button></div>`}));
  }
  /* 7 · un dato de actividad, dos cálculos (A2 + A3 cat. 3) */
  if(pair){
    const e=r.type==='elec'?r:pair, d=r.type==='elec'?pair:r;
    blocks.push(traceBlock('Mismo dato de actividad, dos cálculos',`${nf(e.qty,1)} kWh`,
      `<div class="twocalc"><div><span class="pill s2">Alcance 2 · 2.1</span><div class="num">${nf(e.qty,1)} × ${FBI[e.factor].v} = <b>${nf(e.kg,2)} kg</b></div><div class="tiny dim">Generación de la electricidad adquirida</div>${e.rid!==r.rid?`<a href="javascript:void(0)" onclick="trace('${e.rid}')">Ver ${e.rid}</a>`:''}</div>
       <div><span class="pill s3">Alcance 3 · Cat. 3</span><div class="num">${nf(d.qty,1)} × ${FBI[d.factor].v} = <b>${nf(d.kg,2)} kg</b></div><div class="tiny dim">Pérdidas de transmisión y distribución</div>${d.rid!==r.rid?`<a href="javascript:void(0)" onclick="trace('${d.rid}')">Ver ${d.rid}</a>`:''}</div></div>
       <div class="tiny dim" style="margin-top:6px">El kWh se registra una sola vez; cada alcance aplica su propio factor. No hay doble conteo del dato de actividad.</div>`));
  }
  /* 8 · ubicación */
  blocks.push(traceBlock('Ubicación en el modelo',st.name,[pc?'Sector: <b>'+esc(pc.sector)+'</b>':null,pc?'Proceso: <b>'+esc(pc.name)+'</b>':null,
    r.line&&LBI[r.line]?'Línea: <b>'+esc(LBI[r.line].name)+'</b>':null,mc?'Equipo: <b>'+esc(mc.name)+'</b>':null].filter(Boolean).join('<br>')||'Registro a nivel de sitio / corporativo'));
  /* 9 · documento de origen */
  blocks.push(traceBlock('Documento de origen',esc(r.origin.doc),`Sistema: <b>${esc(r.origin.sys)}</b><br>Método: ${esc(r.origin.method)}<br>Responsable del dato: ${esc(r.origin.by)}`,{origin:true,badges:srcBadge(srcOf(r))}));
  return `<div class="drawer-h">
      <div style="flex:1;min-width:0">
        <div class="eyebrow">Trazabilidad · registro <span class="num">${r.rid}</span></div>
        <h3>${esc(r.source)}</h3>
        <div class="flexrow" style="margin-top:7px;gap:6px">${[...new Set([r.srcAct,srcOf(r),r.baseSrc,mv?mv.distSrc:null].filter(Boolean))].map(srcBadge).join('')}${srcBadge('calc')}</div>
      </div>
      <button class="btn ghost" onclick="closeDrawer()">Cerrar ✕</button>
    </div>
    <div class="drawer-b">
      <div class="note" style="margin-bottom:18px">Cada resultado se descompone hasta el documento que lo originó. Los badges indican de qué sistema vino cada dato y qué calculó IVZ Carbon.</div>
      <div class="tape">${blocks.join('')}</div>
      <div class="hr"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="exportTrace('${r.rid}')">Exportar cadena (CSV)</button>
        ${r.po||mv?`<button class="btn sm" onclick="toast('Simulación: en el producto final abriría la OC ${esc(mv?mv.oc:r.po.oc)} en SAP (ME23N).','↗')">Abrir OC en SAP</button>`:''}
        <button class="btn sm ghost" onclick="toast('Simulación: en el producto final abriría el documento en ${esc(r.origin.sys.split(' — ')[0])}.','↗')">Ver documento en el sistema de origen</button>
      </div>
    </div>`;
}
function trace(rid){const r=REC.find(x=>x.rid===rid);if(r)openDrawer(traceHTML(r))}
function exportTrace(rid){
  const r=REC.find(x=>x.rid===rid); if(!r) return; const f=FBI[r.factor];
  const rows=[['campo','valor','origen'],['registro',r.rid,''],['periodo',r.p,''],['sitio',SBI[r.site]?SBI[r.site].name:'',''],['alcance',r.scope,''],['categoria',catLabel(catKey(r)),'IVZ Carbon'],
    ['regla',r.rule||'',''],['estado',r.cls?r.cls.state:'',''],['confianza',r.cls?r.cls.conf:'',''],['dato_actividad',r.qty,srcName(r.srcAct||srcOf(r))],['unidad',f.unit,''],
    ['factor_id',f.id,f.src],['factor_valor',f.v,''],['similitud_factor',r.fm&&r.fm.pct!=null?r.fm.pct:'',''],['asignacion_factor',r.fm?(r.fm.ok?'aprobada':'pendiente'):'',r.fm&&r.fm.by||''],['kgCO2e',round(r.kg,4),'Calculado por IVZ Carbon'],['documento',r.origin.doc,r.origin.sys]];
  if(r.po) rows.push(['orden_compra',r.po.oc,'SAP ERP'],['posicion',r.po.pos,'SAP ERP'],['proveedor',r.po.prov,'SAP ERP'],['material',r.po.mat,'SAP ERP'],['grupo_material',r.po.grp,'SAP ERP']);
  if(r.mov){ const mv=MOVBI()[r.mov], L=mv.legs[r.leg]; rows.push(['movimiento',mv.id,''],['guia',mv.logDoc,srcName(mv.distSrc)],['peso_t',L.t,''],['distancia_km',L.km,srcName(mv.distSrc)],['t_km',L.tkm,'Calculado por IVZ Carbon']); }
  downloadText(rows.map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n'),'trazabilidad_'+r.rid+'.csv','text/csv');
  toast('Cadena de trazabilidad exportada.','↧');
}
function downloadText(text,name,type='text/plain'){
  const b=new Blob(['\ufeff'+text],{type:type+';charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

  return `<div class="tblwrap"><table>
    <thead><tr>
      <th>Fuente de emisión</th><th>Sitio</th><th>Categoría</th>
      <th class="r">Dato de actividad</th><th>Factor</th><th class="r">kgCO₂e</th><th>Origen del dato</th><th></th>

    ${shown.map(r=>`<tr class="clickable" onclick="trace('${r.rid}')">

      <td class="dim tiny">${esc(SBI[r.site]?SBI[r.site].name:'Sin planta asignada')}</td>
      <td class="tiny">${opt.showScope!==false?scopePill(r.scope)+' ':''}<span class="dim">${esc(catInfo(catKey(r)).code)}</span></td>
      <td class="r num">${nf(r.qty,1)} <span class="dim">${FBI[r.factor].unit}</span></td>
      <td class="num tiny dim nowrap">${r.factor} ${fmBadge(r)}</td>
      <td class="r num strong">${nf(r.kg,1)}</td>
      <td>${srcBadge(srcOf(r))}</td>
      <td class="tiny nowrap" style="color:var(--accent)">Trazar →</td>
    </tr>`).join('')||`<tr><td colspan="8"><div class="empty" style="padding:22px"><div class="big">Sin registros para el período</div>Esta categoría no tiene datos de actividad cargados en el perímetro seleccionado.</div></td></tr>`}
    </tbody>

const V={};

function head(title,sub,right=''){return `<div class="page-h"><div><h2>${title}</h2><p>${sub}</p></div><div class="right">${right}</div></div>`}
/* Tarjeta de indicador — anatomía del Hub: nombre + ícono, valor, pie con
   variación y, opcionalmente, una barra de avance. Los argumentos opcionales
   (icon, bar, act) se pueden pasar como 5º parámetro suelto o como objeto. */
function kpi(lab,val,unit,foot,opt){
  const o = typeof opt==='string' ? {icon:opt} : (opt||{});
  const ic = o.icon || 'leaf';
  const bar = (o.bar==null) ? '' :
    `<div class="k-bar"><i style="width:${Math.max(0,Math.min(100,o.bar))}%${o.barColor?';background:'+o.barColor:''}"></i></div>`;
  const act = o.onclick ? ` act" onclick="${o.onclick}"${o.ondblclick?` ondblclick="${o.ondblclick}"`:''} tabindex="0` : '';
  return `<div class="card kpi${act}">
    <div class="k-top"><div class="k-name">${lab}</div><div class="k-ico">${ico(ic)}</div></div>
    <div class="val">${val}<small>${unit||''}</small></div>
    <div class="foot">${foot||''}</div>${bar}</div>`;
}
function deltaTag(cur,prev,invert=false){
  if(prev==null||!prev)return '<span class="dim tiny">sin período comparable</span>';
  const d=(cur-prev)/prev*100, up=d>=0;
  const good = invert ? up : !up;
  const arrow = Math.abs(d)<0.05 ? '–' : (up?'▲':'▼');
  const cls = Math.abs(d)<0.05 ? 'flat' : (good?'good':'bad');
  return `<span class="delta ${cls}">${arrow} ${nf(Math.abs(d),1)}%</span><span class="k-target">vs. período anterior</span>`;
}
function monthLabels(f){ return periodsIn({...f,month:'all'}).map(p=>MONTHS[+p.slice(5)-1]) }
function monthSeriesByScope(f){
  const ps=periodsIn({...f,month:'all'});
  const mk=s=>ps.map(p=>sum(REC.filter(r=>r.p===p&&r.scope===s&&(f.site==='all'||r.site===f.site))));
  return [{n:'Alcance 1',c:C.s1,key:'s1',v:mk(1)},{n:'Alcance 2',c:C.s2,key:'s2',v:mk(2)},{n:'Alcance 3',c:C.s3,key:'s3',v:mk(3)}];
}
function deltaMini(cur,prev){
  if(prev==null) return '<span class="tiny dim">sin comparable</span>';
  if(!prev&&!cur) return '<span class="tiny dim">sin variación</span>';
  if(!prev) return '<span class="delta bad tiny">nuevo</span>';
  const d=(cur-prev)/prev*100; if(Math.abs(d)<0.05) return '<span class="delta flat">– 0,0%</span>';
  return `<span class="delta ${d>0?'bad':'good'}">${d>0?'▲':'▼'} ${nf(Math.abs(d),1)}%</span>`;
}
/* % de las emisiones del perímetro calculadas con datos que llegan de sistemas integrados */
function autoShare(rs){ const tot=sum(rs); return {kg:sum(rs.filter(isAuto)), pctKg:pct(sum(rs.filter(isAuto)),tot), n:rs.filter(isAuto).length, pctN:pct(rs.filter(isAuto).length,rs.length)}; }
function perimLabel(f){ return `${f.site==='all'?(SITES.length?`Consolidado de ${SITES.length} sitio${SITES.length===1?'':'s'}`:'Sin plantas modeladas todavía'):(SBI[f.site]?SBI[f.site].name:'')}, ${f.month==='all'?'año '+f.year:pLabel(f.year+'-'+f.month)}`; }

function invScope(f,s,rs,tot){
  const sub=rs.filter(r=>r.scope===s), tsub=sum(sub), keys=CATKEYS[s];

  const pf=prevFilter(f), psub=pf?query(pf).filter(r=>r.scope===s):null, pByK=psub?groupSum(psub,catKey):null;

  const topOf=k=>{const o=groupSum(sub.filter(r=>catKey(r)===k),r=>r.source.split(' · ')[0]);const e=Object.entries(o).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:'—'};
  const sel=S.invSel&&S.invSel.split('.')[0]===String(s)?S.invSel:null; S.invSel=sel;
  const locS2=s===2?sum(sub,locKg):0;
  const card=(k,i)=>{
    const info=catInfo(k), v=byK[k]||0, n=cnt[k]||0, on=sel===k, empty=!n, col=catColor(k,i);

      <div class="cc-h"><span class="cc-code">${esc(info.code)}</span>${info.ic?`<span class="cc-ic">${ico(info.ic)}</span>`:''}</div>
      <div class="cc-n">${esc(info.n)}</div>
      ${empty?`<div class="cc-v zero">0 <small>tCO₂e</small></div><div class="cc-empty">${info.on?'Sin registros para el período':'Sin registros · fuera de alcance en esta etapa'}</div>`
      :`<div class="cc-v">${t(v,2)} <small>tCO₂e</small></div>
        <div class="cc-meta"><span>${nf(pct(v,tsub),1)}% del alcance</span><span>${nf(n)} registros</span></div>
        <div class="cc-trend">${spark(mk[k],col)}${deltaMini(v,pByK?pByK[k]||0:null)}</div>
        ${k==='2.elec'?`<div class="cc-top">Location-based: <b>${t(sum(sub.filter(r=>r.sub==='elec'),locKg),2)} t</b></div>`:''}
        <div class="cc-top">Principal fuente: <b>${esc(topOf(k))}</b></div>
        <div class="cc-foot"><a href="javascript:void(0)" onclick="event.stopPropagation();txFromCat('${k}')">Ver transacciones →</a></div>`}
    </div>`;
  };
  const items=keys.map((k,i)=>({label:catLabel(k),value:byK[k]||0,color:catColor(k,i),key:k,n:cnt[k]||0}));
  const nz=items.filter(x=>x.value>0);
  const pv=pf?sum(psub):null;
  /* cabecera del alcance */
  let headCard=`<div class="card scopehead s${s}" data-tour="inv-head"><div class="card-b" style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">

    <div class="sh-kv"><div class="tiny dim">${s===2?'Total · market-based':'Total del alcance'}</div><div class="num sh-v">${t(tsub,2)} <small>tCO₂e</small></div></div>
    ${s===2?`<div class="sh-kv"><div class="tiny dim">Total · location-based</div><div class="num sh-v">${t(locS2,2)} <small>tCO₂e</small></div></div>`:''}
    <div class="sh-kv"><div class="tiny dim">Del inventario</div><div class="num sh-v">${nf(pct(tsub,tot),1)}<small>%</small></div></div>
    <div class="sh-kv"><div class="tiny dim">Registros</div><div class="num sh-v">${nf(sub.length)}</div></div>
    <div class="sh-kv"><div class="tiny dim">vs. período anterior</div><div style="margin-top:6px">${deltaMini(tsub,pv)}</div></div>
  </div></div>`;
  const gridCls=s===3?'catgrid c5':'catgrid c4';
  const cards=`<div class="${gridCls} mt" data-tour="inv-cards">${keys.map(card).join('')}</div>`;
  /* composición interna */
  let compRight='';
  if(s===2){
    const el=sub.filter(r=>r.sub==='elec'), byT={}; el.forEach(r=>{const k=elType(r);byT[k]=byT[k]||{kwh:0,kg:0,loc:0,n:0};byT[k].kwh+=r.qty;byT[k].kg+=r.kg;byT[k].loc+=locKg(r);byT[k].n++});
    compRight=`<div class="card" data-tour="inv-s2method"><div class="card-h"><h3>Métodos de Alcance 2</h3><div class="sub">location-based y market-based</div></div><div class="card-b">
      <div class="dualm"><div><div class="tiny dim">Market-based (reportado)</div><div class="num dm-v">${t(tsub,2)} <small>t</small></div></div><div><div class="tiny dim">Location-based</div><div class="num dm-v">${t(locS2,2)} <small>t</small></div></div></div>
      <div class="hr"></div><div class="eyebrow" style="margin-bottom:8px">2.1 Electricidad adquirida por tipo de suministro</div>
      <div class="tblwrap"><table><thead><tr><th>Suministro</th><th class="r">MWh</th><th class="r">Market t</th><th class="r">Location t</th></tr></thead><tbody>
      ${Object.keys(ELTYPE).map(k=>{const x=byT[k];return `<tr><td class="tiny">${ELTYPE[k]}</td><td class="r num">${x?nf(x.kwh/1000,1):'<span class="dim">0</span>'}</td><td class="r num">${x?t(x.kg,2):'<span class="dim">0</span>'}</td><td class="r num dim">${x?t(x.loc,2):'0'}</td></tr>`}).join('')}
      </tbody></table></div>
      <div class="tiny dim" style="margin-top:8px">Las pérdidas de transmisión y distribución de esa misma electricidad no están acá: se informan en Alcance 3 — Categoría 3.</div>

  } else {
    compRight=`<div class="card"><div class="card-h"><h3>${s===3?'Participación por categoría':'Participación por subcategoría'}</h3></div><div class="card-b">
      ${nz.length?donut(nz.map(x=>({label:x.label,value:x.value,color:x.color})),{center:t(tsub,0),centerSub:'tCO₂e'})+legend(nz.map(x=>({label:x.label.split(' — ')[0],value:x.value,color:x.color})),tsub):'<div class="empty"><div class="big">Sin emisiones en el período</div></div>'}
      ${s===1?`<div class="note mt tiny">CO₂ biogénico: <b>${sum(sub,r=>r.bio||0)?t(sum(sub,r=>r.bio||0),3)+' t':'0 t'}</b> — se informa aparte y no suma al Alcance 1.</div>`:''}
      </div></div>`;
  }
  const comp=`<div class="grid g23 mt"><div class="card" data-tour="inv-comp"><div class="card-h"><h3>Composición interna del Alcance ${s}</h3><div class="sub">clic en una barra para abrir la categoría</div></div>
    <div class="card-b">${compBars(items,tsub,{onclick:k=>`invPick('${k}')`})}</div></div>${compRight}</div>`;
  return headCard+cards+comp+invDetail(f,s,sub,tsub,sel,tot);
}

        ${kpi('Trazabilidad completa',nf(pct(dRs.filter(isTraceFull).length,dRs.length),0),'%','<span class="dim tiny">hasta el documento de origen</span>',{icon:'route'})}

/* Cat. 1 — de la orden de compra a la emisión */

  const lines=rs.filter(r=>r.po).sort((a,b)=>b.kg-a.kg);
  const byM={}; lines.forEach(r=>{const k=r.po.method;byM[k]=byM[k]||{kg:0,n:0};byM[k].kg+=r.kg;byM[k].n++});
  const ex=lines.find(r=>r.po.method==='fisico'&&r.po.pos!=='—')||lines[0];
  const chain=ex?`<div class="pochain">
    <div class="pc"><div class="pc-l">Orden de compra</div><div class="pc-v num">${esc(ex.po.oc)}</div>${srcBadge('sap')}</div><span class="pc-a">→</span>
    <div class="pc"><div class="pc-l">Línea de compra</div><div class="pc-v">Pos. ${ex.po.pos} · ${esc(ex.po.mat)}</div><div class="tiny dim">${nf(ex.po.qty)} kg · ${esc(PVBI[ex.po.prov].name)}</div></div><span class="pc-a">→</span>
    <div class="pc"><div class="pc-l">Clasificación</div><div class="pc-v">Regla ${ex.rule} · grupo ${esc(ex.po.grp)}</div><div class="tiny dim">Alcance 3 · Cat. 1 · ${ex.cls.conf}%</div></div><span class="pc-a">→</span>
    <div class="pc"><div class="pc-l">Factor</div><div class="pc-v num">${ex.factor} · ${FBI[ex.factor].v}</div><div class="tiny dim">${esc(FBI[ex.factor].src)}</div></div><span class="pc-a">→</span>
    <div class="pc em"><div class="pc-l">Emisión</div><div class="pc-v num">${nf(ex.kg/1000,2)} tCO₂e</div><div class="tiny dim">${nf(ex.qty)} × ${FBI[ex.factor].v}</div></div>
  </div>`:'';
  return `<div class="card flat mt" data-tour="cat1-lines"><div class="card-h"><h3>Compras del ERP que alimentan la Categoría 1</h3><div class="sub">OC → línea de compra → clasificación → factor → emisión</div></div>
    <div class="card-b">${chain}
    <div class="flexrow" style="margin:14px 0 4px;gap:14px">${['fisico','spend','proveedor'].map(k=>`<span class="flexrow" style="gap:6px">${methodPill(k)} <span class="tiny dim">${byM[k]?nf(byM[k].n)+' líneas · '+t(byM[k].kg,1)+' t':'sin líneas'}</span></span>`).join('')}</div></div>
    <div class="card-b tight"><div class="tblwrap" style="max-height:420px"><table><thead><tr><th>Período</th><th>OC</th><th>Pos.</th><th>Proveedor</th><th>Material</th><th>Grupo</th><th class="r">Cantidad</th><th>Unidad</th><th class="r">Importe USD</th><th>Método</th><th>Factor · similitud</th><th>Fuente del factor</th><th class="r">kgCO₂e</th><th>Estado</th></tr></thead><tbody>
    ${lines.slice(0,60).map(r=>`<tr class="clickable" onclick="trace('${r.rid}')"><td class="tiny dim">${pLabel(r.p)}</td><td class="num tiny strong">${esc(r.po.oc)}</td><td class="num tiny">${r.po.pos}</td>
      <td class="tiny">${esc(PVBI[r.po.prov]?PVBI[r.po.prov].name:'—')}</td><td class="tiny">${esc(r.po.mat)}</td><td class="num tiny">${esc(r.po.grp)}</td>
      <td class="r num">${r.po.qty!=null?nf(r.po.qty):'—'}</td><td class="tiny dim">${r.po.unit}</td><td class="r num">${nf(r.po.amount,0)}</td><td>${methodPill(r.po.method)}</td>
      <td class="num tiny nowrap">${r.factor} ${fmBadge(r)}</td><td class="tiny dim">${esc(FBI[r.factor].src)}</td><td class="r num strong">${nf(r.kg,0)}</td><td>${r.fm&&!r.fm.ok?'<span class="pill warn">Factor sin aprobar</span>':r.cls.state==='auto'?'<span class="pill ok">Automático</span>':'<span class="pill warn">Requiere revisión</span>'}</td></tr>`).join('')}
    </tbody></table></div></div></div>`;
}
/* Cat. 4 — resumen de movimientos de insumos */

      <div style="margin-top:8px"><button class="btn sm" onclick="trace('${ex.rid}')">Ver la cadena del ejemplo</button></div>`:''}

/* ------------------------- 8. Trazabilidad ------------------------------ */
S.dr={scope:null,cat:null,site:null,src:null};
const enc=s=>encodeURIComponent(String(s)).replace(/'/g,'%27');
function drill(k,v){v=decodeURIComponent(v); if(k==='scope')v=+v;

/* =========================================================================
   CALIDAD E INCERTIDUMBRE — propagación de errores, alineada conceptualmente
   con ISO 14064-1, el GHG Protocol y la guía de buenas prácticas del IPCC.

     Emisión = dato de actividad × factor de emisión
     U_emisión = √(U_dato² + U_FE²)                     — por fuente
     U_total   = √( Σ(Ei·Ui)² ) / ΣEi                    — al agregar

   La incertidumbre del factor (U_FE) ya vive en FACTORS[].unc, con su
   fuente y año. La del dato de actividad se infiere de su origen (medidor,
   factura, encuesta, spend-based, etc.) — documentada acá, nunca inventada
   registro a registro. No se muestra en el Dashboard Ejecutivo: vive en su
   propia sección, "Calidad e Incertidumbre".
   ========================================================================= */

/* valores de referencia orientativos por origen del dato de actividad —
   bibliografía de uso habitual en inventarios corporativos (GHG Protocol
   Scope 3 Guidance, IPCC 2006 GL Vol. 2 cap. 2). "demo:true" marca los que
   son un valor por defecto del sistema, no un dato validado por la empresa. */
const ACT_UNC = {
 meter:{key:'meter',pct:2,label:'Medidor calibrado',note:'Precisión típica de un medidor certificado de electricidad o gas.',src:'Práctica habitual de medición fiscal'},
 invoice:{key:'invoice',pct:3,label:'Factura del proveedor',note:'Cantidad física facturada por el distribuidor.',src:'Factura — dato físico'},
 erp_physical:{key:'erp_physical',pct:5,label:'Dato físico del ERP',note:'Cantidad física de la orden de compra o el documento de material.',src:'SAP ERP — dato físico'},
 logistics:{key:'logistics',pct:8,label:'Guía de transporte (TMS)',note:'Peso y distancia informados por el transportista.',src:'TMS — guía de transporte'},
 provider_doc:{key:'provider_doc',pct:10,label:'Documento de un tercero',note:'Manifiesto, remito de servicio u otro comprobante de un proveedor.',src:'Documento del proveedor'},
 survey:{key:'survey',pct:25,label:'Encuesta / extrapolación',note:'Muestra de RRHH extrapolada al total de la dotación.',src:'GHG Protocol Scope 3 Guidance — Cat. 7'},
 spend:{key:'spend',pct:35,label:'Base de gasto (spend-based)',note:'Monto en USD como proxy de la actividad física — no hay cantidad física disponible.',src:'GHG Protocol Scope 3 Guidance — spend-based'},
 estimate:{key:'estimate',pct:15,label:'Estimación técnica',note:'Cálculo indirecto (p. ej. potencia × horas) sin medición directa.',src:'Estimación técnica interna'},
 default:{key:'default',pct:20,label:'Valor por defecto del sistema',note:'Sin dato específico disponible para este origen.',src:'Valor orientativo – requiere validación',demo:true},
};
function actUncertaintyOf(r){
  const s=srcOf(r);
  if(r.type==='elec') return s==='iot'?ACT_UNC.meter:s==='invoice'?ACT_UNC.invoice:ACT_UNC.estimate;
  if(r.type==='td') return ACT_UNC.estimate;
  if(r.type==='purchase'&&r.po) return r.po.method==='spend'?ACT_UNC.spend:r.po.method==='proveedor'?ACT_UNC.provider_doc:ACT_UNC.erp_physical;
  if(r.type==='transport') return ACT_UNC.logistics;
  if(r.type==='waste') return ACT_UNC.provider_doc;
  if(r.type==='travel') return ACT_UNC.provider_doc;
  if(r.type==='commute') return ACT_UNC.survey;
  if(r.type==='fugitive') return ACT_UNC.provider_doc;
  if(r.type==='fuel') return s==='invoice'?ACT_UNC.invoice:ACT_UNC.erp_physical;
  return ACT_UNC.default;
}
/* combinada por registro — null si la fuente del factor no publicó incertidumbre.
   Si el usuario validó manualmente la incertidumbre de esta fuente (S.uqOverrides),
   ese valor reemplaza al de referencia por origen — y queda auditado. */
S.uqOverrides={};   // { 'nombre de fuente': {pct,reason,user,date} }
S.uqAudit=[];        // [{source,prev,next,reason,user,date}]
function recordUncertainty(r){
  const f=FBI[r.factor];
  const ov=S.uqOverrides[r.source.split(' · ')[0]];
  const act=ov?{key:'override',pct:ov.pct,label:'Validado manualmente',note:'Motivo: '+ov.reason,src:'Carga manual · '+ov.user+' · '+ov.date,demo:false}:actUncertaintyOf(r);
  const facPct=(f&&f.unc!=null)?f.unc:null;
  if(facPct==null) return {pct:null,actPct:act.pct,act,facPct:null,fac:f};
  return {pct:Math.sqrt(act.pct*act.pct+facPct*facPct),actPct:act.pct,act,facPct,fac:f};
}
/* U_total = √(Σ(Ei·Ui)²) / ΣEi — nunca promedio simple */
function aggregateUncertainty(records){
  let sumE=0,sumSq=0,covE=0;
  records.forEach(r=>{ sumE+=r.kg; const u=recordUncertainty(r); if(u.pct==null) return; covE+=r.kg; sumSq+=Math.pow(r.kg*(u.pct/100),2); });
  if(sumE<=0) return {pct:null,coverage:0,kg:0};
  return {pct:Math.sqrt(sumSq)/sumE*100,coverage:pct(covE,sumE),kg:sumE};
}
/* calidad del dato — cualitativa, deliberadamente independiente del cálculo
   numérico de arriba (nunca se deriva la incertidumbre de este puntaje) */
const DQ_MAP = {
 meter:{label:'Alta',score:5},invoice:{label:'Alta',score:4},erp_physical:{label:'Alta',score:4},
 logistics:{label:'Media',score:3},provider_doc:{label:'Media',score:3},estimate:{label:'Media',score:3},
 survey:{label:'Media',score:2},spend:{label:'Baja',score:1},default:{label:'Baja',score:1},
};
function dataQualityOf(r){ return DQ_MAP[actUncertaintyOf(r).key]||DQ_MAP.default; }
function aggregateQuality(records){
  let sumE=0,sumWS=0; records.forEach(r=>{sumE+=r.kg;sumWS+=r.kg*dataQualityOf(r).score;});
  if(sumE<=0) return {label:'—',score:0};
  const avg=sumWS/sumE;
  return {label:avg>=4?'Alta':avg>=2.5?'Media':'Baja',score:avg};
}
function qPill(label){ return `<span class="pill ${label==='Alta'?'ok':label==='Media'?'warn':'err'}">${label}</span>`; }
/* método de Scope 3 (GHG Protocol) — visible porque afecta representatividad */
const S3_METHOD={purchase:{proveedor:'Supplier-specific',spend:'Spend-based',fisico:'Average-data'},
 transport:'Distance-based',waste:'Average-data',travel:'Distance-based',commute:'Average-data',
 fugitive:'Estimación manual',td:'Average-data'};
function scope3MethodOf(r){
  if(r.scope!==3) return null;
  if(r.type==='purchase'&&r.po) return S3_METHOD.purchase[r.po.method]||'Average-data';
  return S3_METHOD[r.type]||null;
}
/* ranking de fuentes que más aportan a la incertidumbre total del corte */
function uncertaintyHotspots(records,n=6){
  const bySrc={};
  records.forEach(r=>{ const u=recordUncertainty(r); if(u.pct==null) return;
    const k=r.source.split(' · ')[0];
    bySrc[k]=bySrc[k]||{contrib:0,kg:0,recs:[]}; bySrc[k].contrib+=Math.pow(r.kg*(u.pct/100),2); bySrc[k].kg+=r.kg; bySrc[k].recs.push(r); });
  const total=Object.values(bySrc).reduce((a,x)=>a+x.contrib,0);
  return Object.entries(bySrc).sort((a,b)=>b[1].contrib-a[1].contrib).slice(0,n).map(([k,v])=>{
    const rep=v.recs.slice().sort((a,b)=>b.kg-a.kg)[0], u=recordUncertainty(rep);
    return {label:k,pct:total?v.contrib/total*100:0,kg:v.kg,advice:hotspotAdvice(u.act.key,u)};
  });
}
function hotspotAdvice(key,u){
  const base={
   meter:'Ya usa medición directa — lo que queda es incertidumbre del factor; evaluar un factor más específico.',
   invoice:'Dato ya facturado; para bajar más la incertidumbre, evaluar un factor de emisión más específico.',
   erp_physical:'Dato físico del ERP; si el factor aplicado es genérico, un factor supplier-specific la bajaría.',
   logistics:'Mejorar la medición: confirmar que peso y distancia surjan de la guía real, no de una estimación.',
   provider_doc:'Solicitar información más precisa al proveedor (comprobante con detalle de cantidad y tratamiento).',
   survey:'Mejorar la medición: reemplazar la extrapolación de la encuesta por datos reales de traslado.',
   spend:'Pasar de spend-based a datos físicos apenas estén disponibles — es la mayor fuente de incertidumbre del modelo.',
   estimate:'Reemplazar la estimación técnica por una medición directa (medidor o factura).',
   default:'Definir el origen real del dato — hoy usa un valor por defecto del sistema.',
  }[key]||'Revisar el origen del dato de actividad.';
  if(u&&u.facPct!=null&&u.facPct>u.actPct*1.3) return base+' El factor de emisión aplicado pesa más que el dato: usar supplier-specific si existe.';
  return base;
}

S.uq={scope:null,cat:null,src:null};

  else if(k==='cat'){S.uq.cat=(S.uq.cat===v?null:v);S.uq.src=null;}

/* -------------------------------- vista ----------------------------------- */
V.incertidumbre=(f,arg)=>{
  if(arg!=null){ const [sc,ck]=String(arg).split('|'); S.uq={scope:+sc,cat:ck||null,src:null}; }
  const rs=query(f), tot=sum(rs);
  const inv=aggregateUncertainty(rs), invQ=aggregateQuality(rs);
  const lo=tot*(1-(inv.pct||0)/100), hi=tot*(1+(inv.pct||0)/100);
  const crumbs=[['Inventario','uqReset()']];

  const scopeCard=s=>{
    const rsS=rs.filter(r=>r.scope===s), u=aggregateUncertainty(rsS), q=aggregateQuality(rsS), e=sum(rsS);
    const on=S.uq.scope===s;
    return `<div class="card uqcard ${on?'on':''}" onclick="uqDrill('scope',${s})">
      <div class="uq-h"><span class="pill s${s}">Alcance ${s}</span>${qPill(q.label)}</div>
      <div class="uq-v">${t(e,2)}<small> tCO₂e</small></div>
      <div class="uq-u">${e>0&&u.pct!=null?'± '+nf(u.pct,1)+'%':'<span class="dim">sin datos</span>'}</div>
      <div class="tiny dim mt">${e>0?nf(u.coverage,0)+'% con incertidumbre calculada':''}</div>
    </div>`;
  };

  let catBlock='', srcBlock='', hotBlock='';
  const scopedRs = S.uq.scope? rs.filter(r=>r.scope===S.uq.scope) : rs;

  if(S.uq.scope){
    const keys=CATKEYS[S.uq.scope];
    const cards=keys.map(k=>{
      const rsK=rs.filter(r=>catKey(r)===k), e=sum(rsK), u=aggregateUncertainty(rsK), q=aggregateQuality(rsK);
      const info=catInfo(k), on=S.uq.cat===k;
      return `<div class="card uqcard sm ${on?'on':''} ${e?'':'empty'}" onclick="${e?`uqDrill('cat','${qesc(k)}')`:''}">
        <div class="uq-h"><span class="cc-code">${info.code}</span>${e?qPill(q.label):''}</div>
        <div class="uq-n">${esc(info.n)}</div>
        <div class="uq-v sm">${e?t(e,2)+'<small> tCO₂e</small>':'<span class="dim">0 tCO₂e</span>'}</div>
        <div class="uq-u">${e&&u.pct!=null?'± '+nf(u.pct,1)+'%':''}</div>
      </div>`;
    }).join('');
    catBlock=`<div class="card mt"><div class="card-h"><h3>Categorías de Alcance ${S.uq.scope}</h3><div class="sub">clic en una categoría para ver sus fuentes</div></div>
      <div class="card-b"><div class="grid ${S.uq.scope===3?'g5':'g4'}">${cards}</div></div></div>`;
    crumbs.push(['Alcance '+S.uq.scope,"uqDrill('scope',"+S.uq.scope+")"]);
  }

  if(S.uq.scope&&S.uq.cat){
    const rsC=rs.filter(r=>catKey(r)===S.uq.cat);
    const bySrc={}; rsC.forEach(r=>{ const k=r.source.split(' · ')[0]; bySrc[k]=bySrc[k]||[]; bySrc[k].push(r); });
    const rows=Object.entries(bySrc).sort((a,b)=>sum(b[1])-sum(a[1])).map(([k,recs])=>{
      const e=sum(recs), u=aggregateUncertainty(recs), q=aggregateQuality(recs), m=scope3MethodOf(recs[0]);
      const on=S.uq.src===k;
      return `<tr class="clickable ${on?'sel':''}" onclick="uqDrill('src','${qesc(k)}')">
        <td class="strong tiny">${esc(k)}</td>
        ${S.uq.scope===3?`<td class="tiny dim">${m?esc(m):'—'}</td>`:''}
        <td class="tiny">${qPill(q.label)}</td>
        <td class="r num tiny dim">${nf(recs.length)}</td>
        <td class="r num strong">${t(e,3)}</td>
        <td class="r num tiny">${u.pct!=null?'± '+nf(u.pct,1)+'%':'<span class="dim">n/d</span>'}</td></tr>`;
    }).join('');
    srcBlock=`<div class="card mt" id="uqSrcTable"><div class="card-h"><h3>Fuentes · ${esc(catLabel(S.uq.cat))}</h3><div class="sub">clic en una fuente para ver el cálculo completo</div></div>
      <div class="card-b tight"><div class="tblwrap"><table><thead><tr><th>Fuente</th>${S.uq.scope===3?'<th>Método</th>':''}<th>Calidad</th><th class="r">Registros</th><th class="r">tCO₂e</th><th class="r">Incertidumbre</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div></div>`;

  return head('Calidad e Incertidumbre','Incertidumbre por propagación de errores (ISO 14064-1 · GHG Protocol · guía IPCC) y calidad del dato, trazables hasta cada fuente. No reemplaza el inventario — es su capa de análisis técnico.',
    `<button class="btn" onclick="go('reportes')">Ver en reportes →</button>`)

/* =========================================================================
   MOVILIDAD — globo 3D con los traslados de insumos (Cat. 4 o flota propia)
   y los viajes de negocio (Cat. 6), más un mapa de calor de las ubicaciones.
   El globo (globe.js) es un canvas propio con contornos de Natural Earth:
   no depende de teselas ni de servicios de mapas de terceros.
   ========================================================================= */
const MV_F0={prov:'all',mat:'all',mode:'all',cls:'all',src:'all',own:'all',corr:'',q:''};
S.mv = {f:{...MV_F0}, sel:null};
S.mob = {layer:'all', heat:true, heatBy:'mov', tab:'rutas', sel:null, view:null, g:null, d:null};

function mvReset(){ S.mv.f={...MV_F0}; S.mv.sel=null; S.mob.sel=null; render(); }
function mvSet(k,v){ S.mv.f[k]=v; S.mv.sel=null; render(); }
function mvFiltered(f){
  const g=S.mv.f;
  return movQuery(f).filter(m=>
    (g.prov==='all'||m.prov===g.prov||(g.prov==='interno'&&!m.prov)) &&
    (g.mat==='all'||m.matKey===g.mat) &&
    (g.mode==='all'||m.legs.some(L=>L.mode===g.mode)) &&
    (g.cls==='all'||(g.cls==='a1'?m.own:g.cls==='a3'?!m.own:m.state===g.cls)) &&
    (g.src==='all'||m.srcLog===g.src) &&
    (g.own==='all'||(g.own==='propia'?m.own:!m.own)) &&
    (!g.corr||m.legs.some(L=>L.from+'>'+L.to+'>'+L.mode===g.corr)) &&
    (!g.q||(m.id+' '+m.oc+' '+m.provName+' '+m.matName+' '+m.logDoc+' '+m.erpDoc).toLowerCase().includes(g.q.toLowerCase()))
  ).sort((a,b)=>a.date<b.date?-1:1);
}
/* trazado geográfico de un tramo: waypoints de navegación para el marítimo */
function mvLegPath(L){
  const A=PLACES[L.from], B=PLACES[L.to]; if(!A||!B) return null;
  const key=L.from+'>'+L.to;
  if(L.mode==='sea'&&SEAPATH[key]) return [[A.lat,A.lon],...SEAPATH[key],[B.lat,B.lon]];
  return [[A.lat,A.lon],[B.lat,B.lon]];
}
function mvKgOf(m){ return m.kg; }

/* ruta de un viaje de negocio: la cargada con el dato o la que se lee del concepto («Vuelo — A → B») */
const TRIP_RT=new Map();
function tripRoute(r){
  if(r.route&&r.route.from&&r.route.to&&isFinite(r.route.from.lat)&&isFinite(r.route.to.lat)) return r.route;
  if(TRIP_RT.has(r.source)) return TRIP_RT.get(r.source);
  const p=window.IVZGlobe?IVZGlobe.parseRoute(r.source):null;
  const v=p?{from:{name:p[0].name,lat:p[0].lat,lon:p[0].lon},to:{name:p[1].name,lat:p[1].lat,lon:p[1].lon}}:null;
  TRIP_RT.set(r.source,v); return v;
}
const MOB_KIND={plant:{n:'Planta propia',c:'#E8F5EC'},prov:{n:'Origen de proveedor',c:'#A9C4B4'},port:{n:'Nodo de transbordo',c:'#6FC2C3'},city:{n:'Destino de viajes',c:'#C9B6E4'}};

/* todo lo que muestra el globo, calculado sobre el mismo corte que la tabla */
function mobData(f){
  const ms=mvFiltered(f), corr={};
  ms.forEach(m=>m.legs.forEach(L=>{
    if(!PLACES[L.from]||!PLACES[L.to]) return;
    const k=L.from+'>'+L.to+'>'+L.mode;
    const c=corr[k]||(corr[k]={key:k,from:L.from,to:L.to,mode:L.mode,kg:0,kgExt:0,t:0,tkm:0,km:L.km,n:0,own:0,movs:[]});
    c.kg+=L.kg||0; if(!m.own) c.kgExt+=L.kg||0; c.t+=L.t||0; c.tkm+=L.tkm||0; c.n++; if(m.own) c.own++; c.movs.push(m.id);
  }));
  const trips={}, unmapped=[]; let tripKg=0, hotelKg=0, tripN=0;
  query(f).filter(r=>r.type==='travel').forEach(r=>{
    if(r.unit!=='km'){ hotelKg+=r.kg; return; }
    tripKg+=r.kg; tripN++;
    const rt=tripRoute(r); if(!rt){ unmapped.push(r); return; }
    const k=rt.from.name+'>'+rt.to.name;
    const t=trips[k]||(trips[k]={key:k,from:rt.from,to:rt.to,kg:0,km:0,n:0,pax:0,recs:[]});
    t.kg+=r.kg; t.km+=r.qty; t.n++; t.pax+=(+((r.detail||{})['Pasajeros'])||1); t.recs.push(r.rid);
  });
  const lay=S.mob.layer;
  const routes=[];
  if(lay!=='via') Object.values(corr).forEach(c=>routes.push({id:'C:'+c.key,type:'ins',c,kg:c.kg,label:PLACES[c.from].name+' → '+PLACES[c.to].name}));
  if(lay!=='ins') Object.values(trips).forEach(t=>routes.push({id:'T:'+t.key,type:'via',t,kg:t.kg,label:t.from.name+' → '+t.to.name}));
  routes.sort((a,b)=>b.kg-a.kg);
  const maxKg=Math.max(0,...routes.map(r=>r.kg));
  const ramp=window.IVZGlobe?IVZGlobe.ramp:()=>'#8FD3A3';
  routes.forEach(r=>{ r.w=maxKg?Math.sqrt(r.kg/maxKg):0; r.color=ramp(r.w); r.hot=r.w>=0.72; });
  /* ubicaciones: nodos del corte y sus emisiones (movilidad: cada traslado reparte su emisión entre origen y destino) */
  const places={};
  const P=(key,name,lat,lon,kind)=>places[key]||(places[key]={key,name,lat,lon,kind,kg:0,inv:0,routes:new Set()});
  routes.forEach(r=>{
    if(r.type==='ins'){ const A=PLACES[r.c.from],B=PLACES[r.c.to];
      [[r.c.from,A],[r.c.to,B]].forEach(([k,p])=>{ const x=P('P:'+k,p.name,p.lat,p.lon,p.kind==='plant'?'plant':p.kind==='port'?'port':'prov'); x.kg+=r.kg/2; x.routes.add(r.id); }); }
    else [r.t.from,r.t.to].forEach(p=>{ const x=P('Y:'+p.name,p.name,p.lat,p.lon,'city'); x.kg+=r.kg/2; x.routes.add(r.id); });
  });
  const inv=groupSum(query(f),'site');
  SITES.forEach(s=>{ const lat=+s.lat, lon=+s.lon; if(!isFinite(lat)||!isFinite(lon)||(!lat&&!lon)) return;
    const pk=PLACES[s.id]?'P:'+s.id:'S:'+s.id; const x=P(pk,s.name,lat,lon,'plant'); x.inv=inv[s.id]||0; x.site=s.id; });
  const pl=Object.values(places);
  const hv=x=>S.mob.heatBy==='inv'?x.inv:x.kg;
  const maxH=Math.max(0,...pl.map(hv));
  pl.forEach(x=>{ x.h=hv(x); x.w=maxH?Math.sqrt(x.h/maxH):0; });
  pl.sort((a,b)=>b.h-a.h);
  const kgExt=ms.filter(m=>!m.own).reduce((a,m)=>a+m.kg,0), kgOwn=ms.filter(m=>m.own).reduce((a,m)=>a+m.kg,0);
  return {ms,corr:Object.values(corr),trips:Object.values(trips),routes,places:pl,unmapped,tripKg,hotelKg,tripN,kgExt,kgOwn,maxKg,maxH};
}

/* ------------------------------ montaje del globo ------------------------ */
function mobDestroy(){ if(S.mob.g){ S.mob.view=S.mob.g.getView(); S.mob.g.destroy(); S.mob.g=null; } }
function mobMount(f){
  const host=document.getElementById('mobGlobe'); if(!host) return;
  mobDestroy();
  if(!window.IVZGlobe){ host.innerHTML=`<div class="mapfb">${ico('info')} No se pudo cargar el globo. Las tablas de movilidad siguen disponibles más abajo.</div>`; return; }
  const g=S.mob.g=IVZGlobe.create(host,{
    label:'Globo de movilidad: traslados de insumos y viajes de negocio',
    tooltip:mobTip,
    onClick:it=>{ if(it){ if((it.ref||it.id)!==S.mob.sel) mobSelect(it.ref||it.id,false); } else if(S.mob.sel) mobSelect(null); }
  });
  mobRefresh(f,true);
}
function mobRefresh(f=S.f,first=false){
  const g=S.mob.g; if(!g) return;
  const d=S.mob.d=mobData(f);
  const arcs=d.routes.map(r=>r.type==='ins'
    ? {id:r.id,path:mvLegPath({from:r.c.from,to:r.c.to,mode:r.c.mode}),alt:r.c.mode==='air'?undefined:r.c.mode==='sea'?0.006:0.012,
       color:r.color,width:1.2+2.6*r.w,pulse:r.hot,dash:r.c.own===r.c.n?[2,4]:null,label:r.label,r}
    : {id:r.id,from:[r.t.from.lat,r.t.from.lon],to:[r.t.to.lat,r.t.to.lon],color:r.color,width:1.2+2.6*r.w,pulse:r.hot,dash:[6,5],label:r.label,r});
  const sel=S.mv.sel&&MOV.find(m=>m.id===S.mv.sel);
  if(sel) sel.legs.forEach((L,i)=>{ const p=mvLegPath(L); if(p) arcs.push({id:'M:'+sel.id+':'+i,group:'M:'+sel.id,path:p,alt:L.mode==='air'?undefined:0.016,color:'#F2D14B',width:3.4,label:sel.id+' · '+MODES[L.mode].n,comet:true}); });
  const points=d.places.filter(x=>S.mob.layer==='all'||x.routes.size||(x.kind==='plant'&&S.mob.layer==='ins'))
    .map(x=>({id:x.key,lat:x.lat,lon:x.lon,h:x.kind==='plant'?0.05:0.015,size:x.kind==='plant'?4.6:3.2,color:MOB_KIND[x.kind].c,selColor:'#F2D14B',label:x.name,x}));
  const heat=S.mob.heat?d.places.filter(x=>x.h>0).map(x=>({id:'H:'+x.key,ref:x.key,lat:x.lat,lon:x.lon,w:x.w,x})):[];
  /* al elegir una ubicación, sus trayectos quedan resaltados (mismo grupo) */
  const sp=mobIsPlace(S.mob.sel)&&d.places.find(x=>x.key===S.mob.sel);
  if(sp){ points.forEach(p=>{ if(p.id===sp.key) p.group=sp.key; }); arcs.forEach(a=>{ if(sp.routes.has(a.id)) a.group=sp.key; }); heat.forEach(h=>{ if(h.ref===sp.key) h.group=sp.key; }); }
  g.setData({arcs,points,heat});
  if(first){
    const ll=[...points.map(p=>[p.lat,p.lon])];
    g.fit(ll,{home:true,instant:true,maxZoom:1.6,tilt:8});
    if(S.mob.view) g.setView(S.mob.view);
  }
  if(sel){ g.select('M:'+sel.id+':0',false); }
  else if(S.mob.sel) g.select(S.mob.sel,false);
  else g.select(null,false);
  g.setEmpty(arcs.length||points.length?'':'Sin traslados ni viajes en el corte seleccionado.');
  mobRenderSide();
  const lg=document.getElementById('mobLegend'); if(lg) lg.innerHTML=mobLegend();
  document.querySelectorAll('[data-mob-layer]').forEach(b=>b.classList.toggle('on',b.dataset.mobLayer===S.mob.layer));
  const hb=document.getElementById('mobHeatBtn'); if(hb) hb.classList.toggle('on',S.mob.heat);
}
function mobSetLayer(l){ S.mob.layer=l; S.mob.sel=null; mobRefresh(); }
function mobToggleHeat(){ S.mob.heat=!S.mob.heat; mobRefresh(); }
function mobHeatBy(v){ S.mob.heatBy=v; mobRefresh(); }
function mobTab(t){ S.mob.tab=t; mobRenderSide(); }
const mobIsPlace=id=>/^[PYS]:/.test(id||'');
function mobSelect(id,fly=true){
  S.mob.sel=id&&id!==S.mob.sel?id:null;
  if(S.mv.sel){ S.mv.sel=null; document.querySelectorAll('tr[data-mov]').forEach(x=>x.classList.remove('mvsel')); }
  if(S.mob.sel) S.mob.tab=mobIsPlace(S.mob.sel)?'lugares':'rutas';
  mobRefresh();
  if(S.mob.g&&S.mob.sel&&fly) S.mob.g.select(S.mob.sel,true);
}

function mobTip(it){
  const d=S.mob.d; if(!d) return '';
  if(it.kind==='arc'&&it.r){ const r=it.r;
    if(r.type==='ins'){ const c=r.c;
      return `<b>${esc(r.label)}</b><div class="d">${MODES[c.mode].n} · ${nf(c.km)} km por tramo${c.own===c.n?' · flota propia':''}</div>
        <div style="margin-top:5px">${nf(c.n)} traslado${c.n===1?'':'s'} · ${nfv(c.t,1)} t · ${nf(c.tkm,0)} t·km</div>
        <div><b>${nf(c.kg/1000,2)} tCO₂e</b> ${c.own===c.n?'<span class="d">(referencia; ya en Alcance 1)</span>':'<span class="d">Alcance 3 · Cat. 4</span>'}</div>`; }
    const t=r.t;
    return `<b>${esc(r.label)}</b><div class="d">Viaje de negocio · vuelo</div>
      <div style="margin-top:5px">${nf(t.n)} reserva${t.n===1?'':'s'} · ${nf(t.km)} km</div><div><b>${nf(t.kg/1000,2)} tCO₂e</b> <span class="d">Alcance 3 · Cat. 6</span></div>`;
  }
  if(it.kind==='arc') return `<b>${esc(it.label||'')}</b><div class="d">Movimiento seleccionado</div>`;
  const x=it.x; if(!x) return '';
  return `<b>${esc(x.name)}</b><div class="d">${MOB_KIND[x.kind].n}</div>
    ${x.kg?`<div style="margin-top:5px">Movilidad: <b>${nf(x.kg/1000,2)} tCO₂e</b> <span class="d">(${x.routes.size} trayecto${x.routes.size===1?'':'s'})</span></div>`:''}
    ${x.site?`<div>Inventario del sitio: <b>${nf(x.inv/1000,1)} tCO₂e</b></div>`:''}`;
}
function mobLegend(){
  const d=S.mob.d;
  return `<div class="row"><span>Menor</span><span class="ramp"></span><span>Mayor emisión</span></div>
    <div class="row"><i class="ln"></i>Insumos <i class="ln dash"></i>Viajes <i class="ln dot"></i>Flota propia</div>

function mobInsight(d){
  const L=[], tot=d.routes.reduce((a,r)=>a+r.kg,0);
  if(d.routes.length>2&&tot){ const top=d.routes.slice(0,3).reduce((a,r)=>a+r.kg,0); L.push(`Los <b>3 trayectos</b> de mayor emisión concentran el <b>${nf(top/tot*100,0)}%</b> de lo que muestra el mapa.`); }
  const air=d.corr.filter(c=>c.mode==='air'), tAll=d.corr.reduce((a,c)=>a+c.t,0), kAll=d.corr.reduce((a,c)=>a+c.kgExt,0);
  if(air.length&&tAll&&kAll){ const ta=air.reduce((a,c)=>a+c.t,0), ka=air.reduce((a,c)=>a+c.kgExt,0);
    L.push(`El transporte <b>aéreo</b> mueve el ${nf(ta/tAll*100,1)}% de las toneladas de insumos y genera el <b>${nf(ka/kAll*100,0)}%</b> de sus emisiones.`); }
  const fl=d.trips.slice().sort((a,b)=>b.kg-a.kg)[0];
  if(fl&&d.tripKg) L.push(`Viaje con mayor huella: <b>${esc(fl.from.name)} → ${esc(fl.to.name)}</b> (${nf(fl.kg/d.tripKg*100,0)}% de los vuelos).`);
  if(d.unmapped.length) L.push(`${nf(d.unmapped.length)} viaje${d.unmapped.length===1?'':'s'} sin origen o destino reconocible no se dibuja${d.unmapped.length===1?'':'n'} (${nf(d.unmapped.reduce((a,r)=>a+r.kg,0)/1000,2)} tCO₂e). Cargalos como «Ciudad → Ciudad» o con las columnas origen y destino.`);
  if(!L.length) return '';
  return `<div class="mob-note"><h4>Lectura del mapa</h4>${L.map(x=>`<p>${x}</p>`).join('')}</div>`;
}

S.txf={sys:'all',cat:'all',scope:'all',state:'all',rule:'all',src:'all',q:''};
function setTx(k,v){S.txf[k]=v;render()}
function txReset(){S.txf={sys:'all',cat:'all',scope:'all',state:'all',rule:'all',src:'all',q:''};render()}
function classifyAll(){
  const pend=query(S.f).filter(r=>r.cls&&r.cls.state!=='auto');
  pend.forEach(r=>{r.cls.state='auto';r.cls.conf=round(84+rnd()*14)});
  MOV.forEach(m=>{ if(m.state!=='auto'&&periodsIn(S.f).includes(m.p)){ m.state='auto'; m.conf=Math.round(88+rnd()*10);
    m.legs.forEach(L=>{const r=REC.find(x=>x.rid===L.rid); if(r&&r.cls){r.cls.state='auto';r.cls.conf=m.conf}}); } });
  toast(nf(pend.length)+' transacciones confirmadas. En el producto final el motor propone alcance, categoría y factor, y el usuario confirma o corrige.','✓');render();
}
function txApplyRule(rid){ const r=REC.find(x=>x.rid===rid); if(!r)return;
  r.cls.state='auto'; r.cls.conf=round(86+rnd()*12);
  toast('Registro '+rid+' confirmado con la clasificación propuesta ('+(r.rule||'manual')+').','✓'); render(); }
V.transacciones=f=>{
  const base=query(f).filter(r=>r.cls);
  let rs=base;
  const x=S.txf;
  if(x.sys!=='all')rs=rs.filter(r=>r.origin.sys===x.sys);
  if(x.scope!=='all')rs=rs.filter(r=>String(r.scope)===x.scope);
  if(x.cat!=='all')rs=rs.filter(r=>catKey(r)===x.cat);
  if(x.state!=='all')rs=rs.filter(r=>r.cls.state===x.state);
  if(x.rule!=='all')rs=rs.filter(r=>r.rule===x.rule);
  if(x.src!=='all')rs=rs.filter(r=>srcOf(r)===x.src);
  if(x.q)rs=rs.filter(r=>(r.source+' '+r.origin.doc+' '+(r.po?r.po.oc:'')).toLowerCase().includes(x.q.toLowerCase()));
  rs=rs.slice().sort((a,b)=>b.kg-a.kg);
  const all=base.length, pend=base.filter(r=>r.cls.state!=='auto').length;
  const systems=[...new Set(base.map(r=>r.origin.sys))];
  const cats=[...new Set(base.map(catKey))].sort();
  const srcs=[...new Set(base.map(srcOf))];
  const rules=[...new Set(base.map(r=>r.rule).filter(Boolean))].sort();
  const bySys=groupSum(base,r=>r.origin.sys.split(' — ')[0]);
  const byRule={}; base.forEach(r=>{const k=r.rule||'—';byRule[k]=byRule[k]||{kg:0,n:0};byRule[k].kg+=r.kg;byRule[k].n++});
  const fld=(lab,key,opts)=>`<div class="fld"><label>${lab}</label><select onchange="setTx('${key}',this.value)">${opts.map(([v,l])=>`<option value="${v}" ${x[key]===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
  return head('Transacciones y clasificación','Los datos que llegan de los sistemas de gestión, clasificados por el motor de reglas: alcance, categoría, método y factor. Cada transacción conserva el vínculo con su comprobante.',
   `${pend?`<button class="btn primary" onclick="classifyAll()">Confirmar ${pend} pendientes</button>`:''}<button class="btn" onclick="go('integraciones')">Integraciones ERP →</button>`)
  +`<div class="grid g4" data-tour="tx-kpis">
      ${kpi('Transacciones procesadas',nf(all),'',`<span class="dim tiny">${perimLabel(f)}</span>`,{icon:'swap'})}
      ${kpi('Emisiones asociadas',t(sum(base),1),' tCO₂e','',{icon:'leaf'})}
      ${kpi('Clasificación automática',nf(pct(all-pend,all),0),'%',`<span class="dim tiny">sobre el umbral de confianza del ${CONF_THR}%</span>`,{icon:'sigma',bar:pct(all-pend,all)})}
      ${kpi('Requieren revisión',nf(pend),'',pend?`<span class="pill warn">Acción pendiente</span>`:'<span class="pill ok">Al día</span>',{icon:'info',onclick:"setTx('state','review')"})}
   </div>
   <div class="card mt" data-tour="tx-table"><div class="card-h"><h3>Registro de transacciones</h3>
       <div class="sub">${nf(rs.length)} de ${nf(all)} · clic para abrir la cadena completa</div>
       <div class="right"><div class="searchbox"><span class="dim">⌕</span><input placeholder="Buscar OC, proveedor o comprobante" value="${esc(x.q)}" oninput="S.txf.q=this.value;clearTimeout(window._d);window._d=setTimeout(render,280)"></div>
         <button class="btn sm ghost" onclick="txReset()">Limpiar</button></div></div>
       <div class="card-b" style="padding-bottom:0"><div class="filtrow">
         ${fld('Alcance','scope',[['all','Todos'],['1','Alcance 1'],['2','Alcance 2'],['3','Alcance 3']])}
         ${fld('Categoría','cat',[['all','Todas'],...cats.map(k=>[k,catLabel(k)])])}
         ${fld('Sistema de origen','sys',[['all','Todos'],...systems.map(s=>[s,s])])}
         ${fld('Origen del dato','src',[['all','Todos'],...srcs.map(s=>[s,srcName(s)])])}
         ${fld('Regla aplicada','rule',[['all','Todas'],...rules.map(r=>[r,r+' — '+RBI[r].when])])}
         ${fld('Estado','state',[['all','Todos'],['auto','Clasificada'],['review','Requiere revisión']])}
       </div></div>
       <div class="card-b tight"><div class="tblwrap" style="max-height:560px"><table>
       <thead><tr><th>Comprobante</th><th>Descripción</th><th>Sistema</th><th>Clasificación</th><th>Regla</th><th class="r">Dato</th><th class="r">kgCO₂e</th><th>Confianza · similitud</th><th>Estado</th></tr></thead><tbody>
       ${rs.slice(0,70).map(r=>`<tr class="clickable" onclick="trace('${r.rid}')">
         <td class="num tiny">${esc(r.origin.doc.length>26?r.origin.doc.slice(0,26)+'…':r.origin.doc)}</td>
         <td class="strong tiny"><div class="clip" title="${esc(r.source)}">${esc(r.source)}</div></td>
         <td class="tiny">${srcBadge(srcOf(r))}</td>
         <td class="tiny">${scopePill(r.scope)} <span class="dim">${esc(catInfo(catKey(r)).code)}</span></td>
         <td class="num tiny dim" title="${esc(r.rule?RBI[r.rule].when:'')}">${r.rule||'—'}</td>
         <td class="r num">${nf(r.qty,1)} <span class="dim">${FBI[r.factor].unit}</span></td>
         <td class="r num strong">${nf(r.kg,0)}</td>
         <td class="nowrap">${r.fm?fmBadge(r):confBar(r.cls)}</td>
         <td class="nowrap">${r.cls.state==='auto'?'<span class="pill ok">Clasificada</span>':`<span class="pill warn">Revisión</span> <button class="btn sm" onclick="event.stopPropagation();txApplyRule('${r.rid}')">Confirmar</button>`}</td></tr>`).join('')||`<tr><td colspan="9"><div class="empty" style="padding:22px"><div class="big">Sin resultados</div>Ajustá los filtros para ver transacciones.</div></td></tr>`}
       </tbody></table></div>
       ${rs.length>70?`<div class="tiny dim" style="padding:8px 10px">Mostrando 70 de ${nf(rs.length)} transacciones.</div>`:''}</div></div>
   <div class="grid g23 mt">
       <div class="card" data-tour="tx-rules"><div class="card-h"><h3>Reglas de clasificación</h3><div class="sub">condición del ERP → alcance, categoría, método y factor</div></div>
         <div class="card-b tight"><div class="tblwrap" style="max-height:360px"><table><tbody>
         ${RULES.map(r=>{const u=byRule[r.id]||{kg:0,n:0};
           return `<tr class="clickable" onclick="setTx('rule','${r.id}')" style="${x.rule===r.id?'background:var(--accent-soft)':''}">
           <td><div class="strong tiny">${r.id} · ${esc(r.when)}</div>
             <div class="tiny dim">→ ${r.scope===3?'Alcance 3 · Cat. '+r.cat:'Alcance '+r.scope+' · '+(r.scope===1?S1SUB[r.sub].code+' '+S1SUB[r.sub].n:S2SUB[r.sub].code+' '+S2SUB[r.sub].n)} · ${esc(r.method)} · <span class="num">${r.factor}</span></div>
             <div class="tiny dim">Clasificado automáticamente · Confianza ${r.conf}%</div></td>
           <td class="r num tiny nowrap">${u.n?nf(u.n)+' reg.<br><b>'+autoKg(u.kg)+'</b>':'<span class="dim">sin uso</span>'}</td></tr>`}).join('')}
         </tbody></table></div>
         <div class="note" style="margin:12px">Por debajo del ${CONF_THR}% de confianza la transacción no se contabiliza como clasificada: queda marcada como <b>Requiere revisión</b> para que una persona confirme la categoría antes del cierre.</div></div></div>
       <div class="card"><div class="card-h"><h3>Volumen por sistema de origen</h3><div class="sub">emisiones del período</div></div><div class="card-b">

/* términos de búsqueda de cada factor: los de la biblioteca IVZ (fijos), los aprendidos al aprobar y los agregados a mano */
let FM_LIB=null;
function factorTermsHTML(x){
  if(FM_LIB===null){ FM_LIB={}; api('/api/factors/terms').then(t=>{FM_LIB=t;if(S.view==='factores')render();}).catch(()=>{}); }
  const lib=FM_LIB[x.id]||[], own=x.alias||[];
  return `<div class="fmterms">${lib.map(t=>`<span class="fmterm lib" title="Término de la biblioteca IVZ">${esc(t)}</span>`).join('')}${own.map((t,i)=>`<span class="fmterm" title="Término de la organización">${esc(t)}<button onclick="factorTermRemove('${esc(x.id)}',${i})" title="Quitar">×</button></span>`).join('')}<button class="fmterm add" onclick="factorTermAdd('${esc(x.id)}')">＋ término</button></div>`;
}
function factorTermAdd(id){ const f=FBI[id]; if(!f) return; const t=(prompt('Término de búsqueda para «'+f.act+'» (por ejemplo, cómo aparece en las órdenes de compra):')||'').trim(); if(!t) return;
  const n=normTxt(t); if(n.length<2) return;
  FACTORS.forEach(x=>{ if(x.alias){ const i=x.alias.findIndex(a=>normTxt(a)===n); if(i>=0) x.alias.splice(i,1); } });
  (f.alias=f.alias||[]).push(t.slice(0,200)); toast('Término agregado a '+id+'.','✓'); render(); }
function factorTermRemove(id,i){ const f=FBI[id]; if(f&&f.alias){ f.alias.splice(i,1); render(); } }
V.factores=f=>{
  const used=groupSum(query(f),'factor');
  const sub=x=>x.scope===3?'Cat. '+x.cat:(x.scope===1?S1SUB[x.sub||'stat'].code:S2SUB[x.sub||'elec'].code);
  return head('Catálogo de factores de emisión','Factores administrables por la organización, con fuente, revisión e incertidumbre. Cada cálculo guarda la versión del factor que se aplicó. Los términos de búsqueda sirven para asignar el factor por similitud.',

  +`<div class="card"><div class="card-b tight"><div class="tblwrap"><table>
    <thead><tr><th>ID</th><th>Actividad</th><th>Alcance</th><th>Ubicación</th><th class="r">Factor</th><th>Unidad</th><th class="r">Incert.</th><th>Fuente</th><th>Revisión</th><th class="r">Uso en el período</th></tr></thead><tbody>
    ${FACTORS.map(x=>`<tr><td class="num tiny strong">${x.id}</td><td>${esc(x.act)}${factorTermsHTML(x)}</td>
      <td>${scopePill(x.scope)}</td><td class="tiny dim">${sub(x)}${x.el?' · '+ELTYPE[x.el]:''}</td>
      <td class="r num strong">${x.v}</td><td class="tiny dim">kgCO₂e/${x.unit}</td>
      <td class="r num tiny ${x.unc>25?'':'dim'}" style="${x.unc>25?'color:var(--warn)':''}">±${x.unc}%</td>
      <td class="tiny dim">${esc(x.src)}</td><td class="num tiny">${x.rev}</td>
      <td class="r num tiny">${used[x.id]?autoKg(used[x.id]):'<span class="dim">—</span>'}</td></tr>`).join('')}
    </tbody></table></div></div></div>
    <div class="note mt">Los valores mostrados son referencias de trabajo cargadas para el prototipo. Un inventario con validez de reporte requiere revisar la vigencia y la aplicabilidad de cada factor con la fuente oficial correspondiente.</div>`;

/* ------------------ exportación del inventario a XLSX ------------------- */
function exportInventoryXLSX(f){
  const rs=query(f), sc=byScope(rs), tot=sum(rs), ck=byCatKey(rs);
  const cnt={}; rs.forEach(r=>{const k=catKey(r);cnt[k]=(cnt[k]||0)+1});
  const resumen=[['Huella de Carbono Corporativa — IVZ Carbon '+APP_VERSION],['Perímetro',perimLabel(f)],[],
    ['Alcance / categoría','tCO2e','% del total','Registros']];
  [1,2,3].forEach(s=>{ resumen.push(['Alcance '+s,round(sc[s]/1000,3),round(pct(sc[s],tot),1),rs.filter(r=>r.scope===s).length]);
    CATKEYS[s].forEach(k=>resumen.push(['   '+catLabel(k),round((ck[k]||0)/1000,3),round(pct(ck[k]||0,tot),1),cnt[k]||0])); });
  resumen.push(['Total',round(tot/1000,3),100,rs.length]);
  resumen.push([],['Alcance 2 — location-based (tCO2e)',round(sum(rs.filter(r=>r.scope===2),locKg)/1000,3)]);
  resumen.push(['CO2 biogénico informado por separado (t)',round(sum(rs,r=>r.bio||0)/1000,3)]);
  const det=[['registro','periodo','sitio','alcance','categoria','fuente','dato_actividad','unidad','factor','valor_factor','kgCO2e','regla','estado','confianza','origen_dato','sistema','documento']];
  rs.forEach(r=>det.push([r.rid,r.p,SBI[r.site]?SBI[r.site].name:'',r.scope,catLabel(catKey(r)),r.source,round(r.qty,3),FBI[r.factor].unit,r.factor,FBI[r.factor].v,round(r.kg,3),r.rule||'',r.cls?r.cls.state:'',r.cls?r.cls.conf:'',srcName(srcOf(r)),r.origin.sys,r.origin.doc]));
  const movs=[['movimiento','fecha','oc','material','proveedor','origen','destino','tramos','peso_t','t_km','alcance','tCO2e','estado']];
  movQuery(f).forEach(m=>movs.push([m.id,m.date,m.oc,MATS[m.matKey].short,m.provName,PLACES[m.from].name,PLACES[m.to].name,m.legs.length,round(m.t,3),round(m.tkm,2),m.own?'1 (flota propia)':'3 · Cat. 4',round(m.kg/1000,4),m.state]));
  const fac=[['id','actividad','alcance','ubicacion','factor','unidad','incertidumbre','fuente','revision']];
  FACTORS.forEach(x=>fac.push([x.id,x.act,x.scope,x.scope===3?'Cat. '+x.cat:(x.scope===1?S1SUB[x.sub||'stat'].code:S2SUB[x.sub||'elec'].code),x.v,x.unit,x.unc+'%',x.src,x.rev]));
  const sit=[['sitio','nombre','pais','tipo','dotacion','superficie_m2','A1_t','A2_t','A3_t','total_t']];
  SITES.forEach(s=>{const r2=rs.filter(r=>r.site===s.id),b=byScope(r2);
    sit.push([s.id,s.name,s.country,s.type,s.people,s.area,round(b[1]/1000,3),round(b[2]/1000,3),round(b[3]/1000,3),round(sum(r2)/1000,3)])});
  if(typeof XLSX==='undefined'){
    downloadText(det.map(r=>r.join(';')).join('\n'),'inventario_corporativo.csv','text/csv');
    toast('El componente de Excel no está disponible: se exportó el inventario en CSV.','↧'); return;
  }
  const wb=XLSX.utils.book_new();
  [['Resumen',resumen],['Inventario',det],['Movimientos',movs],['Factores',fac],['Sitios',sit]].forEach(([n,d])=>
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(d),n));
  XLSX.writeFile(wb,'huella_corporativa_'+(f.month==='all'?f.year:f.year+'-'+f.month)+'.xlsx');
  toast('Inventario exportado con 5 hojas: resumen, registros, movimientos, factores y sitios.','↧');
}

V.planta=f=>{
  const curP = f.month!=='all' ? (f.year+'-'+f.month) : null;
  const cards = SITES.map(site=>{
    const rs = query({...f,site:site.id});
    const a1 = sum(rs.filter(r=>r.scope===1)), a2 = sum(rs.filter(r=>r.scope===2));
    const invs = REC.filter(r=>r.site===site.id&&r.src==='invoice'&&r.type!=='td').sort((a,b)=>a.p<b.p?1:-1).slice(0,4);
    const missing = curP && !REC.some(r=>r.site===site.id&&r.p===curP&&r.type==='elec');
    return locCard(site,a1,a2,invs,missing,curP);
  }).join('');
  return head('Ubicaciones y facturas','Todas las sedes de la empresa — plantas, oficinas y depósitos. Cargar la factura de electricidad o de gas de cada una calcula al instante su Alcance 1 o 2, sin modelar equipo por equipo.',

  +`<div class="grid g2" data-tour="loc-cards">${cards}</div>
    <div class="note mt">Cargar una factura para un sitio y un período reemplaza cualquier estimación anterior de esa misma energía en ese período — nunca se suma, para que el total no quede duplicado. El detalle histórico por equipo sigue disponible en «Consumo energético».</div>`;
};
function locCard(site,a1,a2,invs,missing,curP){
  return `<div class="card loccard">
    <div class="lc-h"><div class="lc-ic">${ico(siteIcon(site.type))}</div>
      <div style="min-width:0;flex:1"><div class="lc-name">${esc(site.name)}</div>
        <div class="lc-meta">${esc(site.type)} · ${esc(site.country)}${site.people?' · '+nf(site.people)+' pers.':''}${site.area?' · '+nf(site.area)+' m²':''}</div></div></div>
    <div class="lc-kpis">
      <div><div class="lc-kv">Alcance 1</div><div class="lc-val">${t(a1,2)}<small> tCO₂e</small></div></div>
      <div><div class="lc-kv">Alcance 2</div><div class="lc-val">${t(a2,2)}<small> tCO₂e</small></div></div>
    </div>

    <div class="lc-actions">
      <button class="btn sm" onclick="openInvoiceModal('${site.id}','elec')">${ico('bolt')} Factura de electricidad</button>
      <button class="btn sm" onclick="openInvoiceModal('${site.id}','gas')">${ico('flame')} Factura de gas natural</button>
    </div>
    <div class="lc-inv"><div class="lc-inv-t">Facturas cargadas</div>
      ${invs.length?invs.map(r=>`<div class="invrow clickable" onclick="trace('${r.rid}')">
        <span class="tiny strong">${esc(pLabel(r.p))}</span><span class="tiny dim">${r.type==='elec'?'Electricidad':'Gas natural'}</span>
        <span class="tiny num">${nfv(r.qty,0)} ${r.unit}</span><span class="tiny num strong">${t(r.kg,3)} t</span></div>`).join(''):
        '<div class="tiny dim" style="padding:5px 0 2px">Todavía no se cargó ninguna factura para esta sede.</div>'}
    </div></div>`;
}

async function uploadDocument(path,formData){
  const r=await fetch(path,{method:'POST',headers:{'X-IVZ-Carbon':'1'},body:formData});
  if(!r.ok){let body;try{body=await r.json()}catch{body={detail:await r.text().catch(()=>r.statusText)}}throw new Error(typeof body.detail==='string'?body.detail:'La solicitud contiene datos inválidos.');}
  return r.json();
}
S.inv = {step:1,siteId:null,kind:null,fileName:null,period:null,qty:0,provider:'',doc:'',simulated:true,reading:false,readMessage:''};
function openInvoiceModal(siteId,kind){
  const site=SBI[siteId];
  S.inv = {step:1,siteId,kind,fileName:null,period:nextInvoicePeriod(siteId,kind),qty:invSimQty(site,kind),
    provider:kind==='elec'?(site.cc==='UY'?'UTE':'Edenor'):(site.cc==='UY'?'UTE':'Metrogas'),doc:'',
    simulated:true,reading:false,readMessage:''};
  openModal(invModalHTML());
}
function invRerender(){ const m=document.querySelector('#mscrim .modal'); if(m) m.innerHTML=invModalHTML(); }
function nextInvoicePeriod(siteId,kind){
  const have=new Set(REC.filter(r=>r.site===siteId&&(kind==='elec'?r.type==='elec':(r.type==='fuel'&&r.factor==='FE-001'))).map(r=>r.p));
  for(let i=PERIODS.length-1;i>=0;i--){ if(!have.has(PERIODS[i])) return PERIODS[i]; }
  return PERIODS[PERIODS.length-1];
}
function invSimQty(site,kind){
  const base = kind==='elec' ? (site.type==='Oficina'?2100:site.type==='Depósito'?820:(site.people||30)*95)
                              : (site.type==='Oficina'?160:110);
  return Math.round(base*(0.85+Math.random()*0.3));
}
async function invPickFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  S.inv.fileName=f.name; S.inv.simulated=false; S.inv.reading=true; S.inv.readMessage='';
  if(!S.inv.doc) S.inv.doc='FC-'+Math.floor(1000+Math.random()*8999);
  S.inv.step=2; invRerender();
  try{
    const fd=new FormData(); fd.append('kind',S.inv.kind); fd.append('file',f,f.name);
    const result=await uploadDocument('/api/parse-document',fd);
    const d=result.fields||{};
    if(d.provider) S.inv.provider=d.provider;
    if(d.period){ ensurePeriod(d.period); S.inv.period=d.period; }
    if(d.qty) S.inv.qty=d.qty;
    if(d.doc) S.inv.doc=d.doc;
    S.inv.readMessage=result.message||'';
  }catch(e){
    S.inv.readMessage='No se pudo leer el documento: '+e.message;
  }
  S.inv.reading=false; invRerender();
}
function invUseSample(){
  S.inv.fileName=(S.inv.kind==='elec'?'factura_electricidad_':'factura_gas_')+S.inv.period+'.pdf';
  if(!S.inv.doc) S.inv.doc='FC-'+Math.floor(1000+Math.random()*8999);
  S.inv.simulated=true; S.inv.readMessage='';
  S.inv.step=2; invRerender();
}
function invBack(){ S.inv.step=1; invRerender(); }
function invSet(k,v){ S.inv[k]=(k==='qty')?(+v||0):v; }
function invConfirm(){
  const site=SBI[S.inv.siteId];
  if(!(S.inv.qty>0)){ toast('Ingresá una cantidad mayor a cero.','⚠'); return; }
  if(!S.inv.period){ toast('Elegí un período.','⚠'); return; }

/* =========================================================================
   CENTRO DE DATOS — configuración inicial y carga periódica por Excel.
   Flujo del asistente: 1) elegir qué se importa → 2) cargar archivo →
   3) preview y mapeo → 4) validar → 5) importar. La estructura de planta
   se sigue modelando en «Plantas y operaciones»: acá solo se referencia.
   ========================================================================= */
/* --------------------------- períodos dinámicos --------------------------- */
/* una carga puede traer un período que todavía no existe en la demo (p.ej.
   un mes futuro): se agrega a PERIODS para que todos los filtros lo vean */
function ensurePeriod(p){ if(p && !PERIODS.includes(p)){ PERIODS.push(p); PERIODS.sort(); } }
function yearsAvailable(){ return [...new Set(PERIODS.map(p=>p.slice(0,4)))].sort().reverse(); }
function validPeriod(s){ return /^20\d{2}-(0[1-9]|1[0-2])$/.test(String(s||'').trim()); }
/* Una fecha como la deja Excel al abrir o guardar la planilla: 2026-08, 2026-08-15, 08/2026, 15/08/2026,
   ago-26, agosto 2026, Aug-26 o el número de serie de una celda de fecha (.xlsx). Devuelve AAAA-MM-DD
   (día 01 si solo viene el mes) o null. Día/mes/año como se escribe en Argentina y Uruguay. */
const MONTH_NAMES={ene:1,jan:1,feb:2,mar:3,abr:4,apr:4,may:5,jun:6,jul:7,ago:8,aug:8,sep:9,set:9,oct:10,nov:11,dic:12,dec:12};
function toISODate(v){
  const s=String(v==null?'':v).trim().toLowerCase(); if(!s) return null;
  const out=(y,m,d)=>{ y=+y; m=+m; d=+(d||1); if(y<100) y+=2000;
    if(!(y>=2000&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31)) return null;
    return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); };
  let x;
  if((x=s.match(/^(\d{4})[-\/.](\d{1,2})(?:[-\/.](\d{1,2}))?(?:[t\s].*)?$/))) return out(x[1],x[2],x[3]);
  if((x=s.match(/^(\d{4})(\d{2})$/))) return out(x[1],x[2]);
  if((x=s.match(/^(\d{1,2})[-\/.](\d{4})$/))) return out(x[2],x[1]);
  if((x=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/))) return out(x[3],x[2],x[1]);
  if((x=s.match(/^(?:(\d{1,2})[\s\-\/.]+(?:de\s+)?)?([a-z]{3})[a-z]*\.?[\s\-\/.]+(?:de\s+)?(\d{2}|\d{4})$/))&&MONTH_NAMES[x[2]]) return out(x[3],MONTH_NAMES[x[2]],x[1]);
  if(/^\d{5}(\.\d+)?$/.test(s)){ const n=+s; if(n>=36526&&n<=73415){ const d=new Date(Date.UTC(1899,11,30)+Math.floor(n+1/1440)*86400000);  /* un minuto de tolerancia: una fecha guardada desde otra zona horaria queda en 46234,9994 */ return out(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); } }
  return null;
}

/* ------------------------------ utilidades -------------------------------- */
const normTxt = s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
let UID=1000; const nid2=(p='X')=>p+'-'+(++UID);
/* coincidencia difusa por superposición de palabras — para que "Compra acero"
   encuentre la actividad "Compra de materiales", o "Viajes avión" encuentre
   "Viajes de negocio", sin exigir el nombre exacto del catálogo */
function tokenOverlapMatch(query,candidates,keyFn){
  const nq=normTxt(query); if(!nq) return null;
  const exact=candidates.find(c=>normTxt(keyFn(c))===nq); if(exact) return exact;
  const qWords=nq.split(' ').filter(w=>w.length>2);
  let best=null,bestScore=0;
  candidates.forEach(c=>{
    const cn=normTxt(keyFn(c));
    if(cn.includes(nq)||nq.includes(cn)){ if(cn.length>bestScore){best=c;bestScore=cn.length+100;} return; }
    const cWords=cn.split(' ').filter(w=>w.length>2);
    const overlap=qWords.filter(w=>cWords.includes(w)).length;
    if(overlap>0 && overlap>=Math.min(qWords.length,cWords.length)*0.5 && overlap>bestScore){ best=c; bestScore=overlap; }
  });
  return best;
}
function findSiteLoose(s){ if(!s)return null; const n=normTxt(s); return SITES.find(x=>normTxt(x.id)===n) || tokenOverlapMatch(s,SITES,x=>x.name); }
function findBizLoose(s,scopeFilter){ if(!s)return null; const n=normTxt(s); let pool=BIZ; if(scopeFilter)pool=pool.filter(b=>scopeFilter.includes(b.scope));
  return pool.find(x=>normTxt(x.id)===n) || tokenOverlapMatch(s,pool,x=>x.name); }
/* ===================== ASIGNACIÓN AUTOMÁTICA DE FACTORES =====================
   Cada dato que entra sin factor (posición de OC, baja de stock, viaje, residuo, consumo…) recibe
   el factor de la biblioteca más parecido a su descripción. La similitud la calcula PostgreSQL
   (pg_trgm) en el servidor, entre los factores del mismo alcance, categoría y unidad. La
   asignación queda en r.fm con su porcentaje y espera que una persona la apruebe; si otro factor
   tiene el mismo porcentaje es un empate y se marca con advertencia. Al aprobar, el texto queda
   como término de búsqueda del factor elegido: la próxima vez coincide al 100%. */
const FM_HIGH=80, FM_MID=50, FM_WARN=75;  /* FM_WARN: «Aprobar todo» avisa cuántas quedan por debajo */
async function matchFactors(specs){
  if(window.carbonSave) await window.carbonSave();  // los términos aprendidos recién aprobados ya tienen que estar en el servidor
  const out=[];
  for(let i=0;i<specs.length;i+=2000){
    const res=await api('/api/factors/match',{method:'POST',body:JSON.stringify({items:specs.slice(i,i+2000)})});
    res.results.forEach(x=>out.push({...x,engine:res.engine}));
  }
  return out;
}
/* lo que se busca y entre qué factores: null si no hay texto para comparar */
function fmSpec(text,o={}){
  const t=String(text||'').trim(); if(!t) return null;
  return {text:t.slice(0,500),scope:o.scope||null,cat:o.cat||null,sub:o.sub||null,unit:o.unit||null,supplier:o.supplier||null};
}
function fmFrom(m){ return {text:m.text,auto:m.factor,pct:m.pct,tie:m.tie,cands:[{factor:m.factor,pct:m.pct},...(m.alts||[])],ok:false,engine:m.engine}; }
function supplierIdOf(name){ const n=normTxt(name); if(!n) return null; const p=PROVS.find(p=>p.id===name||normTxt(p.name)===n); return p?p.id:null; }
const fmPending=rs=>rs.filter(r=>r.fm&&!r.fm.ok);
function fmTone(p){ return p==null?'':p>=FM_HIGH?'ok':p>=FM_MID?'warn':'err'; }
/* factores con el mismo porcentaje que el asignado, mientras la asignación no fue aprobada */
function fmTied(r){ const m=r.fm; if(!m||m.ok||!m.tie) return []; return (m.cands||[]).filter(c=>c.pct===m.pct&&c.factor!==r.factor).map(c=>c.factor); }
function fmBadge(r){
  const m=r.fm; if(!m) return '';
  const f=FBI[r.factor], tied=fmTied(r);
  const tip=(m.pct==null?'Factor elegido a mano en la revisión':'Similitud '+m.pct+'% entre «'+m.text+'» y «'+(f?f.act:r.factor)+'»')
    +(tied.length?' · Empate con '+tied.join(', '):'')+(m.ok?' · Aprobado'+(m.by?' por '+m.by:''):' · Pendiente de aprobación');
  return `<span class="pill ${fmTone(m.pct)} fmb${m.ok?'':' pend'}" title="${esc(tip)}">${tied.length?'⚠ ':''}${m.pct==null?'manual':m.pct+'%'}</span>`;
}
function fmSetFactor(r,fid){
  const f=FBI[fid]; if(!f) return;
  r.factor=fid; r.unit=f.unit; r.kg=r.qty*f.v; r.scope=f.scope; r.cat=f.cat||null;
  if(f.scope!==3) r.sub=f.sub||(f.scope===2?'elec':'stat');
  if(f.bio) r.bio=r.qty*f.bio; else delete r.bio;
  if(r.fm){ const c=(r.fm.cands||[]).find(c=>c.factor===fid); r.fm.pct=c?c.pct:null; }
}
/* el texto aprobado pasa a ser término de búsqueda del factor (y deja de serlo de cualquier otro) */
function fmLearn(r){
  const t=normTxt(r.fm.text), f=FBI[r.factor]; if(!f||t.length<3) return;
  FACTORS.forEach(x=>{ if(x!==f&&x.alias){ const i=x.alias.findIndex(a=>normTxt(a)===t); if(i>=0) x.alias.splice(i,1); } });
  if(normTxt(f.act)===t||(f.alias||[]).some(a=>normTxt(a)===t)) return;
  (f.alias=f.alias||[]).push(r.fm.text.trim().slice(0,200));
  if(f.alias.length>500) f.alias.shift();
}
function fmApprove(r){
  if(!r.fm||r.fm.ok) return false;
  r.fm.ok=true; r.fm.by=window.carbonUser?window.carbonUser():'Usuario IVZ Carbon'; r.fm.at=new Date().toISOString();
  fmLearn(r); return true;
}
function fmApproveOne(rid){ const r=REC.find(x=>x.rid===rid); if(r&&fmApprove(r)){ S.fmSel.delete(rid); toast('Factor '+r.factor+' aprobado para «'+r.fm.text+'».','✓'); render(); } }
function fmChoose(rid,fid){
  const r=REC.find(x=>x.rid===rid); if(!r||!r.fm||!FBI[fid]) return;
  fmSetFactor(r,fid); r.fm.ok=false; fmApprove(r); S.fmSel.delete(rid);
  /* el texto ya es término del factor elegido: los pendientes con el mismo texto coinciden al 100% (siguen sin aprobar) */
  const t=normTxt(r.fm.text); let n=0;
  REC.forEach(x=>{ if(x!==r&&x.fm&&!x.fm.ok&&normTxt(x.fm.text)===t&&FBI[x.factor].unit===FBI[fid].unit){
    x.fm.cands=[{factor:fid,pct:100},...(x.fm.cands||[]).filter(c=>c.factor!==fid)]; fmSetFactor(x,fid); x.fm.tie=false; n++; } });

/* texto y filtros para buscar el factor de un registro ya cargado */
function recMatchSpec(r){
  const f=FBI[r.factor]; if(!f) return null;
  const o={scope:f.scope,cat:f.scope===3?f.cat:null,unit:f.unit};
  const text=r.source.split(' · ')[0];
  if(r.type==='purchase') return fmSpec(text,{...o,supplier:r.po&&r.po.prov||null});
  if(r.type==='commute') return fmSpec(text+' '+((SBI[r.site]||{}).country||''),o);
  if(r.type==='travel'||r.type==='waste') return fmSpec(text,o);
  return null;
}
async function fmAnalyzeExisting(){
  const closed=window.carbonClosedYears?window.carbonClosedYears():new Set();
  const todo=query(S.f).filter(r=>!r.fm&&!closed.has(+r.p.slice(0,4))).map(r=>[r,recMatchSpec(r)]).filter(([,s])=>s);
  if(!todo.length){ toast('No hay compras, viajes, residuos ni traslados sin asignación automática en el perímetro (años abiertos).','—'); return; }
  if(!confirm('Buscar el factor por similitud para '+nf(todo.length)+' registros del perímetro (compras, viajes, residuos y traslados)?\n\nSi el factor más parecido es otro, se reemplaza y se recalcula la emisión. Todos quedan pendientes de aprobación.')) return;
  S.fmBusy=true; render();
  try{
    const res=await matchFactors(todo.map(([,s])=>s)); let n=0, changed=0;
    todo.forEach(([r],i)=>{ const m=res[i]; if(!m||!m.factor) return; const before=r.factor; r.fm=fmFrom(m); if(m.factor!==before){ fmSetFactor(r,m.factor); changed++; } n++; });
    S.fmLastEngine=res[0]&&res[0].engine;
    toast(nf(n)+' registros con factor asignado por similitud'+(changed?' ('+nf(changed)+' cambiaron de factor)':'')+'. Quedan pendientes de aprobación.','✓');
  }catch(e){ toast('No se pudo buscar factores por similitud: '+e.message,'⚠'); }
  finally{ S.fmBusy=false; render(); }
}

function fmFiltered(f){

  if(x.band!=='all') rs=rs.filter(r=>fmTone(r.fm.pct)===x.band);

function fmApproveAll(){
  const rs=fmFiltered(S.f).filter(r=>!r.fm.ok), tied=rs.filter(r=>fmTied(r).length).length, todo=rs.filter(r=>!fmTied(r).length);

  S.fmSel.clear();
  toast(nf(n)+' asignaciones aprobadas.'+(tied?' '+nf(tied)+' con empate quedaron pendientes.':''),tied?'⚠':'✓'); render();
}
