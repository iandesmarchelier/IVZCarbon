/* Alta/baja de sitios reales (SITES/SBI) — lo que consume "Planta por defecto"
   en actividades, facturas y consumos periódicos. Es deliberadamente liviano
   (nombre, país, tipo, dotación, superficie): el modelo físico detallado de
   sectores, procesos, líneas y máquinas se sigue armando aparte, en el
   Modelador de planta, tal como pide la especificación original. */
function addSiteManual(o){
  const id=o.id||nid2('S');
  const cc=countryToCC(o.country);
  const s={id,name:o.name,country:o.country||'',cc,type:o.type||'',ef:cc==='UY'?'FE-011':'FE-010',people:+o.people||0,area:+o.area||0,addr:o.addr||''};
  SITES.push(s); SBI[id]=s;
  logImport('Planta','Alta manual — '+s.name,1);
  return s;
}
/* baja en cascada: sin esto, una planta borrada dejaría líneas, máquinas,
   procesos, equipos y registros de emisión apuntando a un sitio inexistente
   — exactamente el tipo de referencia colgante que rompe el resto de las
   vistas (Modelo digital de planta, Trazabilidad, tablas "Emisiones por
   sitio"…), que acceden a SBI[site].name sin verificar primero que exista. */
function deleteSite(id){
  const s=SBI[id]; if(!s) return;
  const idx=SITES.findIndex(x=>x.id===id); if(idx<0) return;
  SITES.splice(idx,1); delete SBI[id];
  for(let i=MACH.length-1;i>=0;i--){ if(MACH[i].site===id){ delete MBI[MACH[i].id]; MACH.splice(i,1); } }
  for(let i=LINES.length-1;i>=0;i--){ if(LINES[i].site===id) LINES.splice(i,1); }
  for(let i=PROCS.length-1;i>=0;i--){ if(PROCS[i].id && PROCS[i].site===id){ delete PBI[PROCS[i].id]; PROCS.splice(i,1); } }
  BIZ.forEach(b=>{ if(b.site===id) b.site=''; });
  for(let i=REC.length-1;i>=0;i--){ if(REC[i].site===id) REC.splice(i,1); }
  for(let i=MOV.length-1;i>=0;i--){ if(MOV[i].site===id) MOV.splice(i,1); }
  toast('Planta «'+s.name+'» eliminada, junto con sus líneas, procesos, equipos, registros y movimientos.','✕'); render();
}

/* registro directo con factor explícito (compras, residuos, viajes, transporte) */
function addDirectRecord(o){
  if(!FBI[o.factor]) return {err:'Factor de emisión desconocido: «'+o.factor+'».'};
  ensurePeriod(o.p);
  const r=rec({p:o.p,type:o.type,site:o.site,source:o.source,qty:+o.qty,unit:FBI[o.factor].unit,factor:o.factor,
    src:o.src||'excel',srcAct:o.srcAct||o.src||'excel',
    detail:o.detail||{},po:o.po||null,mov:o.mov||null,leg:o.leg,
    origin:{sys:o.sys||SYS.plan,doc:o.doc||'—',method:o.method||'Carga por Excel — dato de actividad × factor',by:o.by||'Usuario IVZ Carbon'},
    cls:{state:'auto',conf:round(84+rnd()*14)}});
  if(o.fm) r.fm=o.fm;
  postProcessRecord(r);
  return {ok:1,rec:r};
}
/* origen y destino de un viaje cargado por planilla: coordenadas si vienen, si no el nombre de la ciudad */
function travelRouteFromRow(row){
  const end=(name,lat,lon)=>{
    const la=parseFloat(String(lat||'').replace(',','.')), lo=parseFloat(String(lon||'').replace(',','.'));
    if(isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180) return {name:String(name||'').trim()||(la.toFixed(2)+', '+lo.toFixed(2)),lat:la,lon:lo};
    const g=name&&window.IVZGlobe?IVZGlobe.geocode(name):null;
    return g?{name:String(name).trim()||g.name,lat:g.lat,lon:g.lon}:null;
  };
  const a=end(row.origen,row.lat_origen,row.lon_origen), b=end(row.destino,row.lat_destino,row.lon_destino);
  return a&&b?{from:a,to:b}:null;
}
/* alta de un movimiento de insumos desde planilla: crea el nodo geográfico si no existe */
function placeKeyFor(name,lat,lon){
  const n=normTxt(name);
  const hit=Object.entries(PLACES).find(([k,p])=>normTxt(p.name)===n||normTxt(k)===n);
  if(hit) return hit[0];
  const k='PL'+(Object.keys(PLACES).length+1);
  const g=(!(+lat)||!(+lon))&&window.IVZGlobe?IVZGlobe.geocode(name):null;
  PLACES[k]={name:name||'Ubicación sin nombre',short:name,lat:+lat||(g?g.lat:-34.6),lon:+lon||(g?g.lon:-58.4),kind:'prov'};
  return k;
}
function addMovManual(row){
  if(!validPeriod((row.fecha||'').slice(0,7))) return {err:'Fecha inválida: usá AAAA-MM-DD.'};
  const p=(row.fecha||'').slice(0,7);
  const site=findSiteLoose(row.destino)||SBI[row.destino]||null;
  const mode=(()=>{const n=normTxt(row.modo_transporte);
    if(n.includes('mar')||n.includes('fluv')||n.includes('barco')||n.includes('sea'))return 'sea';
    if(n.includes('aer')||n.includes('avi')||n.includes('air'))return 'air'; return 'road'})();
  const t2=+row.peso_t||(+row.cantidad?+row.cantidad/1000:0);
  const km=+row.distancia_km;
  if(!(t2>0)) return {err:'Peso inválido: informá peso_t o cantidad en kg.'};
  if(!(km>0)) return {err:'Distancia inválida (distancia_km).'};
  const own=normTxt(row.propiedad_transporte).includes('propia');
  const from=placeKeyFor(row.origen,row.lat_origen,row.lon_origen);
  const to=site?site.id:placeKeyFor(row.destino,row.lat_destino,row.lon_destino);
  if(site&&!PLACES[site.id]) PLACES[site.id]={name:site.name,short:site.name,lat:+site.lat||-34.6,lon:+site.lon||-58.4,kind:'plant',site:site.id};
  const matKey=Object.keys(MATS).find(k=>normTxt(MATS[k].short)===normTxt(row.material)||MATS[k].id===row.material)||'insumos';
  const mat=MATS[matKey];
  const id=row.movimiento_id||('MOV-'+p.replace('-','')+'-'+String(++MOVN).padStart(3,'0'));
  const leg={i:0,from,to,mode,km,t:t2,tkm:round(t2*km,2),fe:MODES[mode].fe};
  const mv={id,p,date:row.fecha,site:site?site.id:(SITES[0]?SITES[0].id:''),from,to,
    oc:row.orden_compra||'—',pos:'—',prov:null,provName:row.proveedor||'Proveedor sin identificar',
    matKey,mat:mat.id,matName:mat.name,grp:mat.grp,grpName:mat.grpName,
    qty:+row.cantidad||round(t2*1000),unit:'kg',t:t2,own,carrier:row.transportista||'—',
    logDoc:row.documento_logistico||'—',provDoc:'—',erpDoc:row.documento_erp||'—',mvt:'101',
    srcAct:'excel',srcLog:'excel',distSrc:'excel',state:'auto',conf:round(84+rnd()*12),reason:'',
    purchase:null,legs:[leg],inInv:!own};
  if(!own){
    const res=addDirectRecord({p,type:'transport',site:mv.site,mov:id,leg:0,src:'excel',
      source:`Transporte ${MODES[mode].n.toLowerCase()} — ${mat.short} · ${PLACES[from].name} → ${PLACES[to].name}`,
      qty:leg.tkm,factor:leg.fe,
      detail:{'Peso transportado':nf(t2,2)+' t','Distancia del tramo':nf(km)+' km','Transportista':mv.carrier},
      doc:mv.logDoc,method:'Peso transportado × distancia del tramo (t·km) × factor por modo'});
    if(res.err) return res;
    leg.rid=res.rec.rid; leg.kg=res.rec.kg;
  } else { leg.kg=leg.tkm*FBI[leg.fe].v; }
  mv.tkm=leg.tkm; mv.kg=leg.kg; mv.rule=own?'R-07':'R-06';
  MOV.push(mv);
  return {ok:1};
}

/* -------------------- registro genérico de actividad periódica ------------ */
/* Todas las cargas de "Consumos y actividades" (facturas de energía u otras
   actividades de negocio) terminan acá, en el mismo motor de Activity
   Records que ya usa el resto de la plataforma (rec()/REC). */
/* Recargar la misma actividad para el mismo sitio/período reemplaza el registro
   anterior (y su par de Alcance 3 Cat. 3, si lo tenía) en vez de sumarse — mismo
   criterio que ya usa clearPriorEnergy para las facturas cargadas a mano. Sin esto,
   corregir un dato ya importado por Excel requiere borrar todo el inventario. */
function clearPriorActivity(siteId,period,activityId){
  for(let i=REC.length-1;i>=0;i--){
    const r=REC[i];
    if(r.site===siteId&&r.p===period&&r.activityId===activityId){
      if(r.pair){ const j=REC.findIndex(x=>x.rid===r.pair); if(j>=0) REC.splice(j,1); }
      REC.splice(i,1);
    }
  }
}
/* dato de una actividad configurada: se busca entre los factores de su alcance, categoría y unidad */
function activityMatchSpec(b,site,text){
  const sub=b.scope===2&&FBI[b.factor]?FBI[b.factor].sub||'elec':null;  // electricidad con electricidad, vapor con vapor
  return fmSpec([text||b.name,site&&site.country].filter(Boolean).join(' '),{scope:b.scope,cat:b.scope===3?b.cat:null,unit:b.unit,sub}); }
function registerActivityRecord(o){
  const b=BIZBI()[o.activityId]; if(!b) return null;
  const factor=o.fm&&FBI[o.fm.auto]?o.fm.auto:b.factor;
  if(!FBI[factor]){ toast('La actividad «'+b.name+'» todavía no tiene un factor de emisión vinculado — el registro se guardó pero no suma emisiones. Vinculá un factor desde Factores de emisión.','⚠'); return null; }
  ensurePeriod(o.period);
  const siteId=o.siteId||(SITES[0]?SITES[0].id:'');
  const site=siteId?SBI[siteId]:null;
  const type=bizType(b);
  clearPriorActivity(siteId,o.period,o.activityId);
  const r=rec({p:o.period,type,site:siteId,proc:null,line:null,activityId:o.activityId,
    source:b.name+(o.doc?' · '+o.doc:(site?' · '+site.name:'')),
    qty:+o.qty, unit:FBI[factor].unit, factor,
    detail:Object.fromEntries(Object.entries({Proveedor:o.provider,Importe:o.amount?nf(o.amount,2)+' '+(o.currency||''):null,Observaciones:o.notes}).filter(([,v])=>v)),
    origin:{sys:'Centro de Datos — '+(o.via||'carga manual'),doc:o.doc||'—',method:'Carga periódica de actividad de negocio',by:o.by||'Usuario IVZCarbon'}});
  if(b.scope===3) r.cls={state:'auto',conf:96};
  if(o.fm) r.fm=o.fm;
  /* misma electricidad, dos cálculos: igual que en una factura cargada a mano
     (addInvoiceRecord), toda actividad de Alcance 2 tipo "elec" — venga de Excel
     o de carga manual — genera también su par de Alcance 3 Cat. 3 (pérdidas de
     transmisión y distribución) con el factor de red del país del sitio. */
  if(type==='elec'&&site){
    const d=rec({p:o.period,type:'td',site:siteId,source:'Pérdidas de red asociadas a '+site.name,qty:+o.qty,unit:'kWh',
      src:'calc',baseSrc:'excel',factor:site.cc==='UY'?'FE-021':'FE-020',
      detail:{'Consumo aguas abajo':nf(+o.qty)+' kWh'},
      origin:{sys:SYS.calc,doc:'derivado de '+r.rid,method:'Mismo consumo eléctrico del Alcance 2 × factor de pérdidas de red',by:'Motor de cálculo IVZ Carbon'}});
    r.pair=d.rid; d.pair=r.rid;
    postProcessRecord(d);
  }
  logImport(b.scope===1||b.scope===2?'Consumo energético':'Actividad de negocio', b.name+' · '+pLabel(o.period)+' · '+nf(o.qty,1)+' '+r.unit, 1);
  return r;
}

/* ===================== ZONA DE DATOS DE EJEMPLO ==========================
   Igual que en IVZ Sustainability Hub: se puede borrar solo los números de
   la demo (registros y movimientos) manteniendo la estructura, vaciar todo
   para modelar la operación real, o restaurar la foto inicial. REC y MOV
   son arrays donde solo se hace push, así que los datos de demostración
   son siempre los primeros N. */
const DEMO_BOUNDARY = {recCount:REC.length, movCount:MOV.length, periods:PERIODS.slice()};
const DEMO_SNAPSHOT = JSON.parse(JSON.stringify({
  SITES,PROCS,LINES,MACH,BIZ,REC,MOV,PERIODS,WASTECAT
}));
function restoreDemoData(){
  const d=JSON.parse(JSON.stringify(DEMO_SNAPSHOT));
  SITES.splice(0,SITES.length,...d.SITES); Object.keys(SBI).forEach(k=>delete SBI[k]); SITES.forEach(s=>SBI[s.id]=s);
  PROCS.splice(0,PROCS.length,...d.PROCS); Object.keys(PBI).forEach(k=>delete PBI[k]); PROCS.forEach(p=>PBI[p.id]=p);
  LINES.splice(0,LINES.length,...d.LINES); Object.keys(LBI).forEach(k=>delete LBI[k]); LINES.forEach(l=>LBI[l.id]=l);
  MACH.splice(0,MACH.length,...d.MACH); Object.keys(MBI).forEach(k=>delete MBI[k]); MACH.forEach(m=>MBI[m.id]=m);
  BIZ=d.BIZ;
  REC.splice(0,REC.length,...d.REC);
  MOV.splice(0,MOV.length,...d.MOV);
  WASTECAT.splice(0,WASTECAT.length,...d.WASTECAT); Object.keys(WCBI).forEach(k=>delete WCBI[k]); WASTECAT.forEach(w=>WCBI[w.id]=w);
  PERIODS.splice(0,PERIODS.length,...d.PERIODS);
  S.recentImports=[]; S.dr={scope:null,cat:null,site:null,src:null}; S.node=null; S.invSel=null;
  S.mv.sel=null; S.mv.f={prov:'all',mat:'all',mode:'all',cls:'all',src:'all',own:'all',q:''};
  S.f={year:'2025',month:'all',site:'all'};
  closeModal(); dcGo('config');
  toast('Datos de demostración restaurados: ubicaciones, facturas, actividades, registros y movimientos volvieron al estado inicial.','↺');
}
function clearDemoData(){
  REC.splice(0, Math.min(DEMO_BOUNDARY.recCount, REC.length));
  MOV.splice(0, Math.min(DEMO_BOUNDARY.movCount, MOV.length));
  S.recentImports=[]; S.dr={scope:null,cat:null,site:null,src:null}; S.node=null; S.invSel=null; S.mv.sel=null;
  closeModal(); dcGo('periodica');
  toast('Datos de demostración eliminados. La estructura (sitios, actividades y factores) se mantuvo para cargar los datos reales.','🗑');
}
function wipeAllDemoData(){
  REC.splice(0,REC.length); MOV.splice(0,MOV.length);
  S.recentImports=[]; S.dr={scope:null,cat:null,site:null,src:null}; S.node=null; S.invSel=null; S.mv.sel=null;
  SITES.splice(0,SITES.length); Object.keys(SBI).forEach(k=>delete SBI[k]);
  PROCS.splice(0,PROCS.length); Object.keys(PBI).forEach(k=>delete PBI[k]);
  LINES.splice(0,LINES.length); Object.keys(LBI).forEach(k=>delete LBI[k]);
  MACH.splice(0,MACH.length); Object.keys(MBI).forEach(k=>delete MBI[k]);
  BIZ=[];
  WASTECAT.splice(0,WASTECAT.length); Object.keys(WCBI).forEach(k=>delete WCBI[k]);
  closeModal(); dcGo('config');
  toast('Se vació todo: ubicaciones, actividades, registros y movimientos. Quedó la biblioteca de factores como referencia — empezá creando tu primera ubicación.','🗑');
}

  closeModal();
  const wrap=document.createElement('div'); wrap.className='mscrim'; wrap.id='mscrim';
  wrap.innerHTML=`<div class="modal ${opt.wide?'wide':''} ${opt.narrow?'narrow':''}">${html}</div>`;

/* carga manual de una actividad: el factor también sale por similitud y queda pendiente de aprobación */
async function manualMatch(b,site){
  const spec=activityMatchSpec(b,site); if(!spec) return null;
  const btn=document.querySelector('.modal-f .btn.primary'); if(btn) btn.disabled=true;
  try{ const [m]=await matchFactors([spec]); if(m.factor) return fmFrom(m); toast(m.error+' Se usa el factor de la actividad.','⚠'); return null; }
  catch(e){ toast('No se pudo buscar el factor por similitud: '+e.message,'⚠'); if(btn) btn.disabled=false; return false; }
}

function detectDelim(text){ const line=(text.split(/\r?\n/)[0]||''); const c=(line.match(/,/g)||[]).length,s=(line.match(/;/g)||[]).length; return s>c?';':','; }
function parseCSV(text){
  const delim=detectDelim(text), rows=[]; let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
    else{ if(c==='"') inQ=true; else if(c===delim){row.push(cur);cur='';} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(c==='\r'){} else cur+=c; } }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function parseSpreadsheetFile(file,cb){
  const name=file.name.toLowerCase();
  if(name.endsWith('.csv')||name.endsWith('.txt')){
    const rd=new FileReader(); rd.onload=()=>cb(parseCSV(rd.result)); rd.onerror=()=>toast('No se pudo leer el archivo.','⚠'); rd.readAsText(file,'utf-8');
  } else if(typeof XLSX!=='undefined'){
    const rd=new FileReader();
    rd.onload=()=>{ try{ const wb=XLSX.read(rd.result,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
        /* las celdas de fecha llegan como número de serie: el texto formateado sería m/d/aa de EE. UU. */
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}), raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
        const dated=rows.map((r,i)=>r.map((c,j)=>{ const v=(raw[i]||[])[j]; return typeof v==='number'&&/[a-z]|\d+\/\d+\/\d+/i.test(String(c))&&!/^[\d.,\s%$-]+$/.test(String(c))?String(v):String(c); }));
        cb(dated.filter(r=>r.some(c=>c.trim()!==''))); }
      catch(e){ toast('No se pudo leer el archivo XLSX. Probá exportarlo como CSV.','⚠'); } };
    rd.onerror=()=>toast('No se pudo leer el archivo.','⚠'); rd.readAsArrayBuffer(file);
  } else {
    toast('Todavía se está cargando el lector de XLSX — probá de nuevo en un momento, o subí un CSV.','⚠');
  }
}
function autoMapCols(header,type){
  const cols=DATA_TYPES[type].fields;
  return header.map(h=>{ const nh=normTxt(h); let hit=cols.find(c=>[c.k,c.l,...(c.syn||[])].map(normTxt).includes(nh));
    if(!hit) hit=cols.find(c=>[c.k,...(c.syn||[])].some(s=>nh.includes(normTxt(s))||normTxt(s).includes(nh))); return hit?hit.k:null; });
}
function detectType(header){
  let best=null,bestScore=0;
  Object.entries(DATA_TYPES).forEach(([k,t])=>{ const m=autoMapCols(header,k); const score=m.filter(Boolean).length; if(score>bestScore){bestScore=score;best=k;} });
  return bestScore>=2?best:null;
}
function downloadTemplate(type){
  const t=DATA_TYPES[type]; const head=t.fields.map(f=>f.k).join(';');
  const rows=[head,...t.sample.map(r=>r.join(';'))].join('\n');
  const b=new Blob(['﻿'+rows],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='plantilla_'+type+'.csv'; a.click();
  toast('Plantilla descargada como CSV — también se acepta XLSX con las mismas columnas.','↧');
}

function dcWizDetect(input){
  const f=input.files[0]; if(!f)return;
  parseSpreadsheetFile(f,rows=>{ if(!rows.length){toast('El archivo está vacío.','⚠');return;}
    const header=rows[0], type=detectType(header);
    if(!type){ toast('No se pudo reconocer el tipo de archivo automáticamente. Elegilo manualmente.','⚠'); S.dc.wiz={type:null,step:1,rows,headers:header}; render(); return; }
    toast('Parece un archivo de «'+DATA_TYPES[type].label+'». Revisá el mapeo antes de continuar.','🔍');
    S.dc.wiz={type,step:3,rows:rows.slice(1),headers:header,mapping:autoMapCols(header,type),fileName:f.name,valid:null,profileSaved:false,detected:true}; render(); });
}

function dcWizSetMap(i,val){ S.dc.wiz.mapping[i]=val||null; render(); }
function dcWizToStep(n){
  if(n===4){
    const type=S.dc.wiz.type, t=DATA_TYPES[type], mp=S.dc.wiz.mapping;
    const results=S.dc.wiz.rows.map(r=>{ const row={}; mp.forEach((k,i)=>{ if(k) row[k]=(r[i]==null?'':String(r[i])).trim(); });
      const missing=t.fields.filter(f=>f.req&&!row[f.k]);
      if(missing.length) return {row,status:'err',msg:'Faltan campos obligatorios: '+missing.map(f=>f.l).join(', ')+'.'};
      if(row.periodo){ const d=toISODate(row.periodo); if(!d) return {row,status:'err',msg:'Período no reconocido: «'+row.periodo+'». Usá AAAA-MM, por ejemplo 2026-08.'}; row.periodo=d.slice(0,7); }
      if(row.fecha){ const d=toISODate(row.fecha); if(!d) return {row,status:'err',msg:'Fecha no reconocida: «'+row.fecha+'». Usá AAAA-MM-DD, por ejemplo 2026-08-15.'}; row.fecha=d; }
      return {row,status:'pending'};
    });
    S.dc.wiz.valid=results; S.dc.wiz.step=4; render(); return;
  }
  S.dc.wiz.step=n; render();
}
async function dcWizImport(){
  const w=S.dc.wiz, type=w.type, t=DATA_TYPES[type];
  if(w.importing) return;
  let ok=0,err=0,auto=0,ties=0;
  /* filas sin factor: el servidor busca el más parecido de la biblioteca antes de crear los registros */
  if(t.match){
    const todo=w.valid.filter(i=>i.status!=='err').map(i=>[i,t.match(i.row)]).filter(([,spec])=>spec);
    if(todo.length){
      w.importing=true; render();
      try{ const res=await matchFactors(todo.map(([,spec])=>spec)); todo.forEach(([i],k)=>{ i.row._fm=res[k]; }); }
      catch(e){ toast('No se pudieron buscar los factores por similitud: '+e.message+'. No se importó nada.','⚠'); return; }
      finally{ w.importing=false; render(); }
    }
  }
  w.valid.forEach(item=>{ if(item.status==='err'){err++;return;}
    const res=t.apply(item.row);
    if(res&&res.err){ item.status='err'; item.msg=res.err; err++; }
    else { item.status='ok'; ok++; if(item.row._fm&&item.row._fm.factor){ auto++; if(item.row._fm.tie) ties++; } }
    delete item.row._fm; });
  if(document.getElementById('dcSaveProfile')&&document.getElementById('dcSaveProfile').checked){
    try{ const saved=JSON.parse(window.carbonProfiles.get()||'{}'); saved[type]={header:S.dc.wiz.headers,mapping:S.dc.wiz.mapping}; window.carbonProfiles.set(JSON.stringify(saved)); }catch(e){}
  }
  logImport(t.label,S.dc.wiz.fileName?('Importación de «'+S.dc.wiz.fileName+'»'):'Importación', ok);
  S.dc.wiz.step=5; S.dc.wiz.imported={ok,err,auto,ties}; render();
}

}

      ${kpi('Filas leídas',nf(w.valid.length),'','','upload')}
      ${kpi('Registros válidos',nf(okRows.length),'','<span class="pill ok">Se van a importar</span>','check')}
      ${kpi('Errores',nf(errRows.length),'',errRows.length?'<span class="pill err">No se importan</span>':'<span class="pill ok">Sin errores</span>','info')}

      <div class="card-b tight"><div class="tblwrap"><table><thead><tr><th>Estado</th><th>Fila</th><th>Detalle</th></tr></thead><tbody>
      ${w.valid.map((it,i)=>`<tr><td>${it.status==='err'?'<span class="pill err">Error</span>':'<span class="pill ok">Válida</span>'}</td>
        <td class="dim tiny">${Object.values(it.row).slice(0,3).map(esc).join(' · ')}</td>

      </tbody></table></div></div></div>
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn" onclick="S.dc.wiz.step=3;render()">Volver al mapeo</button>

      <label class="flexrow tiny dim" style="margin-left:auto"><input type="checkbox" id="dcSaveProfile" checked style="margin:0"> Guardar esta configuración de mapeo para futuras importaciones</label></div>`;
  } else {
    const im=w.imported||{ok:0,err:0};
    body=`<div class="card"><div class="card-b" style="text-align:center;padding:38px">
      <div class="empty-ico" style="width:52px;height:52px;border-radius:14px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">${ico('check',2)}</div>
      <div style="font-size:20px;font-weight:600">Importación completa</div>
      <p class="dim" style="max-width:52ch;margin:8px auto 22px"><b>${nf(im.ok)}</b> registros importados${im.err?', <b>'+nf(im.err)+'</b> rechazados por errores':''}. Los datos ya están sumados al inventario del período correspondiente — no se perdió ningún dato de demostración.</p>
      ${im.err?`<div class="note" style="max-width:70ch;margin:0 auto 14px;text-align:left;border-color:var(--bad-line);background:var(--bad-soft)"><b>Filas rechazadas</b>${w.valid.filter(i=>i.status==='err').slice(0,8).map(i=>`<div class="tiny" style="margin-top:4px">${esc(Object.values(i.row).slice(0,3).join(' · '))} — <b>${esc(i.msg||'')}</b></div>`).join('')}${im.err>8?`<div class="tiny dim" style="margin-top:4px">…y ${nf(im.err-8)} más.</div>`:''}<div style="margin-top:8px"><button class="btn sm" onclick="dcWizDownloadErrors()">Descargar filas rechazadas</button></div></div>`:''}
      ${im.auto?`<div class="note" style="max-width:60ch;margin:0 auto 18px;text-align:left"><b>${nf(im.auto)}</b> registros recibieron el factor de la biblioteca más parecido a su descripción${im.ties?`, <b style="color:var(--bad)">${nf(im.ties)} con empate</b>`:''}. Quedan pendientes de aprobación.</div>`:''}
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        ${im.auto?`<button class="btn primary" onclick="go('asignacion')">Revisar y aprobar factores</button>`:''}
        <button class="btn" onclick="dcWizPickStep()">Cargar otro archivo</button>
        <button class="btn ${im.auto?'':'primary'}" onclick="dcGo('${DATA_TYPES[w.type].group==='config'?'config':'periodica'}')">Volver al Centro de Datos</button>
        <button class="btn ghost" onclick="go('dash')">Ver el panel ejecutivo</button>
      </div></div></div>`;
  }
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button class="btn ghost sm" onclick="dcWizCancel()">← Volver al Centro de Datos</button>
    ${w.type?`<span class="pill accent">${DATA_TYPES[w.type].label}</span>`:''}</div>
    <div class="steps" style="margin-bottom:18px">${stepNames.map((n,i)=>`<div class="step ${w.step===i+1?'on':''} ${w.step>i+1?'done':''}"><div class="n">${w.step>i+1?'✓':i+1}</div><div class="t">${n}</div></div>`).join('')}</div>`
    +body;
}

  body:'Los movimientos del ERP se cruzan con la guía del TMS: peso, tramos, modo y kilómetros. La emisión es <b>t × km × factor del modo</b>, tramo por tramo. Si el camión es propio, la emisión se reconoce en Alcance 1 y no se duplica en la Categoría 4.',
  before(){closeDrawer();S.mv.sel=null;S.mv.f={...MV_F0};S.mob.sel=null;go('movilidad')}},

 {target:'[data-tour="tx-rules"]',placement:'left',title:'Reglas de clasificación, no criterio manual',
  body:'Un grupo de material, una cuenta contable o una guía de transporte alcanzan para asignar alcance, categoría, método y factor, con un nivel de confianza. Por debajo del umbral, la transacción espera confirmación.',
  before(){S.txf={sys:'all',cat:'all',scope:'all',state:'all',rule:'all',src:'all',q:''};go('transacciones')}},

 {target:'#drawer',placement:'left',wait:380,title:'Del resultado hasta el comprobante',
  body:'Resultado, clasificación, aritmética, factor con su fuente, dato de actividad, documento de origen y quién lo cargó. Nada del cálculo se pierde en el camino.<br><br><b>'+TOUR_MSG+'</b><br><br>El detalle de qué es funcional y qué está simulado está en «Alcance del prototipo». A partir de acá, es tuyo para explorar.',
  before(){const r=tourFindRec(x=>x.type==='transport')||tourFindRec(x=>x.type==='elec')||REC[0];trace(r.rid)}},
];

function tourStart(){S.tour.active=true;S.tour.step=0;tourShow(0)}
function tourEnd(){S.tour.active=false;tourClearFrame();closeDrawer();render()}
function tourNext(){if(S.tour.step>=TOUR.length-1){tourEnd();return}tourShow(S.tour.step+1)}
function tourPrev(){if(S.tour.step<=0)return;tourShow(S.tour.step-1)}
function tourRestart(){tourStart()}

function tourShow(i){
  S.tour.step=i;const st=TOUR[i];
  if(st.before){try{st.before()}catch(e){}}
  tourClearFrame();
  setTimeout(()=>tourPaint(),st.wait!=null?st.wait:220);
}
function tourClearFrame(){document.querySelectorAll('.tf,.tour-hl,.tour-card,.tour-scrim').forEach(n=>n.remove())}

function tourPaint(){
  if(!S.tour.active)return;
  tourClearFrame();
  const st=TOUR[S.tour.step];
  const n=TOUR.length,i=S.tour.step;
  const nav=(label,fn,primary,disabled)=>`<button class="btn ${primary?'primary':''} sm" ${disabled?'disabled':''} onclick="${fn}">${label}</button>`;
  const cardInner=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
      <span class="eyebrow">Paso ${i+1} de ${n}</span>
      <button class="btn ghost sm" style="margin-left:auto" onclick="tourEnd()">Salir ✕</button>
    </div>
    <div class="bar-progress" style="margin:8px 0 12px"><i style="width:${(i+1)/n*100}%"></i></div>
    <div style="font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px">${st.title}</div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">${st.body}</div>
    <div style="display:flex;gap:7px;margin-top:16px">
      ${i>0?nav('← Atrás','tourPrev()',false,false):'<span></span>'}
      <span style="flex:1"></span>
      ${i===n-1?nav('Volver a ver la demo','tourRestart()',false,false):''}
      ${nav(i===n-1?'Explorar libremente':'Siguiente →','tourNext()',true,false)}
    </div>`;

  if(!st.target){
    const scrim=document.createElement('div');scrim.className='tour-scrim tf';document.body.appendChild(scrim);
    const card=document.createElement('div');card.className='tour-card tf';card.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:380px;z-index:161';
    card.innerHTML=cardInner;document.body.appendChild(card);
    return;
  }
  const el=document.querySelector(st.target);
  if(!el){ // el objetivo no está en el DOM (p. ej. se cerró algo): reintenta una vez, si no, salta el paso
    if(!st._retried){st._retried=true;setTimeout(tourPaint,180);return}
    st._retried=false;tourNext();return;
  }
  try{el.scrollIntoView({block:'center',behavior:'auto'})}catch(e){}
  requestAnimationFrame(()=>requestAnimationFrame(()=>tourFrame(el,st,cardInner)));
}

function tourFrame(el,st,cardInner){
  const r=el.getBoundingClientRect();
  const pad=8;
  const rect={l:r.left-pad,t:r.top-pad,r:r.right+pad,b:r.bottom+pad};
  const vw=innerWidth,vh=innerHeight;
  const mk=(cls,css)=>{const d=document.createElement('div');d.className=cls+' tf';d.style.cssText=css;document.body.appendChild(d);return d};
  mk('tour-blk','position:fixed;left:0;top:0;width:'+vw+'px;height:'+Math.max(rect.t,0)+'px');
  mk('tour-blk','position:fixed;left:0;top:'+rect.b+'px;width:'+vw+'px;height:'+Math.max(vh-rect.b,0)+'px');
  mk('tour-blk','position:fixed;left:0;top:'+rect.t+'px;width:'+Math.max(rect.l,0)+'px;height:'+(rect.b-rect.t)+'px');
  mk('tour-blk','position:fixed;left:'+rect.r+'px;top:'+rect.t+'px;width:'+Math.max(vw-rect.r,0)+'px;height:'+(rect.b-rect.t)+'px');
  mk('tour-hl','position:fixed;left:'+rect.l+'px;top:'+rect.t+'px;width:'+(rect.r-rect.l)+'px;height:'+(rect.b-rect.t)+'px');

  const cw=360,gap=14;
  let cx,cy,side=st.placement||'bottom';
  if(side==='bottom'){cx=rect.l;cy=rect.b+gap; if(cy+220>vh)side='top'}
  if(side==='top'){cx=rect.l;cy=rect.t-gap;}
  if(side==='right'){cx=rect.r+gap;cy=rect.t;}
  if(side==='left'){cx=rect.l-gap-cw;cy=rect.t;}
  cx=Math.max(12,Math.min(cx,vw-cw-12));
  const card=document.createElement('div');card.className='tour-card tf';
  card.style.cssText=`position:fixed;left:${cx}px;top:0;width:${cw}px;z-index:161;visibility:hidden`;
  card.innerHTML=cardInner;document.body.appendChild(card);
  const ch=card.getBoundingClientRect().height;
  let top=side==='top'?cy-ch:cy;
  top=Math.max(12,Math.min(top,vh-ch-12));
  card.style.top=top+'px';card.style.visibility='visible';
}

function tourResize(){if(S.tour.active)tourPaint()}
window.addEventListener('resize',()=>{clearTimeout(window._tr);window._tr=setTimeout(tourResize,120)});
document.addEventListener('keydown',e=>{
  if(!S.tour.active)return;
  if(e.key==='Escape'){tourEnd();return}
  if(e.key==='ArrowRight'||e.key==='Enter'){tourNext();return}
  if(e.key==='ArrowLeft'){tourPrev();return}
});


/* arranque */

</script>
