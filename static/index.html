/* ============================================================
   IVZ CARBON 3.0 — DESIGN TOKENS (sistema visual IVZ Sustainability Hub)
   ============================================================ */
:root{
  --ink:#182220; --ink-2:#586661; --muted:#586661; --muted-2:#8D9791; --ink-3:#8D9791;
  --bg:#F5F7F5; --surface:#FFFFFF; --surface-2:#FAFBFA; --surface-3:#EFF3F0;
  --line:#E2E7E3; --line-2:#CFD7D1;
  --accent:#3F704D; --accent-2:#4B7F55; --accent-soft:#E7F1E8; --accent-line:#C3DBC7;
  --teal:#0F6A6B; --teal-soft:#E1F0F0; --teal-line:#BCDCDC;
  --sage:#4B7F55; --sage-soft:#EAF3EC; --sage-line:#CDE3D3; --sage-ink:#3E6B4C;
  --c1:#A6453A; --c1-soft:#FAEBE8; --c1-line:#EFC9C2; --c1-ink:#9E3428;
  --c2:#C08A2A; --c2-soft:#FBF1DF; --c2-line:#EBD7AE; --c2-ink:#9C6508;
  --c3:#3F704D;
  --ok:#2E573C; --ok-soft:#E6F2E8; --ok-line:#C6E0CD;
  --warn:#9C6508; --warn-soft:#FBF1DF; --warn-line:#EBD7AE;
  --err:#9E3428; --bad:#9E3428; --bad-soft:#FAEBE8; --bad-line:#EFC9C2;
  --nav:#15271E; --nav-2:#1D3529; --nav-ink:#B9CBBF; --nav-ink-hi:#F1F7F2; --nav-ink-lo:#7D9184;
  --r:10px; --r-sm:7px; --r-xs:6px;
  --sh:0 1px 2px rgba(20,38,29,.05), 0 6px 16px rgba(20,38,29,.045);
  --sh-md:0 2px 4px rgba(20,38,29,.06), 0 10px 24px rgba(20,38,29,.08);
  --sh-lg:0 12px 40px rgba(20,38,29,.16);
  --side:238px;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
::selection{background:#D8E9DB}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CBD4CD;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}
.mono,.code{font-family:var(--mono);font-size:.92em;letter-spacing:-.02em}
h1,h2,h3,h4{letter-spacing:-.02em;font-weight:600;margin:0}

/* ---------- SHELL / BARRA LATERAL ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.side>nav{min-height:0;overflow-y:auto}
.side>.brand,.side>.tenant{flex-shrink:0}
.brand{padding:16px 16px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.07)}
.mark{width:30px;height:44px;display:grid;place-items:center;flex:none}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand .nm{font-size:15px;font-weight:600;color:var(--nav-ink-hi);line-height:1.2}
.brand .sb{font-size:11px;color:var(--nav-ink-lo);margin-top:1px}
.tenant{margin:12px 10px 4px;padding:9px 10px;border-radius:var(--r-sm);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:flex;gap:9px;align-items:center;cursor:pointer;transition:background .12s}
.tenant:hover{background:rgba(255,255,255,.1)}
.tenant .av{width:26px;height:26px;border-radius:7px;background:linear-gradient(160deg,#5E8F6B,var(--accent));display:grid;place-items:center;font-size:10.5px;color:#fff;font-weight:600;flex:none}
.tenant .t1{font-size:12.5px;font-weight:500;line-height:1.2;color:var(--nav-ink-hi)}
.tenant .t2{font-size:10.5px;color:var(--nav-ink-lo)}
nav{padding:6px 10px 20px;flex:1}
.navgrp{font-size:10.5px;letter-spacing:.08em;color:#6E8477;margin:14px 8px 6px;font-weight:600;text-transform:uppercase}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--nav-ink);
  font-size:13.5px;border:none;background:none;width:100%;text-align:left;font-weight:400;position:relative;margin-bottom:1px;transition:background .12s,color .12s}
.navitem:hover{background:rgba(255,255,255,.06);color:var(--nav-ink-hi)}
.navitem.on{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
.navitem.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-2)}
.navitem svg{width:16px;height:16px;flex:none;opacity:.82}
.navitem.on svg{opacity:1}
.navitem .badge{margin-left:auto;font-size:10.5px;background:rgba(240,180,120,.16);color:#E8B98C;border:1px solid rgba(240,180,120,.24);border-radius:20px;padding:0 6px;font-weight:600}
.sidefoot{padding:12px;border-top:1px solid rgba(255,255,255,.07);font-size:10.5px;color:var(--nav-ink-lo);line-height:1.6;flex-shrink:0}
.side-user{display:flex;align-items:center;gap:9px;margin-top:12px;padding:6px 4px;color:#93A899;font-size:12px;cursor:pointer;border-radius:8px;border:0;background:none;width:100%}
.side-user:hover{background:rgba(255,255,255,.06)}
.side-user>svg{width:20px;height:20px;flex:none}
.account-avatar{width:28px;height:28px;border-radius:50%;background:#2F4E3B;color:#CFE3D5;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.account-copy{flex:1;min-width:0;text-align:left}
.account-name{display:block;color:#DFEAE2;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-company{display:block;color:#93A899;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.tenant-caption{display:block;margin-top:10px;color:#93A899;font-size:10px;line-height:1.5;text-align:center;font-weight:400}
.tour-entry:focus-visible,.side-user:focus-visible{outline:2px solid #CFE3D5;outline-offset:3px}

/* ---------- CABECERA ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.head-row{display:flex;align-items:center;gap:16px;padding:0 28px;height:58px}
.crumb{font-size:12.5px;color:var(--muted-2);flex:1;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.head-actions{display:flex;align-items:center;gap:8px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 28px;border-top:1px solid var(--line);background:var(--surface-2)}
.fld{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:4px 9px;background:var(--surface);transition:border-color .12s}
.fld:hover{border-color:var(--accent-line)}
.fld label{font-size:11.5px;color:var(--muted-2)}
.fld select{border:none;background:none;font-size:12.5px;font-weight:500;outline:none;cursor:pointer}
.content{padding:24px 28px 72px;max-width:1560px;width:100%}

.page-h{display:flex;align-items:flex-start;gap:18px;margin:0 0 20px;flex-wrap:wrap}
.page-h h2{font-size:21px;font-weight:600;letter-spacing:-.015em}
.page-h p{margin:4px 0 0;color:var(--ink-2);font-size:13px;max-width:70ch}
.page-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:11.5px;color:var(--muted-2);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ---------- TARJETAS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px;font-weight:600}
.card-h .sub,.card-h .hint{font-size:11.5px;color:var(--muted-2);font-weight:400}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.card-b.tight{padding:6px 0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g23{grid-template-columns:2fr 1fr} .g32{grid-template-columns:1fr 2fr}
.mt{margin-top:14px}

.report-uncertainty .card-h{flex-wrap:wrap}
.report-uncertainty .kpi{min-width:0}
.report-uncertainty .kpi .val{overflow-wrap:anywhere;line-height:1.2}

/* ---------- CONTROLES ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px 13px;font-size:12.5px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#356044;border-color:#356044}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:var(--r-xs)}
.btn.icon{padding:6px;width:30px;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* ---------- ETIQUETAS ---------- */
.pill,.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.pill.s1{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.s2{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.pill.s3{background:var(--sage-soft);color:var(--sage-ink);border-color:var(--sage-line)}
.pill.accent,.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.ok,.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.pill.warn,.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.err,.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.pill.teal,.badge.teal{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}

/* ---------- KPI ---------- */
.kpi{padding:15px 16px 13px;position:relative;transition:border-color .12s,box-shadow .12s,transform .12s}
.kpi.act{cursor:pointer}
.kpi.act:hover{border-color:var(--accent-line);box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi .k-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.kpi .k-name,.kpi .lab{font-size:12.5px;color:var(--ink-2);font-weight:500;flex:1;line-height:1.35}
.kpi .k-ico{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.kpi .k-ico svg{width:14px;height:14px;opacity:1}
.kpi .val{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:12.5px;font-weight:500;color:var(--muted-2);letter-spacing:0;margin-left:4px}
.kpi .foot{margin-top:10px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted-2);flex-wrap:wrap}
.kpi .k-bar{height:3px;border-radius:2px;background:var(--line);margin-top:11px;overflow:hidden}
.kpi .k-bar i{display:block;height:100%;border-radius:2px;background:var(--accent-2);transform-origin:left}
@media (prefers-reduced-motion: no-preference){.kpi .k-bar i{animation:barGrowX .5s cubic-bezier(.22,.8,.28,1) both}}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;border-radius:0;background:none}
.delta.up,.delta.bad{color:var(--bad);background:none}
.delta.down,.delta.good{color:var(--ok);background:none}
.delta.flat{color:var(--muted-2)}
.k-target{font-size:11.5px;color:var(--muted-2);border-left:1px solid var(--line-2);padding-left:9px}

/* ---------- TABLAS ---------- */
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:11.5px;color:var(--ink-2);text-align:left;font-weight:600;padding:9px 16px;background:var(--surface-2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
tr.clickable{cursor:pointer}
.r,td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
/* Las tablas largas scrollean dentro de la tarjeta con el encabezado fijo,
   como en el Hub: la página sigue navegable y el header no se pierde. */
.tblwrap{overflow:auto;max-height:620px}
.tblwrap th{position:sticky;top:0;z-index:2}
.strong{font-weight:600}
.dim{color:var(--muted)}
.tiny{font-size:11.5px}
tfoot td{border-top:1px solid var(--line-2);border-bottom:none;font-weight:600;background:var(--surface-2)}
.minibar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;min-width:48px}
.minibar i{display:block;height:100%;border-radius:3px}
.pbar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--accent-2)}
.pbar.warn i{background:#D69C2E} .pbar.bad i{background:#C0574A}
.pbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted-2);opacity:.55}
@media (prefers-reduced-motion: no-preference){
  .minibar i,.pbar i{transform-origin:left;animation:barGrowX .5s cubic-bezier(.22,.8,.28,1) both}
}
@keyframes barGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- GRÁFICOS ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:10.5px;fill:var(--muted-2)}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.seg{cursor:pointer;transition:opacity .12s}
.seg:hover{opacity:.72}
.seg.nohover:hover{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}

/* ---------- Entrada dinámica de gráficos: se reproduce cada vez que la
   vista se vuelve a montar (render() reemplaza el innerHTML por completo,
   así que estas animaciones corren de nuevo cada vez que se abre la sección) */
@media (prefers-reduced-motion: no-preference){
  .barseg{transform-box:fill-box;transform-origin:center bottom;animation:barGrow .55s cubic-bezier(.22,.8,.28,1) both}
  .donutseg{transform-box:fill-box;transform-origin:center;animation:segPop .5s cubic-bezier(.22,.8,.28,1) both}
  .linewrap{animation:fadeUp .5s cubic-bezier(.22,.8,.28,1) both}
  .barhit{animation:none}
}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes segPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

/* ---------- Tooltip de gráficos: aparece al pasar el mouse por barras,
   segmentos de dona o puntos de línea, con el detalle exacto del período */
.charttip{position:fixed;z-index:220;pointer-events:none;background:var(--nav);color:#EAF2EC;
  border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.6;box-shadow:var(--sh-lg);
  opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s;max-width:240px}
.charttip.on{opacity:1;transform:translateY(0)}
.charttip .tt-h{font-weight:600;font-size:12.5px;color:#fff;margin-bottom:3px;white-space:nowrap}
.charttip .tt-row{display:flex;align-items:center;gap:7px;white-space:nowrap}
.charttip .tt-row .tt-dot{width:7px;height:7px;border-radius:2px;flex:none}
.charttip .tt-row .tt-lab{color:#B9CBBF;flex:1}
.charttip .tt-row .tt-val{font-weight:600;font-variant-numeric:tabular-nums;margin-left:10px}
.charttip .tt-tot{border-top:1px solid rgba(255,255,255,.14);margin-top:5px;padding-top:5px;display:flex;justify-content:space-between;gap:14px;font-weight:600}

/* ---------- ÁRBOL ---------- */
.tree{font-size:12.5px;padding:6px 10px}
.node{border-left:1px dashed var(--line-2);margin-left:10px;padding-left:12px}
.nrow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--r-xs);cursor:pointer}
.nrow:hover{background:var(--surface-2)}
.nrow.on{background:var(--accent-soft);color:var(--accent)}
.nrow .cx{width:12px;font-size:10px;color:var(--muted-2);flex:none}
.nrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .kv{font-size:11.5px;color:var(--muted-2)}

/* ---------- PANEL LATERAL ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,30,24,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,100%);background:var(--surface);z-index:61;transform:translateX(102%);
  transition:transform .24s cubic-bezier(.32,.72,.34,1);display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.drawer.on{transform:none}
.drawer-h{padding:18px 22px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer-h h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.drawer-b{padding:20px 22px;overflow:auto;flex:1}

/* ---------- TRAZABILIDAD ---------- */
.tape{position:relative;padding-left:24px}
.tape:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.tstep{position:relative;margin-bottom:12px}
.tstep:before{content:"";position:absolute;left:-22px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-2)}
.tstep.origin:before{background:var(--accent);border-color:var(--accent)}
.tstep .lv{font-size:11px;color:var(--muted-2)}
.tstep .bd{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-top:5px}
.tstep .ttl{font-weight:600;font-size:13px}
.tstep .meta{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.65}
.formula{font-family:var(--mono);font-size:11.5px;background:var(--nav);color:#CBD5CE;padding:10px 12px;border-radius:var(--r-xs);margin-top:9px;overflow-x:auto;white-space:nowrap;letter-spacing:-.02em}
.formula b{color:#8FD3A3;font-weight:500}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px;margin-top:8px}
.kvs dt{font-size:11.5px;color:var(--muted-2)}
.kvs dd{margin:0}

/* ---------- ASISTENTE / IMPORTACIÓN ---------- */
.steps{display:flex;gap:6px}
.step{flex:1;padding:9px 12px;display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted-2);font-size:12px}
.step.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:600}
.step.done{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.step .n{width:19px;height:19px;border-radius:50%;background:var(--line);color:var(--ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;border:0}
.step.on .n{background:var(--accent);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.step .t{font-size:12.5px;font-weight:500}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:36px 22px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:15px;font-weight:600}
.sheettab{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.sheettab button{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:3px 11px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.sheettab button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.sheettab button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.bar-progress{height:5px;border-radius:4px;background:var(--line);overflow:hidden}
.bar-progress i{display:block;height:100%;background:var(--accent-2);transition:width .5s}

/* ---------- AVISOS ---------- */
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;color:var(--ink-2)}
@keyframes docspin{to{transform:rotate(360deg)}}
.note.reading{display:flex;align-items:center;gap:8px}
.note.reading .spin-ic{display:inline-flex;animation:docspin .9s linear infinite;color:var(--accent)}
.note.warn{background:var(--warn-soft);border-color:var(--warn-line);color:#6B4808}
.alert{display:flex;gap:11px;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);margin-bottom:9px}
.alert:last-child{margin-bottom:0}
.alert .a-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line);color:var(--ink-2)}
.alert .a-ico svg{width:14px;height:14px}
.alert.ok{background:var(--ok-soft);border-color:var(--ok-line)} .alert.ok .a-ico{background:#D2E7D8;color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn-line)} .alert.warn .a-ico{background:#F2E1BE;color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad-line)} .alert.bad .a-ico{background:#F3D5CF;color:var(--bad)}
.alert b{display:block;font-size:12.5px;margin-bottom:1px}
.alert p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.55}

.toast{position:fixed;bottom:52px;right:18px;left:auto;transform:translateY(12px);background:var(--nav);color:#EAF2EC;padding:11px 14px;border-radius:9px;
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:400;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-lg);max-width:min(420px,88vw)}
.toast.on{opacity:1;transform:none}
.demo-flag{position:fixed;right:12px;bottom:12px;background:var(--surface);border:1px solid var(--line-2);color:var(--muted-2);font-size:10.5px;padding:3px 9px;border-radius:20px;z-index:70;box-shadow:var(--sh)}
.seg-tabs{display:inline-flex;background:var(--surface-3);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg-tabs button{border:none;background:none;padding:5px 12px;font-size:12.5px;cursor:pointer;border-radius:var(--r-xs);color:var(--ink-2);font-weight:500;transition:background .12s,color .12s}
.seg-tabs button:hover{color:var(--ink)}
.seg-tabs button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(20,38,29,.07)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.searchbox{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:5px 10px;min-width:200px;transition:border-color .12s}
.searchbox:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.searchbox input{border:none;outline:none;background:none;width:100%;font-size:12.5px}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty .e-ico{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .big{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:4px}
.hr{height:1px;background:var(--line);margin:16px 0}
.flexrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
.tip{position:relative;cursor:help;border-bottom:1px dotted var(--line-2)}
.tip:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:130%;background:var(--nav);color:#EAF2EC;padding:6px 9px;border-radius:6px;
  font-size:11.5px;white-space:normal;width:230px;z-index:60;box-shadow:var(--sh-lg);font-weight:400;line-height:1.45}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

/* ======================= EDITOR DE PLANTA ======================= */
.ed{display:grid;grid-template-columns:212px 1fr 0px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;height:calc(100vh - 200px);min-height:560px}
.ed.haspanel{grid-template-columns:212px 1fr 270px}
.ed:fullscreen{height:100vh;border-radius:0}
.ed-lib{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface-2)}
.ed-lib .hd{padding:10px 11px;border-bottom:1px solid var(--line)}
.ed-lib .list{overflow:auto;flex:1;padding:6px}
.libcat{font-size:11px;color:var(--muted-2);padding:10px 6px 4px;font-weight:500}
.libitem{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:var(--r-xs);cursor:grab;font-size:12px;border:1px solid transparent}
.libitem:hover{background:var(--surface);border-color:var(--line)}
.libitem:active{cursor:grabbing}
.libitem .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--surface-3)}
.libitem .ic svg{width:13px;height:13px}
.libitem .mt2{font-size:10.5px;color:var(--muted-2)}

.ed-stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface-2)}
.ed-toolbar{display:flex;align-items:center;gap:4px;padding:6px 9px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;z-index:5}
.tsep{width:1px;height:18px;background:var(--line);margin:0 3px}
.ed-canvaswrap{position:relative;flex:1;overflow:hidden}
.ed-canvas{position:absolute;top:0;left:0;transform-origin:0 0;width:3600px;height:2400px}
.ed-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px}
.ed-grid.off{display:none}
.ed-conns{position:absolute;inset:0;pointer-events:none;overflow:visible}
.ed-conns path.hit{pointer-events:stroke;cursor:pointer}
.zone{position:absolute;border:1.5px dashed var(--line-2);border-radius:10px}
.zone .zl{position:absolute;top:-10px;left:10px;background:var(--surface);padding:0 7px;font-size:11px;color:var(--muted);border-radius:4px}
.zone.sel{border-color:var(--accent);border-style:solid}

.el{position:absolute;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;cursor:grab;user-select:none;overflow:hidden}
.el:hover{border-color:var(--muted-2)}
.el.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.el.locked{cursor:not-allowed}
.el.dimmed{opacity:.2}
.el .eic svg{width:19px;height:19px;display:block}
.el .enm{font-size:9.5px;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink-2)}
.el .ekv{font-size:9px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.el .lockb{position:absolute;top:1px;right:3px;font-size:9px;color:var(--muted-2)}
.hnd{position:absolute;width:8px;height:8px;background:var(--surface);border:1.5px solid var(--accent);border-radius:2px;z-index:6}
.hnd.rot{border-radius:50%;cursor:grab}
.marquee{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);opacity:.55;pointer-events:none;z-index:9}
.ed-minimap{position:absolute;right:12px;bottom:12px;width:170px;height:110px;background:rgba(255,255,255,.94);border:1px solid var(--line-2);border-radius:9px;overflow:hidden;z-index:8}
.ed-minimap svg{width:100%;height:100%;display:block}
.ed-hint{position:absolute;left:12px;bottom:12px;z-index:8;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--muted)}
.ed-kpis{display:flex;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}
.ed-kpis .k{padding:8px 15px;border-right:1px solid var(--line);min-width:128px}
.ed-kpis .k .l{font-size:10.5px;color:var(--muted-2);white-space:nowrap}
.ed-kpis .k .v{font-size:15px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}
.ed-kpis .k .v small{font-size:10.5px;color:var(--muted-2);font-weight:500}

.ed-props{border-left:1px solid var(--line);overflow:auto;background:var(--surface);min-width:0;min-height:0}
.ed-props .hd{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--surface);z-index:2}
.pgrp{padding:11px 13px;border-bottom:1px solid var(--line)}
.pgrp .t{font-size:11px;color:var(--muted-2);margin-bottom:8px;font-weight:500}
.frow{margin-bottom:8px}
.frow label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.frow input,.frow select,.frow textarea{border:1px solid var(--line-2);border-radius:var(--r-xs);padding:4.5px 7px;font-size:12px;background:var(--surface);width:100%;outline:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.readout{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:7px}
.readout .l{font-size:10.5px;color:var(--muted-2)}
.readout .v{font-size:15px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.layerbtn{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--r-xs);cursor:pointer;font-size:12px;width:100%;border:none;background:none;text-align:left;color:var(--ink-2)}
.layerbtn:hover{background:var(--surface-3)}
.layerbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.el.hlchain{border-color:var(--accent) !important;box-shadow:0 0 0 3px var(--accent-soft);z-index:3}

/* ---- flujo del proceso (vista de diagrama) ---- */
.flowwrap{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:4px 2px 14px}
.flowband{flex:1 1 0;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.flowband-lbl{font-size:12.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:11px;color:var(--ink)}
.flowarrow{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted-2);padding-top:44px;flex:none}
.flowsub{margin-bottom:13px}
.flowsub:last-child{margin-bottom:0}
.flowsub-t{font-size:10px;color:var(--muted-2);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.03em}
.flowlist{display:flex;flex-direction:column;gap:7px}
.flowcard{display:flex;gap:8px;padding:8px 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer}
.flowcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.flowcard.prod{background:var(--accent-soft);border-color:var(--accent-line)}
.flowcard .fic{flex:none;width:22px;height:22px;display:grid;place-items:center}
.flowcard .fic svg{width:16px;height:16px}
.flowcard .fbody{min-width:0;flex:1}
.flowcard .fnm{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flowcard .fkv{font-size:10.5px;color:var(--muted-2);margin-top:1px}
.flowcard .fkv2{font-size:10px;color:var(--muted-2);margin-top:1px}
.flowcard .fkv2.accent{color:var(--accent);font-weight:500}
.finrow{font-size:10.5px;color:var(--ink-2);margin-top:4px;display:flex;align-items:flex-start;gap:5px;line-height:1.4}
.finrow.dim{color:var(--muted-2)}
.fdot{width:7px;height:7px;border-radius:50%;margin-top:3px;flex:none}
.flowempty{font-size:11.5px;color:var(--muted);padding:14px;border:1px dashed var(--line-2);border-radius:var(--r-sm);text-align:center;line-height:1.5}
.swatch{width:9px;height:9px;border-radius:3px;flex:none}
.menu{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 16px 40px -16px rgba(16,19,17,.3);padding:5px;min-width:196px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:none;background:none;padding:6px 9px;border-radius:var(--r-xs);font-size:12.5px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-3)}
.menu button:disabled{opacity:.4;cursor:not-allowed}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu .kbd{margin-left:auto;font-size:10.5px;color:var(--muted-2);font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g23,.g32,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand,.tenant,.sidefoot{border:none;flex:none;margin:0}
  .tenant{background:rgba(255,255,255,.06)}
  nav{display:flex;gap:4px;padding:8px}
  .navgrp{display:none}
  .navitem{width:auto;white-space:nowrap;margin-bottom:0}
  .navitem.on::before{display:none}
  .head-row{padding:10px 16px;height:auto;min-height:52px;flex-wrap:wrap;gap:10px}
  .filters{padding:9px 16px}
  .content{padding:16px}
  .g2{grid-template-columns:1fr}
  .ed,.ed.haspanel{grid-template-columns:1fr;height:auto}
  .ed-lib,.ed-props{display:none}
  .ed-canvaswrap{height:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ======================= DEMO GUIADA ======================= */
.tour-scrim{position:fixed;inset:0;z-index:159;background:rgba(15,26,20,.55)}
.tour-blk{z-index:159;background:rgba(15,26,20,.55);pointer-events:auto}
.tour-hl{z-index:160;border:2px solid var(--accent-2);border-radius:10px;box-shadow:0 0 0 4px rgba(75,127,85,.2),0 12px 30px -12px rgba(20,38,29,.4);pointer-events:none}
.tour-card{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--sh-lg);padding:16px 18px}
.tour-entry{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;background:#284B39;color:#fff;border:1px solid #3A604A;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s}
.tour-entry:hover{background:#345D46}
.tour-entry svg{width:20px;height:20px;flex:none}

/* ======================= CENTRO DE DATOS (v2.1) ======================= */
/* Tabs grandes de nivel superior (Configuración / Datos periódicos / Conectar) */
.dctabs{display:flex;gap:4px;background:var(--surface-3);padding:3px;border-radius:11px;margin-bottom:18px;flex-wrap:wrap}
.dctabs button{border:none;background:none;padding:9px 16px;font-size:13px;font-weight:500;color:var(--ink-2);border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .12s,color .12s}
.dctabs button svg{width:15px;height:15px}
.dctabs button:hover{color:var(--ink)}
.dctabs button.on{background:var(--surface);color:var(--accent);box-shadow:var(--sh)}
.dctabs button .cnt{font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:0 6px;font-weight:600}

/* Tarjetas grandes de selección (tipo de dato / qué configurar) */
.bigpick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bigcard{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;transition:border-color .12s,background .12s,box-shadow .12s,transform .12s}
.bigcard:hover{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:var(--sh-md);transform:translateY(-1px)}
.bigcard .bc-ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.bigcard .bc-ico svg{width:18px;height:18px}
.bigcard .bc-t{font-size:14px;font-weight:600}
.bigcard .bc-d{font-size:12px;color:var(--ink-2);line-height:1.5}
.bigcard .bc-meta{margin-top:auto;font-size:11px;color:var(--muted-2);display:flex;gap:8px;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
@media(max-width:1150px){.bigpick{grid-template-columns:repeat(2,1fr)}}

/* Tarjetas de importación (tipo de archivo, paso 1 del wizard genérico) */
.typecard{display:flex;gap:12px;padding:14px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;align-items:flex-start;transition:border-color .12s,background .12s,box-shadow .12s}
.typecard:hover{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:var(--sh)}
.typecard.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.typecard .tc-ico{width:36px;height:36px;border-radius:9px;background:var(--surface-3);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.typecard .tc-ico svg{width:17px;height:17px}
.typecard .tc-t{font-size:13px;font-weight:600}
.typecard .tc-d{font-size:11.5px;color:var(--muted-2);margin-top:2px;line-height:1.5}

/* Tarjetas de conector / integración */
.conncard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:15px;display:flex;flex-direction:column;gap:9px}
.conncard .cc-top{display:flex;align-items:flex-start;gap:10px}
.conncard .cc-ico{width:34px;height:34px;border-radius:9px;background:var(--surface-3);color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:none}
.conncard .cc-ico svg{width:17px;height:17px}
.conncard.on .cc-ico{background:var(--ok-soft);color:var(--ok)}
.conncard .cc-t{font-size:13.5px;font-weight:600}
.conncard .cc-sub{font-size:11.5px;color:var(--muted-2);margin-top:1px}
.conncard .cc-list{font-size:11.5px;color:var(--ink-2);line-height:1.9;margin-top:2px}
.conncard .cc-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:9px;border-top:1px solid var(--line);font-size:11px;color:var(--muted-2)}

/* Modal centrado (alta manual, biblioteca IVZ, confirmaciones) — reutiliza tokens del Hub */
.mscrim{position:fixed;inset:0;background:rgba(18,30,24,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .16s;z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.mscrim.on{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--sh-lg);width:min(600px,100%);max-height:90vh;display:flex;flex-direction:column;transform:translateY(8px) scale(.98);opacity:0;transition:transform .16s,opacity .16s;margin:auto}
.mscrim.on .modal{transform:none;opacity:1}
.modal.wide{width:min(920px,100%)}
.modal.narrow{width:min(440px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;flex:none}
.modal-h h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.modal-h .sub{font-size:11.5px;color:var(--muted-2);margin-top:2px;font-weight:400}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex:none;flex-wrap:wrap}
.modal-f .left{margin-right:auto;display:flex;align-items:center;gap:8px}

/* Formularios de alta manual */
.form-row{margin-bottom:11px}
.form-row label{font-size:11.5px;color:var(--ink-2);font-weight:500;display:block;margin-bottom:4px}
.form-row label .opt{color:var(--muted-2);font-weight:400}
.form-row input,.form-row select,.form-row textarea{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 9px;font-size:12.5px;background:var(--surface);width:100%;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.form-row .hint{font-size:11px;color:var(--muted-2);margin-top:3px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}

/* Biblioteca IVZ — selección de actividades preconfiguradas */
.libgrid{display:flex;flex-direction:column;gap:14px}
.libgrp-t{font-size:11px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.libpickrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px;cursor:pointer;transition:border-color .12s,background .12s}
.libpickrow:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.libpickrow.on{border-color:var(--accent);background:var(--accent-soft)}
.libpickrow input{margin:0;flex:none}
.libpickrow .lp-nm{font-size:12.5px;font-weight:500;flex:1;min-width:0}
.libpickrow .lp-d{font-size:11px;color:var(--muted-2);margin-top:1px}

/* Filas de BOM / receta ambiental y reglas de asignación */
.bomrow{display:grid;grid-template-columns:1fr 110px 90px 30px;gap:8px;align-items:center;margin-bottom:7px}
.bomrow input,.bomrow select{border:1px solid var(--line-2);border-radius:var(--r-xs);padding:6px 8px;font-size:12px;background:var(--surface);width:100%}
.rmrow{border:none;background:none;color:var(--muted-2);cursor:pointer;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.rmrow:hover{background:var(--bad-soft);color:var(--bad)}

/* Barra de dropzone compacta reutilizada dentro de tarjetas más chicas */
.drop.sm{padding:22px 16px}
.drop .fico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.drop .fico svg{width:17px;height:17px}

/* Chips de método de asignación */
.methodpill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--teal-soft);color:var(--teal);border:1px solid var(--teal-line);font-weight:600}
.methodpill.mass{background:var(--surface-3);color:var(--ink-2);border-color:var(--line-2)}
.methodpill.ratio{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.methodpill.specific{background:var(--c2-soft);color:var(--c2-ink);border-color:var(--c2-line)}
.methodpill.direct{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}

/* Cobertura / reconciliación */
.covbar{height:16px;border-radius:5px;background:var(--surface-3);overflow:hidden;display:flex;border:1px solid var(--line)}
.covbar i{display:block;height:100%}
.covlegend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:9px;font-size:11.5px;color:var(--ink-2)}
.covlegend span{display:flex;align-items:center;gap:6px}

/* Recuadro "novedad" para distinguir lo nuevo del prototipo original */
.newtag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:20px;padding:1px 7px;vertical-align:middle}

/* Wizard genérico: tabla de mapeo columna → campo */
.mapgrid{display:grid;grid-template-columns:1fr 26px 1fr 90px;gap:0 10px;align-items:center}
.mapgrid .mg-h{font-size:11px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:0 0 8px}
.mapgrid .mg-row{display:contents}
.mapgrid .mg-row>*{padding:8px 0;border-bottom:1px solid var(--line)}
.mapgrid .mg-arrow{color:var(--muted-2);text-align:center}

.stepbar-wide{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
@media(max-width:900px){.form2,.form3{grid-template-columns:1fr}.bigpick{grid-template-columns:1fr}}


/* ============================================================
   IVZ CARBON V3.0 — componentes nuevos de huella corporativa
   (badges de origen, tarjetas de categoría, composición interna,
   mapa de movimientos, pipeline de integraciones)
   ============================================================ */
.srcb{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;color:var(--ink-2);
  background:var(--surface-3);border:1px solid var(--line);border-radius:20px;padding:2px 8px 2px 6px;white-space:nowrap}
.srcb i{width:7px;height:7px;border-radius:50%;flex:none}
.spark{display:block;overflow:visible}

/* ---- composición interna de un alcance ---- */
.compbars{display:flex;flex-direction:column;gap:10px}
.cb-row{padding:2px 0}
.cb-row.clickable{cursor:pointer;border-radius:var(--r-xs);transition:background .12s}
.cb-row.clickable:hover{background:var(--surface-3)}
.cb-row.zero{opacity:.72}
.cb-lab{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:4px}
.cb-lab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-lab .num{flex:none;font-weight:600}
.cb-bar{height:7px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.cb-bar i{display:block;height:100%;border-radius:6px;animation:grow .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes grow{from{width:0 !important}}

/* ---- tarjetas de categoría / subcategoría ---- */
.catgrid{display:grid;gap:12px}
.catgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.catgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.catcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;
  transition:border-color .14s,box-shadow .14s,transform .14s;position:relative;min-width:0}
.catcard:hover{border-color:var(--accent-line);box-shadow:var(--sh);transform:translateY(-1px)}
.catcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.catcard.empty{background:var(--surface-2);border-style:dashed}
.catcard.empty:hover{border-color:var(--line-2)}
.cc-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cc-code{font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  border-radius:5px;padding:2px 6px;flex:none}
.cc-n{font-size:12px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-ic{margin-left:auto;width:15px;height:15px;color:var(--muted-2);flex:none}
.cc-ic svg{width:15px;height:15px}
.cc-v{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.cc-v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}
.cc-f{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px}
.cc-kv{font-size:11px;color:var(--muted)}
.cc-kv b{color:var(--ink-2)}
.cc-empty{font-size:11.5px;color:var(--muted-2);line-height:1.5;margin-top:4px}
.cc-src{font-size:10.5px;color:var(--muted-2);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- cabecera de alcance ---- */
.scopehead{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.sh-kv{min-width:120px}
.sh-kv .l{font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em}
.sh-v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sh-v small{font-size:11px;font-weight:400;color:var(--muted)}

/* ---- estructura del inventario en el panel ---- */
.struct3 .st-h{display:flex;align-items:center;gap:8px;padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--line);cursor:pointer}
.struct3 .st-h:hover{border-color:var(--accent-line)}
.struct3 .st-h b{font-size:14px;font-variant-numeric:tabular-nums}
.struct3 .st-h .dim{margin-left:auto;text-align:right}

/* ---- alcance 2: reporte dual ---- */
.dualm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dualm>div{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.dm-v{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
.dm-v small{font-size:10.5px;font-weight:400;color:var(--muted)}

/* ---- un dato, dos cálculos ---- */
.twocalc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.twocalc.big{grid-template-columns:1.1fr 1fr 1fr;align-items:end}
.twocalc>div{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.twocalc .num{font-size:12.5px;margin-top:4px}

/* ---- cadena OC → emisión ---- */
.pochain{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.pc{flex:1;min-width:150px;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface-2)}
.pc.em{background:var(--accent-soft);border-color:var(--accent-line)}
.pc-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);margin-bottom:3px}
.pc-v{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.pc-a{align-self:center;color:var(--line-2);font-size:15px;flex:none}

/* ---- trazabilidad: cuatro columnas ---- */
.trace4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

/* ---- filas de filtros ---- */
.filtrow{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.filtrow .fld{min-width:150px}
.filtrow .fld select{width:100%}

/* ---- movilidad: globo 3D + panel ---- */
.mob-card{display:grid;grid-template-columns:minmax(0,1fr) 380px;overflow:hidden;padding:0}
.mob-stage{position:relative;min-height:600px;background:#081a10}
.mob-globe{position:absolute;inset:0}
.mob-layers{position:absolute;left:16px;top:16px;z-index:5;display:flex;border:1px solid rgba(190,230,205,.22);border-radius:8px;overflow:hidden;background:rgba(6,18,11,.72)}
.mob-layers button{border:0;background:none;color:#CFE3D6;font:600 11.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;cursor:pointer}
.mob-layers button+button{border-left:1px solid rgba(190,230,205,.14)}
.mob-layers button:hover:not(.on){background:rgba(60,120,85,.35)}
.mob-layers button.on{background:#D7EEDD;color:#15271E}
.mob-layers button.heat.on{background:#FFC08F;color:#3A1508}
.mob-legend{position:absolute;left:16px;bottom:16px;z-index:5;background:rgba(6,18,11,.8);border:1px solid rgba(190,230,205,.18);border-radius:8px;padding:9px 11px;color:#CFE3D6;font-size:11.5px;display:grid;gap:5px;max-width:calc(100% - 90px)}
.mob-legend .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mob-legend .ramp{height:7px;width:140px;border-radius:4px;background:linear-gradient(90deg,#3DDC84,#F2C94C 50%,#FF7A3A 78%,#FF3B30)}
.mob-legend .ln{display:inline-block;width:18px;height:0;border-top:2px solid #CFE3D6}
.mob-legend .ln.dash{border-top-style:dashed}
.mob-legend .ln.dot{border-top-style:dotted}
.mob-legend .heat{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#FF3B30 0,#F2C94C 45%,transparent 72%)}
.mob-legend .muted{color:#8FAA99}
.mob-side{padding:20px 22px;display:flex;flex-direction:column;gap:14px;background:#FCFDFB;border-left:1px solid var(--line);min-width:0;max-height:600px;overflow:auto}
.mob-eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.mob-big{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
.mob-big b{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mob-big span{color:var(--ink-2);font-weight:600}
.mob-tabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.mob-tabs button{border:0;background:none;padding:7px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.mob-tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.mob-tabs select{font-size:11.5px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.mob-list{display:flex;flex-direction:column}
.mob-row{display:grid;grid-template-columns:22px minmax(0,1fr) 60px 64px;align-items:center;gap:9px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.mob-row:hover{background:var(--accent-soft)}
.mob-row.on{background:#FFF7D6}
.mob-row .n{font:600 11px var(--mono);color:var(--muted-2)}
.mob-row .nm{min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mob-row .nm i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.mob-row .nm small{display:block;color:var(--muted-2);font-size:10.5px;margin-left:14px;overflow:hidden;text-overflow:ellipsis}
.mob-row .bar{height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.mob-row .bar b{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.mob-row .v{text-align:right;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.mob-row .v small{display:block;font-weight:500;color:var(--muted-2);font-size:10px}
.mob-sel{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--surface);font-size:12.5px}
.mob-sel .t{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mob-sel .t i{width:9px;height:9px;border-radius:50%;flex:none}
.mob-sel .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;color:var(--ink-2)}
.mob-sel .kv b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.mob-note{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:11px 13px;font-size:12.5px;color:var(--ink-2)}
.mob-note h4{margin:0 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mob-note p{margin:0 0 4px}
.mapfb{padding:40px 20px;text-align:center;color:#C9DDD0;font-size:12.5px}
@media(max-width:1200px){.mob-card{grid-template-columns:1fr}.mob-side{border-left:0;border-top:1px solid var(--line);max-height:none}}
@media(max-width:560px){.mob-row{grid-template-columns:20px minmax(0,1fr) 36px 58px;gap:7px}.mob-side{padding:16px 14px}}
.modedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mc);margin-right:3px;vertical-align:middle}
.modepill{display:inline-block;font-size:10.5px;font-weight:600;color:#fff;background:var(--mc);border-radius:20px;padding:2px 8px;white-space:nowrap}
table.movtbl td{white-space:nowrap}
tr.mvhi>td{background:var(--accent-soft) !important}
tr.mvsel>td{background:var(--accent-soft) !important;box-shadow:inset 2px 0 0 var(--accent)}

/* ---- pipeline de integraciones ---- */
.pipeline{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.pl-step{flex:1;min-width:190px;border:1px solid var(--line);border-radius:var(--r);padding:13px;background:var(--surface-2)}
.pl-step.em{background:var(--accent-soft);border-color:var(--accent-line)}
.pl-ic{width:30px;height:30px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--accent);margin-bottom:9px}
.pl-ic svg{width:16px;height:16px}
.pl-t{font-size:13px;font-weight:600;letter-spacing:-.01em}
.pl-d{font-size:11px;color:var(--muted);margin-bottom:8px}
.pl-step ul{margin:0;padding-left:16px;font-size:11.5px;color:var(--ink-2);line-height:1.65}
.pl-arrow{align-self:center;color:var(--line-2);font-size:17px;flex:none}

/* ---- varios ---- */
.card.flat{box-shadow:none}
.confwrap{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
table.invtbl tr.scoperow>td{background:var(--surface-3);font-size:12.5px}
table.invtbl tr.scoperow>td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.formula{font-family:var(--mono);font-size:11.5px;line-height:1.8;background:var(--surface-3);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:var(--warn-line)}
@media (max-width:1180px){
  .catgrid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trace4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pipeline{flex-direction:column}
  .pl-arrow{align-self:flex-start;transform:rotate(90deg)}
}
@media (max-width:880px){
  .catgrid.c4,.catgrid.c3{grid-template-columns:1fr}
  .trace4{grid-template-columns:1fr}
  .twocalc,.twocalc.big,.dualm{grid-template-columns:1fr}
  .mob-stage{min-height:430px}.mob-legend{display:none}.mob-layers button{padding:8px 9px;font-size:10.5px}
  .filtrow .fld{min-width:130px;flex:1}
}
.cc-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:6px}
.cc-trend{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.catgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1180px){.catgrid.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:880px){.catgrid.c5{grid-template-columns:1fr}}
.catcard .cc-top{display:block;font-size:11px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catcard .cc-top b{color:var(--ink-2);font-weight:600}
.catcard .cc-foot{display:block;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:11px}
.catcard .cc-foot a{color:var(--accent);font-weight:600;text-decoration:none}
.catcard .cc-foot a:hover{text-decoration:underline}
.cc-v.zero{color:var(--muted-2)}
.catcard.off{opacity:.85}
/* las columnas del grid no deben crecer con el contenido de una tabla ancha
   (solo por encima del breakpoint del original, que las apila en una sola) */
@media (min-width:1151px){
  .g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .g32{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
}
.grid>*{min-width:0}
.legend span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmb{font-variant-numeric:tabular-nums;cursor:help}
.fmb.pend{border-style:dashed}
.fmsel{max-width:250px;font-size:12px;padding:4px 6px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.fmterms{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fmterm{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface)}
.fmterm.lib{background:var(--sage-soft);border-color:var(--sage-line)}
.fmterm button{border:none;background:none;cursor:pointer;padding:0;font-size:12px;line-height:1;color:inherit}
.fmterm.add{cursor:pointer;border-style:dashed}
/* ninguna tabla empuja el ancho de la página: si no entra, scrollea dentro de su tarjeta */
.card-b.tight{overflow-x:auto}
.card-h .right{flex-wrap:wrap;max-width:100%;min-width:0}
.searchbox{max-width:100%;min-width:0}
.searchbox input{min-width:0;width:100%}
/* las acciones de cabecera se apilan en pantallas chicas en vez de empujar el ancho */
.page-h .right,.card-h .right{flex-wrap:wrap}
@media (max-width:700px){
  .page-h{flex-direction:column;align-items:flex-start;gap:10px}
  .page-h .right{width:100%}
  .page-h .right .btn,.card-h .right .btn{flex:1 1 auto;justify-content:center}
}
@media (max-width:700px){
  .card-h{flex-wrap:wrap}
  .card-h .right{width:100%;margin-left:0}
  .dctabs{flex-wrap:wrap}
}

/* ---- Ubicaciones y facturas ---- */
.loccard{padding:16px}
.lc-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px}
.lc-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none}
.lc-ic svg{width:17px;height:17px}
.lc-name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.lc-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.lc-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px}
.lc-kv{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em}
.lc-val{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.lc-flag{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn);background:var(--warn-soft);
  border:1px solid var(--warn-line);border-radius:var(--r-sm);padding:6px 9px;margin-bottom:12px}
.lc-flag svg{width:13px;height:13px;flex:none}
.lc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lc-inv{border-top:1px dashed var(--line);padding-top:10px}
.lc-inv-t{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.invrow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line-2)}
.invrow:last-child{border-bottom:none}
.invrow.clickable{cursor:pointer;border-radius:6px}
.invrow.clickable:hover{background:var(--surface-3)}

/* ---- carga de documentos (factura / manifiesto) ---- */
.filedrop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px 20px;text-align:center;background:var(--surface-2)}
.fd-ic{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--accent);margin:0 auto 10px}
.fd-ic svg{width:18px;height:18px}
.fd-t{font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.note svg,.tiny svg{width:13px;height:13px;vertical-align:-2px;margin-right:2px;flex:none}

/* ---- Calidad e Incertidumbre ---- */
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1180px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.uq-kpi{padding:4px 0}
.uq-kv{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.uq-big{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.uq-big.sm{font-size:16px}
.uq-big small{font-size:11px;font-weight:400;color:var(--muted);margin-left:2px}
.uqcard{cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .14s;padding:14px 15px}
.uqcard:hover{border-color:var(--accent-line);box-shadow:var(--sh);transform:translateY(-1px)}
.uqcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.uqcard.sm{padding:11px 12px}
.uqcard.empty{cursor:default;background:var(--surface-2);border-style:dashed;opacity:.75}
.uqcard.empty:hover{transform:none;box-shadow:none;border-color:var(--line-2)}
.uq-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:9px}
.uq-n{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;min-height:28px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.uq-v{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.uq-v.sm{font-size:14.5px}
.uq-v small{font-size:10.5px;font-weight:400;color:var(--muted)}
.uq-u{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.hotlist{display:flex;flex-direction:column;gap:10px}
.hot-row{font-size:12.5px;color:var(--ink-2);padding:2px 0}
.hot-row b{color:var(--ink)}
.uqdetail .card-b table td{padding:5px 4px}

</style>
</head>

function countryToCC(country){
  const n=normTxt(country||'');
  const map={argentina:'AR',uruguay:'UY',chile:'CL',brasil:'BR',brazil:'BR',paraguay:'PY',bolivia:'BO',
    colombia:'CO','espana':'ES',espania:'ES',mexico:'MX',peru:'PE','estados unidos':'US'};
  if(map[n]) return map[n];
  const hit=Object.keys(map).find(k=>n.includes(k));
  if(hit) return map[hit];
  return n?n.slice(0,2).toUpperCase():'AR';
}

const rndM = mulberry(20250911);
const PLACES = {
 S1:{name:'Planta Vicente López',short:'Vicente López',lat:-34.527,lon:-58.479,kind:'plant',site:'S1'},

 air:{n:'Aéreo',ic:'plane',fe:'FE-042',c:'#C08A2A'},
};

/* distancias por tramo (km de ruta, navegación o vuelo) */
const LEGKM = {
 'CBA>S1':690,'CAM>S1':65,'ROS>S1':290,'SNI>S1':225,'BRG>S1':205,'PIL>S1':45,'PIL>S2':1160,'S1>S2':1180,
 'SPA>PSA':75,'PBA>S1':22,'CBA>PBA':700,'CAM>PBA':80,'ROS>PBA':305,'SNI>PBA':240,'BRG>PBA':215,'PMV>S3':32,
 'PSA>PBA':2280,'PBA>PMV':230,'PSA>PMV':2050,'SCL>ASC':18,'ASC>ANQ':580,'ANQ>S2':12,'PIL>PBA':50,
};
/* distancia del tramo: la matriz de rutas si el par está cargado; si no, distancia
   geodésica corregida por modo (así un par nuevo cargado por Excel nunca queda sin km) */
function legKm(a,b,mode){
  const k=LEGKM[a+'>'+b]; if(k!=null) return k;
  const A=PLACES[a],B=PLACES[b]; if(!A||!B) return 0;
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(B.lat-A.lat), dLon=rad(B.lon-A.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(A.lat))*Math.cos(rad(B.lat))*Math.sin(dLon/2)**2;
  const d=2*R*Math.asin(Math.sqrt(h));
  return Math.round(d*(mode==='road'?1.25:mode==='sea'?1.15:1.02));
}
/* trazados de navegación (waypoints) para que los tramos marítimos no crucen tierra */
const SEAPATH = {
 'PSA>PBA':[[-25.3,-46.9],[-28.6,-47.9],[-32.3,-50.3],[-34.6,-53.0],[-35.2,-55.0],[-35.0,-56.6],[-34.75,-57.6]],
 'PSA>PMV':[[-25.3,-46.9],[-28.6,-47.9],[-32.3,-50.3],[-34.6,-53.0],[-35.2,-55.0],[-35.02,-55.9]],
 'PBA>PMV':[[-34.72,-57.6],[-34.95,-56.9]],
};
function routeFor(from,site){
  const L=(a,b,mode)=>[a,b,mode,legKm(a,b,mode)];
  if(from==='SCL') return [L('SCL','ASC','road'),L('ASC','ANQ','air'),L('ANQ',site,'road')];
  if(from==='SPA') return site==='S3'?[L('SPA','PSA','road'),L('PSA','PMV','sea'),L('PMV','S3','road')]
                                     :[L('SPA','PSA','road'),L('PSA','PBA','sea'),L('PBA',site,'road')];
  if(site==='S3') return [L(from,'PBA','road'),L('PBA','PMV','sea'),L('PMV','S3','road')];
  return [L(from,site,'road')];
}

function addMov(o){
  const pv=o.pv, from=o.from||pv.place, own=!!o.own;

  const carrierFor = mode => own?OWNC:(mode==='sea'?'Línea Marítima Atlántica':mode==='air'?'Carga Aérea Andina':roadC);
  const legs = legsDef.map(([a,b,mode,km],i)=>({i,from:a,to:b,mode,km,t,tkm:round(t*km,2),fe:MODES[mode].fe,carrier:carrierFor(mode)}));

  const mv = {id,p:o.p,date:o.p+'-'+String(day).padStart(2,'0'),site:o.site,from,to:o.site,

    prov:pv?pv.id:null, provName:pv?pv.name:'Traslado interno entre plantas', matKey:o.matKey, mat:mat.id, matName:mat.name, grp:mat.grp, grpName:mat.grpName,

    purchase:o.purchase?o.purchase.rid:null, legs, inInv:!own};
  if(!own){

        source:`Transporte ${MODES[L.mode].n.toLowerCase()} — ${mat.short} · ${PLACES[L.from].name} → ${PLACES[L.to].name}`,
        qty:L.tkm,unit:'t·km',factor:L.fe,
        detail:{'Peso transportado':nf(t,2)+' t','Distancia del tramo':nf(L.km)+' km','Tramo':(i+1)+' de '+legs.length,'Transportista':L.carrier,'OC vinculada':mv.oc},
        origin:{sys:srcLog==='tms'?SYS.log:SYS.plan,doc:guia+(legs.length>1?' · tramo '+(i+1):''),
          method:'Peso transportado × distancia del tramo (t·km) × factor por modo',by:srcLog==='tms'?'Integración TMS':'Carga Excel — logística 2024'},
        cls:{state:review?'review':'auto',conf}});
      L.rid=r.rid; L.kg=r.kg;

    legs.forEach(L=>{ L.kg=L.tkm*FBI[L.fe].v; });
    const fr=REC.find(r=>r.p===o.p&&r.fleet&&r.site==='S1');
    mv.fuelRid=fr?fr.rid:null;
  }
  mv.tkm=legs.reduce((a,L)=>a+L.tkm,0);
  mv.kg=legs.reduce((a,L)=>a+L.kg,0);
  MOV.push(mv);
  return mv;
}

/* la confianza visible queda coherente con el estado: por encima del umbral
   → clasificado automáticamente; por debajo → requiere revisión */
function normalizeCls(c){
  c.conf=Math.round(c.conf);
  if(c.state==='auto'&&c.conf<CONF_THR) c.conf=CONF_THR+((c.conf*7)%18);
  if(c.state!=='auto'&&c.conf>=CONF_THR) c.conf=52+((c.conf*3)%26);
}
function postProcessRecord(r){
  if(!r.cls) r.cls={state:'auto',conf:99};
  normalizeCls(r.cls);
  if(!r.rule) r.rule=ruleOf(r);
  return r;
}
/* ============================================================

   electricidad o de gas natural de cada sitio, sin modelar equipo por
   equipo. Cargar una factura para un sitio y un período REEMPLAZA
   cualquier estimación anterior de esa misma energía en ese período
   (nunca se suma a lo que ya había, para no duplicar).

function clearPriorEnergy(siteId,period,kind){
  const hit = kind==='elec'
    ? r=>r.site===siteId&&r.p===period&&r.type==='elec'
    : r=>r.site===siteId&&r.p===period&&r.type==='fuel'&&r.factor==='FE-001';
  REC.filter(hit).forEach(r=>{
    if(r.pair){ const i=REC.findIndex(x=>x.rid===r.pair); if(i>=0) REC.splice(i,1); }
    const j=REC.findIndex(x=>x.rid===r.rid); if(j>=0) REC.splice(j,1);
  });
}

function periodsIn(f){
  return PERIODS.filter(p=>{
    if(f.year!=='all' && p.slice(0,4)!==String(f.year)) return false;
    if(f.month!=='all' && p.slice(5)!==f.month) return false;
    return true;
  });
}
function query(f=S.f, extra=null){
  const ps=new Set(periodsIn(f));
  return REC.filter(r=> ps.has(r.p) && (f.site==='all'||r.site===f.site) && (!extra||extra(r)));
}
const sum=(a,k='kg')=>a.reduce((t,r)=>t+(typeof k==='function'?k(r):r[k]),0);
function byScope(rs){const o={1:0,2:0,3:0};rs.forEach(r=>o[r.scope]+=r.kg);return o}
function byCat(rs){const o={};rs.forEach(r=>{if(r.scope===3)o[r.cat]=(o[r.cat]||0)+r.kg});return o}
function groupSum(rs,key){const o={};rs.forEach(r=>{const k=typeof key==='function'?key(r):r[key];o[k]=(o[k]||0)+r.kg});return o}

/* período anterior comparable */
function prevFilter(f){
  const g={...f};
  if(f.month!=='all'){ let m=+f.month-1,y=+f.year; if(m===0){m=12;y--} if(!PERIODS.some(p=>p.startsWith(y)))return null; g.year=y;g.month=String(m).padStart(2,'0'); }
  else { g.year=+f.year-1; if(!PERIODS.some(p=>p.startsWith(g.year)))return null; }
  return g;
}

/* ---------- Tooltip de gráficos ----------
   Un único div reutilizado por todos los gráficos SVG (barras, dona, línea).
   Cada elemento hoverable trae su contenido ya armado en data-tip y dispara
   tipShow/tipMove/tipHide inline; así no hace falta delegación por tipo de gráfico. */
function tipShow(ev){
  const el=document.getElementById('charttip'); if(!el)return;
  el.innerHTML=ev.currentTarget.getAttribute('data-tip')||'';
  el.classList.add('on');
  tipMove(ev);
}
function tipMove(ev){
  const el=document.getElementById('charttip'); if(!el||!el.classList.contains('on'))return;
  const pad=16, r=el.getBoundingClientRect();
  let x=ev.clientX+pad, y=ev.clientY-r.height/2;
  if(x+r.width>window.innerWidth-8) x=ev.clientX-r.width-pad;
  if(y<8) y=8; if(y+r.height>window.innerHeight-8) y=window.innerHeight-r.height-8;
  el.style.left=x+'px'; el.style.top=y+'px';
}
function tipHide(){const el=document.getElementById('charttip'); if(el)el.classList.remove('on')}

function donut(items,opt={}){
  const size=opt.size||190,r=size/2,ir=opt.ir||r*0.62,cx=r,cy=r;
  const tot=items.reduce((a,b)=>a+b.value,0)||1; let ang=-Math.PI/2, out='';
  items.forEach((it,i)=>{
    const a=it.value/tot*Math.PI*2, e=ang+a, large=a>Math.PI?1:0;
    const p=(rad,an)=>[cx+rad*Math.cos(an),cy+rad*Math.sin(an)];
    const[x1,y1]=p(r,ang),[x2,y2]=p(r,e),[x3,y3]=p(ir,e),[x4,y4]=p(ir,ang);
    if(a>0.0001){
      const col=it.color||C.pal[i%12];
      const tip=`<div class="tt-h">${esc(it.label)}</div>
        <div class="tt-row"><span class="tt-dot" style="background:${col}"></span><span class="tt-lab">Emisiones</span><span class="tt-val">${autoKg(it.value)}</span></div>
        <div class="tt-row"><span class="tt-lab" style="padding-left:14px">Participación</span><span class="tt-val">${nf(it.value/tot*100,1)}%</span></div>`;
      out+=`<path class="seg donutseg" style="animation-delay:${i*75}ms" d="M${x1} ${y1}A${r} ${r} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${ir} ${ir} 0 ${large} 0 ${x4} ${y4}Z" fill="${col}" data-drill="${esc(it.key||'')}" data-tip='${qesc(tip)}' onmouseenter="tipShow(event)" onmousemove="tipMove(event)" onmouseleave="tipHide()"></path>`;
    }
    ang=e;
  });
  const ctr=opt.center?`<text x="${cx}" y="${cy-3}" text-anchor="middle" style="font-size:19px;fill:var(--ink);font-weight:600">${opt.center}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" style="font-size:9.5px;letter-spacing:.1em">${esc(opt.centerSub||'')}</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto">${out}${ctr}</svg>`;
}

function stacked(labels,series,opt={}){
  const w=opt.w||720,h=opt.h||230,pl=42,pr=8,pt=10,pb=24;
  const iw=w-pl-pr, ih=h-pt-pb;
  const tots=labels.map((_,i)=>series.reduce((a,s)=>a+(s.v[i]||0),0));
  const max=Math.max(...tots,1)*1.08;
  const bw=Math.min(38,iw/labels.length*0.62), step=iw/labels.length;
  let g='',bars='',hits='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="grid" x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}"/><text x="${pl-7}" y="${y+3}" text-anchor="end">${nf(max*i/4/1000,max/1000>=10?0:1)}</text>`}
  labels.forEach((lb,i)=>{
    let acc=0; const x=pl+step*i+(step-bw)/2;
    series.forEach(s=>{const v=s.v[i]||0;if(v<=0)return;const bh=v/max*ih;const y=pt+ih-(acc+v)/max*ih;
      bars+=`<rect class="barseg" style="animation-delay:${i*20}ms" x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,.5)}" fill="${s.c}" pointer-events="none"/>`;acc+=v});
    if(labels.length<=13||i%2===0) bars+=`<text x="${x+bw/2}" y="${h-7}" text-anchor="middle">${esc(lb)}</text>`;
    /* zona de hover: cubre toda la columna (no solo el segmento) para que el
       tooltip aparezca con el desglose completo del período, como en el Hub */
    const rows=series.map(s=>`<div class="tt-row"><span class="tt-dot" style="background:${s.c}"></span><span class="tt-lab">${esc(s.n)}</span><span class="tt-val">${autoKg(s.v[i]||0)}</span></div>`).join('');
    const tip=`<div class="tt-h">${esc(lb)}${opt.year?' · '+opt.year:''}</div>${rows}<div class="tt-tot"><span>Total</span><span>${autoKg(tots[i])}</span></div>`;
    hits+=`<rect class="seg nohover" x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent" data-tip='${qesc(tip)}' onmouseenter="tipShow(event)" onmousemove="tipMove(event)" onmouseleave="tipHide()"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}${bars}${hits}<line class="axis" x1="${pl}" y1="${pt+ih}" x2="${w-pr}" y2="${pt+ih}"/></svg>`;
}
function lineChart(labels,series,opt={}){
  const w=opt.w||720,h=opt.h||210,pl=42,pr=10,pt=12,pb=24,iw=w-pl-pr,ih=h-pt-pb;
  const all=series.flatMap(s=>s.v); const max=Math.max(...all,1)*1.12, min=0;
  const X=i=>pl+(labels.length<2?iw/2:iw*i/(labels.length-1)), Y=v=>pt+ih-(v-min)/(max-min)*ih;
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="grid" x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}"/><text x="${pl-7}" y="${y+3}" text-anchor="end">${nf(max*i/4/(opt.raw?1:1000),opt.dec??1)}</text>`}
  let paths='',dots='';
  series.forEach(s=>{
    const d=s.v.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    if(s.area) paths+=`<path d="${d} L${X(s.v.length-1)} ${pt+ih} L${X(0)} ${pt+ih}Z" fill="${s.c}" opacity=".10"/>`;
    paths+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" ${s.dash?'stroke-dasharray="4 3"':''}/>`;
    dots+=s.v.map((v,i)=>{
      const val=opt.raw?nf(v,opt.dec??0)+(opt.u||''):autoKg(v);
      const tip=`<div class="tt-h">${esc(labels[i])}</div><div class="tt-row"><span class="tt-dot" style="background:${s.c}"></span><span class="tt-lab">${esc(s.n)}</span><span class="tt-val">${val}</span></div>`;
      return `<circle cx="${X(i)}" cy="${Y(v)}" r="7" fill="transparent" class="seg nohover" data-tip='${qesc(tip)}' onmouseenter="tipShow(event)" onmousemove="tipMove(event)" onmouseleave="tipHide()"/><circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${s.c}" pointer-events="none"/>`;
    }).join('');
  });
  const xl=labels.map((lb,i)=>(labels.length<=13||i%2===0)?`<text x="${X(i)}" y="${h-7}" text-anchor="middle">${esc(lb)}</text>`:'').join('');
  return `<svg class="chart linewrap" viewBox="0 0 ${w} ${h}">${g}${paths}${dots}<line class="axis" x1="${pl}" y1="${pt+ih}" x2="${w-pr}" y2="${pt+ih}"/>${xl}</svg>`;
}
function hbars(items,opt={}){
  const max=Math.max(...items.map(i=>i.value),1);
  return `<div style="display:flex;flex-direction:column;gap:9px">`+items.map((it,i)=>`
    <div class="seg" ${it.key?`data-drill="${esc(it.key)}"`:''} style="cursor:${it.key?'pointer':'default'}">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:3px">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.label)}</span>
        <span class="num dim" style="flex:none">${opt.raw?nf(it.value,opt.dec??0)+(opt.u||''):autoKg(it.value)}</span></div>
      <div class="minibar"><i style="width:${it.value/max*100}%;background:${it.color||C.pal[i%12]}"></i></div>
    </div>`).join('')+`</div>`;
}
/* mini tendencia para las tarjetas de categoría */
function spark(vals,color,w=92,h=26){
  const max=Math.max(...vals,0); if(!max) return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><line x1="0" y1="${h-2}" x2="${w}" y2="${h-2}" stroke="var(--line-2)" stroke-dasharray="3 3"/></svg>`;
  const X=i=>vals.length<2?w/2:i*(w-4)/(vals.length-1)+2, Y=v=>h-3-(v/max)*(h-7);
  const d=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${d} L${X(vals.length-1)} ${h} L${X(0)} ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="2.2" fill="${color}"/></svg>`;
}
/* barras de composición interna de un alcance: incluye las subcategorías en 0 */
function compBars(items,tot,opt={}){
  const max=Math.max(...items.map(i=>i.value),1);
  return `<div class="compbars">${items.map((it,i)=>{
    const col=it.color||C.pal[i%12], z=!it.value;
    const tip=`<div class="tt-h">${esc(it.label)}</div><div class="tt-row"><span class="tt-dot" style="background:${col}"></span><span class="tt-lab">Emisiones</span><span class="tt-val">${z?'0 t':autoKg(it.value)}</span></div><div class="tt-row"><span class="tt-lab" style="padding-left:14px">Participación</span><span class="tt-val">${nf(pct(it.value,tot),1)}%</span></div>${it.n!=null?`<div class="tt-row"><span class="tt-lab" style="padding-left:14px">Registros</span><span class="tt-val">${nf(it.n)}</span></div>`:''}`;
    return `<div class="cb-row ${z?'zero':''} ${it.key?'clickable':''}" ${it.key?`onclick="${opt.onclick?opt.onclick(it.key):''}"`:''} data-tip='${qesc(tip)}' onmouseenter="tipShow(event)" onmousemove="tipMove(event)" onmouseleave="tipHide()">
      <div class="cb-lab"><span>${esc(it.label)}</span><span class="num">${z?'<span class="dim">0 tCO₂e — Sin registros</span>':t(it.value,2)+' <span class="dim">tCO₂e</span>'}</span></div>
      <div class="cb-bar"><i style="width:${z?0:Math.max(1.5,it.value/max*100)}%;background:${col};animation-delay:${i*60}ms"></i></div>
    </div>`;}).join('')}</div>`;
}

function openDrawer(html){const d=document.getElementById('drawer');d.innerHTML=html;d.classList.add('on');document.getElementById('scrim').classList.add('on');d.scrollTop=0;const b=d.querySelector('.drawer-b');if(b)b.scrollTop=0}
