<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · IVZ Carbon</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff3ee;color:#173d35;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{background:white;border:1px solid #dbe4dc;border-radius:18px;padding:44px;width:min(440px,94vw);box-shadow:0 18px 60px #183b3510}h1{margin:0 0 8px}p{color:#65786c;line-height:1.5}label{display:block;margin-top:20px}input,button{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid #bccbbf;margin-top:8px}button{background:#245c45;color:white;cursor:pointer;margin-top:28px}#error{color:#a33131;min-height:24px}</style>
<main><h1>IVZ Carbon</h1><p>Huella de carbono corporativa</p><form id="login"><label>Usuario<input name="username" autocomplete="username" required maxlength="150"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>Ingresar</button><p id="error" role="alert"></p></form></main>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-IVZ-Carbon':'1'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok){const v=await r.json();throw Error(v.detail||'No se pudo ingresar')}location.replace('/')}catch(err){document.getElementById('error').textContent=err.message}finally{b.disabled=false}};</script></html>
