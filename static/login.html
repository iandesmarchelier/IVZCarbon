<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · IVZ Carbon</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff3ee;color:#173d35;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{background:white;border:1px solid #dbe4dc;border-radius:18px;padding:44px;width:min(440px,94vw);box-shadow:0 18px 60px #183b3510}h1{margin:0 0 8px}p{color:#65786c;line-height:1.5}label{display:block;margin-top:20px}input,button{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid #bccbbf;margin-top:8px}button{background:#245c45;color:white;cursor:pointer;margin-top:28px}.error{color:#a33131;min-height:24px}.info{color:#65786c}#code input{font:600 22px ui-monospace,monospace;letter-spacing:6px}.links{display:flex;justify-content:space-between;gap:12px;font-size:14px}.links button{width:auto;background:none;border:0;padding:0;margin:0;color:#245c45;text-decoration:underline}[hidden]{display:none}</style>
<main><h1>IVZ Carbon</h1>
<form id="login"><p>Huella de carbono corporativa</p><label>Usuario<input name="username" autocomplete="username" required maxlength="150"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>Ingresar</button><p class="error" role="alert"></p></form>
<form id="code" hidden><p>Te enviamos un código de 6 dígitos a <b id="email"></b>. Vence en 10 minutos.</p><label>Código de verificación<input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="7"></label><button>Verificar e ingresar</button><p class="error" role="alert"></p><p class="links"><button type="button" id="resend">Reenviar código</button><button type="button" id="back">Volver</button></p></form></main>
<script>
const login=document.getElementById('login'),code=document.getElementById('code');
async function post(path,body){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-IVZ-Carbon':'1'},body:JSON.stringify(body)});const v=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(typeof v.detail==='string'?v.detail:'No se pudo ingresar'),{status:r.status});return v}
function say(form,text,info){const p=form.querySelector('.error');p.className=info?'error info':'error';p.textContent=text}
function step(showCode,message=''){login.hidden=showCode;code.hidden=!showCode;say(showCode?code:login,message);(showCode?code.code:login.password).focus()}
async function busy(button,work){button.disabled=true;try{await work()}finally{button.disabled=false}}
login.onsubmit=e=>{e.preventDefault();busy(login.querySelector('button'),async()=>{try{const r=await post('login',Object.fromEntries(new FormData(login)));document.getElementById('email').textContent=r.email;code.reset();step(true)}catch(err){say(login,err.message)}})};
code.onsubmit=e=>{e.preventDefault();busy(code.querySelector('button'),async()=>{try{await post('login/verify',{code:code.code.value});location.replace('/')}catch(err){if(err.status===410)return step(false,err.message);say(code,err.message);code.code.select()}})};
document.getElementById('resend').onclick=e=>busy(e.target,async()=>{try{const r=await post('login/resend',{});say(code,'Te enviamos un código nuevo a '+r.email+'.',true)}catch(err){if(err.status===410)return step(false,err.message);say(code,err.message)}});
document.getElementById('back').onclick=()=>step(false);
</script></html>
