  --sh-lg:0 12px 40px rgba(20,38,29,.16);
  --side:238px;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
::selection{background:#D8E9DB}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CBD4CD;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}
.mono,.code{font-family:var(--mono);font-size:.92em;letter-spacing:-.02em}
h1,h2,h3,h4{letter-spacing:-.02em;font-weight:600;margin:0}

/* ---------- SHELL / BARRA LATERAL ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:16px 16px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.07)}
.mark{width:30px;height:44px;display:grid;place-items:center;flex:none}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand .nm{font-size:15px;font-weight:600;color:var(--nav-ink-hi);line-height:1.2}
.brand .sb{font-size:11px;color:var(--nav-ink-lo);margin-top:1px}
.tenant{margin:12px 10px 4px;padding:9px 10px;border-radius:var(--r-sm);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:flex;gap:9px;align-items:center;cursor:pointer;transition:background .12s}
.tenant:hover{background:rgba(255,255,255,.1)}
.tenant .av{width:26px;height:26px;border-radius:7px;background:linear-gradient(160deg,#5E8F6B,var(--accent));display:grid;place-items:center;font-size:10.5px;color:#fff;font-weight:600;flex:none}
.tenant .t1{font-size:12.5px;font-weight:500;line-height:1.2;color:var(--nav-ink-hi)}
.tenant .t2{font-size:10.5px;color:var(--nav-ink-lo)}
nav{padding:6px 10px 20px;flex:1}
.navgrp{font-size:10.5px;letter-spacing:.08em;color:#6E8477;margin:14px 8px 6px;font-weight:600;text-transform:uppercase}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--nav-ink);
  font-size:13.5px;border:none;background:none;width:100%;text-align:left;font-weight:400;position:relative;margin-bottom:1px;transition:background .12s,color .12s}
.navitem:hover{background:rgba(255,255,255,.06);color:var(--nav-ink-hi)}
.navitem.on{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
.navitem.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-2)}
.navitem svg{width:16px;height:16px;flex:none;opacity:.82}
.navitem.on svg{opacity:1}
.navitem .badge{margin-left:auto;font-size:10.5px;background:rgba(240,180,120,.16);color:#E8B98C;border:1px solid rgba(240,180,120,.24);border-radius:20px;padding:0 6px;font-weight:600}
.sidefoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:10.5px;color:var(--nav-ink-lo);line-height:1.6}

/* ---------- CABECERA ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.head-row{display:flex;align-items:center;gap:16px;padding:0 28px;height:58px}
.crumb{font-size:12.5px;color:var(--muted-2);flex:1;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.head-actions{display:flex;align-items:center;gap:8px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 28px;border-top:1px solid var(--line);background:var(--surface-2)}
.fld{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:4px 9px;background:var(--surface);transition:border-color .12s}
.fld:hover{border-color:var(--accent-line)}
.fld label{font-size:11.5px;color:var(--muted-2)}
.fld select{border:none;background:none;font-size:12.5px;font-weight:500;outline:none;cursor:pointer}
.content{padding:24px 28px 72px;max-width:1560px;width:100%}

.page-h{display:flex;align-items:flex-start;gap:18px;margin:0 0 20px;flex-wrap:wrap}
.page-h h2{font-size:21px;font-weight:600;letter-spacing:-.015em}
.page-h p{margin:4px 0 0;color:var(--ink-2);font-size:13px;max-width:70ch}
.page-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:11.5px;color:var(--muted-2);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ---------- TARJETAS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px;font-weight:600}
.card-h .sub,.card-h .hint{font-size:11.5px;color:var(--muted-2);font-weight:400}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.card-b.tight{padding:6px 0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g23{grid-template-columns:2fr 1fr} .g32{grid-template-columns:1fr 2fr}
.mt{margin-top:14px}

/* ---------- CONTROLES ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px 13px;font-size:12.5px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#356044;border-color:#356044}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:var(--r-xs)}
.btn.icon{padding:6px;width:30px;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* ---------- ETIQUETAS ---------- */
.pill,.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.pill.s1{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.s2{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.pill.s3{background:var(--sage-soft);color:var(--sage-ink);border-color:var(--sage-line)}
.pill.accent,.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.ok,.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.pill.warn,.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.err,.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.pill.teal,.badge.teal{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}

/* ---------- KPI ---------- */
.kpi{padding:15px 16px 13px;position:relative;transition:border-color .12s,box-shadow .12s,transform .12s}
.kpi.act{cursor:pointer}
.kpi.act:hover{border-color:var(--accent-line);box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi .k-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.kpi .k-name,.kpi .lab{font-size:12.5px;color:var(--ink-2);font-weight:500;flex:1;line-height:1.35}
.kpi .k-ico{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.kpi .k-ico svg{width:14px;height:14px;opacity:1}
.kpi .val{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:12.5px;font-weight:500;color:var(--muted-2);letter-spacing:0;margin-left:4px}
.kpi .foot{margin-top:10px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted-2);flex-wrap:wrap}
.kpi .k-bar{height:3px;border-radius:2px;background:var(--line);margin-top:11px;overflow:hidden}
.kpi .k-bar i{display:block;height:100%;border-radius:2px;background:var(--accent-2);transform-origin:left}
@media (prefers-reduced-motion: no-preference){.kpi .k-bar i{animation:barGrowX .5s cubic-bezier(.22,.8,.28,1) both}}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;border-radius:0;background:none}
.delta.up,.delta.bad{color:var(--bad);background:none}
.delta.down,.delta.good{color:var(--ok);background:none}
.delta.flat{color:var(--muted-2)}
.k-target{font-size:11.5px;color:var(--muted-2);border-left:1px solid var(--line-2);padding-left:9px}

/* ---------- TABLAS ---------- */
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:11.5px;color:var(--ink-2);text-align:left;font-weight:600;padding:9px 16px;background:var(--surface-2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
tr.clickable{cursor:pointer}
.r,td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
/* Las tablas largas scrollean dentro de la tarjeta con el encabezado fijo,
   como en el Hub: la página sigue navegable y el header no se pierde. */
.tblwrap{overflow:auto;max-height:620px}
.tblwrap th{position:sticky;top:0;z-index:2}
.strong{font-weight:600}
.dim{color:var(--muted)}
.tiny{font-size:11.5px}
tfoot td{border-top:1px solid var(--line-2);border-bottom:none;font-weight:600;background:var(--surface-2)}
.minibar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;min-width:48px}
.minibar i{display:block;height:100%;border-radius:3px}
.pbar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--accent-2)}
.pbar.warn i{background:#D69C2E} .pbar.bad i{background:#C0574A}
.pbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted-2);opacity:.55}
@media (prefers-reduced-motion: no-preference){
  .minibar i,.pbar i{transform-origin:left;animation:barGrowX .5s cubic-bezier(.22,.8,.28,1) both}
}
@keyframes barGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- GRÁFICOS ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:10.5px;fill:var(--muted-2)}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.seg{cursor:pointer;transition:opacity .12s}
.seg:hover{opacity:.72}
.seg.nohover:hover{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}

/* ---------- Entrada dinámica de gráficos: se reproduce cada vez que la
   vista se vuelve a montar (render() reemplaza el innerHTML por completo,
   así que estas animaciones corren de nuevo cada vez que se abre la sección) */
@media (prefers-reduced-motion: no-preference){
  .barseg{transform-box:fill-box;transform-origin:center bottom;animation:barGrow .55s cubic-bezier(.22,.8,.28,1) both}
  .donutseg{transform-box:fill-box;transform-origin:center;animation:segPop .5s cubic-bezier(.22,.8,.28,1) both}
  .linewrap{animation:fadeUp .5s cubic-bezier(.22,.8,.28,1) both}
  .barhit{animation:none}
}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes segPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

/* ---------- Tooltip de gráficos: aparece al pasar el mouse por barras,
   segmentos de dona o puntos de línea, con el detalle exacto del período */
.charttip{position:fixed;z-index:220;pointer-events:none;background:var(--nav);color:#EAF2EC;
  border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.6;box-shadow:var(--sh-lg);
  opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s;max-width:240px}
.charttip.on{opacity:1;transform:translateY(0)}
.charttip .tt-h{font-weight:600;font-size:12.5px;color:#fff;margin-bottom:3px;white-space:nowrap}
.charttip .tt-row{display:flex;align-items:center;gap:7px;white-space:nowrap}
.charttip .tt-row .tt-dot{width:7px;height:7px;border-radius:2px;flex:none}
.charttip .tt-row .tt-lab{color:#B9CBBF;flex:1}
.charttip .tt-row .tt-val{font-weight:600;font-variant-numeric:tabular-nums;margin-left:10px}
.charttip .tt-tot{border-top:1px solid rgba(255,255,255,.14);margin-top:5px;padding-top:5px;display:flex;justify-content:space-between;gap:14px;font-weight:600}

/* ---------- ÁRBOL ---------- */
.tree{font-size:12.5px;padding:6px 10px}
.node{border-left:1px dashed var(--line-2);margin-left:10px;padding-left:12px}
.nrow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--r-xs);cursor:pointer}
.nrow:hover{background:var(--surface-2)}
.nrow.on{background:var(--accent-soft);color:var(--accent)}
.nrow .cx{width:12px;font-size:10px;color:var(--muted-2);flex:none}
.nrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .kv{font-size:11.5px;color:var(--muted-2)}

/* ---------- PANEL LATERAL ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,30,24,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,100%);background:var(--surface);z-index:61;transform:translateX(102%);
  transition:transform .24s cubic-bezier(.32,.72,.34,1);display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.drawer.on{transform:none}
.drawer-h{padding:18px 22px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer-h h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.drawer-b{padding:20px 22px;overflow:auto;flex:1}

/* ---------- TRAZABILIDAD ---------- */
.tape{position:relative;padding-left:24px}
.tape:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.tstep{position:relative;margin-bottom:12px}
.tstep:before{content:"";position:absolute;left:-22px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-2)}
.tstep.origin:before{background:var(--accent);border-color:var(--accent)}
.tstep .lv{font-size:11px;color:var(--muted-2)}
.tstep .bd{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-top:5px}
.tstep .ttl{font-weight:600;font-size:13px}
.tstep .meta{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.65}
.formula{font-family:var(--mono);font-size:11.5px;background:var(--nav);color:#CBD5CE;padding:10px 12px;border-radius:var(--r-xs);margin-top:9px;overflow-x:auto;white-space:nowrap;letter-spacing:-.02em}
.formula b{color:#8FD3A3;font-weight:500}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px;margin-top:8px}
.kvs dt{font-size:11.5px;color:var(--muted-2)}
.kvs dd{margin:0}

/* ---------- ASISTENTE / IMPORTACIÓN ---------- */
.steps{display:flex;gap:6px}
.step{flex:1;padding:9px 12px;display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted-2);font-size:12px}
.step.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:600}
.step.done{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.step .n{width:19px;height:19px;border-radius:50%;background:var(--line);color:var(--ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;border:0}
.step.on .n{background:var(--accent);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.step .t{font-size:12.5px;font-weight:500}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:36px 22px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:15px;font-weight:600}
.sheettab{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.sheettab button{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:3px 11px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.sheettab button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.sheettab button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.bar-progress{height:5px;border-radius:4px;background:var(--line);overflow:hidden}
.bar-progress i{display:block;height:100%;background:var(--accent-2);transition:width .5s}

/* ---------- AVISOS ---------- */
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:var(--warn-line);color:#6B4808}
.alert{display:flex;gap:11px;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);margin-bottom:9px}
.alert:last-child{margin-bottom:0}
.alert .a-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line);color:var(--ink-2)}
.alert .a-ico svg{width:14px;height:14px}
.alert.ok{background:var(--ok-soft);border-color:var(--ok-line)} .alert.ok .a-ico{background:#D2E7D8;color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn-line)} .alert.warn .a-ico{background:#F2E1BE;color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad-line)} .alert.bad .a-ico{background:#F3D5CF;color:var(--bad)}
.alert b{display:block;font-size:12.5px;margin-bottom:1px}
.alert p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.55}

.toast{position:fixed;bottom:52px;right:18px;left:auto;transform:translateY(12px);background:var(--nav);color:#EAF2EC;padding:11px 14px;border-radius:9px;
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:400;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-lg);max-width:min(420px,88vw)}
.toast.on{opacity:1;transform:none}
.demo-flag{position:fixed;right:12px;bottom:12px;background:var(--surface);border:1px solid var(--line-2);color:var(--muted-2);font-size:10.5px;padding:3px 9px;border-radius:20px;z-index:70;box-shadow:var(--sh)}
.seg-tabs{display:inline-flex;background:var(--surface-3);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg-tabs button{border:none;background:none;padding:5px 12px;font-size:12.5px;cursor:pointer;border-radius:var(--r-xs);color:var(--ink-2);font-weight:500;transition:background .12s,color .12s}
.seg-tabs button:hover{color:var(--ink)}
.seg-tabs button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(20,38,29,.07)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.searchbox{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:5px 10px;min-width:200px;transition:border-color .12s}
.searchbox:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.searchbox input{border:none;outline:none;background:none;width:100%;font-size:12.5px}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty .e-ico{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .big{font-size:14px;color:var(--ink);font-weight:600;margin-bottom:4px}
.hr{height:1px;background:var(--line);margin:16px 0}
.flexrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
.tip{position:relative;cursor:help;border-bottom:1px dotted var(--line-2)}
.tip:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:130%;background:var(--nav);color:#EAF2EC;padding:6px 9px;border-radius:6px;
  font-size:11.5px;white-space:normal;width:230px;z-index:60;box-shadow:var(--sh-lg);font-weight:400;line-height:1.45}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

/* ======================= EDITOR DE PLANTA ======================= */
.ed{display:grid;grid-template-columns:212px 1fr 0px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;height:calc(100vh - 200px);min-height:560px}
.ed.haspanel{grid-template-columns:212px 1fr 270px}
.ed:fullscreen{height:100vh;border-radius:0}
.ed-lib{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface-2)}
.ed-lib .hd{padding:10px 11px;border-bottom:1px solid var(--line)}
.ed-lib .list{overflow:auto;flex:1;padding:6px}
.libcat{font-size:11px;color:var(--muted-2);padding:10px 6px 4px;font-weight:500}
.libitem{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:var(--r-xs);cursor:grab;font-size:12px;border:1px solid transparent}
.libitem:hover{background:var(--surface);border-color:var(--line)}
.libitem:active{cursor:grabbing}
.libitem .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--surface-3)}
.libitem .ic svg{width:13px;height:13px}
.libitem .mt2{font-size:10.5px;color:var(--muted-2)}

.ed-stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface-2)}
.ed-toolbar{display:flex;align-items:center;gap:4px;padding:6px 9px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;z-index:5}
.tsep{width:1px;height:18px;background:var(--line);margin:0 3px}
.ed-canvaswrap{position:relative;flex:1;overflow:hidden}
.ed-canvas{position:absolute;top:0;left:0;transform-origin:0 0;width:3600px;height:2400px}
.ed-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px}
.ed-grid.off{display:none}
.ed-conns{position:absolute;inset:0;pointer-events:none;overflow:visible}
.ed-conns path.hit{pointer-events:stroke;cursor:pointer}
.zone{position:absolute;border:1.5px dashed var(--line-2);border-radius:10px}
.zone .zl{position:absolute;top:-10px;left:10px;background:var(--surface);padding:0 7px;font-size:11px;color:var(--muted);border-radius:4px}
.zone.sel{border-color:var(--accent);border-style:solid}

.el{position:absolute;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;cursor:grab;user-select:none;overflow:hidden}
.el:hover{border-color:var(--muted-2)}
.el.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.el.locked{cursor:not-allowed}
.el.dimmed{opacity:.2}
.el .eic svg{width:19px;height:19px;display:block}
.el .enm{font-size:9.5px;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink-2)}
.el .ekv{font-size:9px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.el .lockb{position:absolute;top:1px;right:3px;font-size:9px;color:var(--muted-2)}
.hnd{position:absolute;width:8px;height:8px;background:var(--surface);border:1.5px solid var(--accent);border-radius:2px;z-index:6}
.hnd.rot{border-radius:50%;cursor:grab}
.marquee{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);opacity:.55;pointer-events:none;z-index:9}
.ed-minimap{position:absolute;right:12px;bottom:12px;width:170px;height:110px;background:rgba(255,255,255,.94);border:1px solid var(--line-2);border-radius:9px;overflow:hidden;z-index:8}
.ed-minimap svg{width:100%;height:100%;display:block}
.ed-hint{position:absolute;left:12px;bottom:12px;z-index:8;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--muted)}
.ed-kpis{display:flex;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}
.ed-kpis .k{padding:8px 15px;border-right:1px solid var(--line);min-width:128px}
.ed-kpis .k .l{font-size:10.5px;color:var(--muted-2);white-space:nowrap}
.ed-kpis .k .v{font-size:15px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}
.ed-kpis .k .v small{font-size:10.5px;color:var(--muted-2);font-weight:500}

.ed-props{border-left:1px solid var(--line);overflow:auto;background:var(--surface);min-width:0;min-height:0}
.ed-props .hd{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--surface);z-index:2}
.pgrp{padding:11px 13px;border-bottom:1px solid var(--line)}
.pgrp .t{font-size:11px;color:var(--muted-2);margin-bottom:8px;font-weight:500}
.frow{margin-bottom:8px}
.frow label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.frow input,.frow select,.frow textarea{border:1px solid var(--line-2);border-radius:var(--r-xs);padding:4.5px 7px;font-size:12px;background:var(--surface);width:100%;outline:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.readout{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:7px}
.readout .l{font-size:10.5px;color:var(--muted-2)}
.readout .v{font-size:15px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.layerbtn{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--r-xs);cursor:pointer;font-size:12px;width:100%;border:none;background:none;text-align:left;color:var(--ink-2)}
.layerbtn:hover{background:var(--surface-3)}
.layerbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.el.hlchain{border-color:var(--accent) !important;box-shadow:0 0 0 3px var(--accent-soft);z-index:3}

/* ---- flujo del proceso (vista de diagrama) ---- */
.flowwrap{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:4px 2px 14px}
.flowband{flex:1 1 0;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.flowband-lbl{font-size:12.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:11px;color:var(--ink)}
.flowarrow{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted-2);padding-top:44px;flex:none}
.flowsub{margin-bottom:13px}
.flowsub:last-child{margin-bottom:0}
.flowsub-t{font-size:10px;color:var(--muted-2);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.03em}
.flowlist{display:flex;flex-direction:column;gap:7px}
.flowcard{display:flex;gap:8px;padding:8px 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2);cursor:pointer}
.flowcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.flowcard.prod{background:var(--accent-soft);border-color:var(--accent-line)}
.flowcard .fic{flex:none;width:22px;height:22px;display:grid;place-items:center}
.flowcard .fic svg{width:16px;height:16px}
.flowcard .fbody{min-width:0;flex:1}
.flowcard .fnm{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flowcard .fkv{font-size:10.5px;color:var(--muted-2);margin-top:1px}
.flowcard .fkv2{font-size:10px;color:var(--muted-2);margin-top:1px}
.flowcard .fkv2.accent{color:var(--accent);font-weight:500}
.finrow{font-size:10.5px;color:var(--ink-2);margin-top:4px;display:flex;align-items:flex-start;gap:5px;line-height:1.4}
.finrow.dim{color:var(--muted-2)}
.fdot{width:7px;height:7px;border-radius:50%;margin-top:3px;flex:none}
.flowempty{font-size:11.5px;color:var(--muted);padding:14px;border:1px dashed var(--line-2);border-radius:var(--r-sm);text-align:center;line-height:1.5}
.swatch{width:9px;height:9px;border-radius:3px;flex:none}
.menu{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 16px 40px -16px rgba(16,19,17,.3);padding:5px;min-width:196px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:none;background:none;padding:6px 9px;border-radius:var(--r-xs);font-size:12.5px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-3)}
.menu button:disabled{opacity:.4;cursor:not-allowed}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu .kbd{margin-left:auto;font-size:10.5px;color:var(--muted-2);font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g23,.g32,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand,.tenant,.sidefoot{border:none;flex:none;margin:0}
  .tenant{background:rgba(255,255,255,.06)}
  nav{display:flex;gap:4px;padding:8px}
  .navgrp{display:none}
  .navitem{width:auto;white-space:nowrap;margin-bottom:0}
  .navitem.on::before{display:none}
  .head-row{padding:10px 16px;height:auto;min-height:52px;flex-wrap:wrap;gap:10px}
  .filters{padding:9px 16px}
  .content{padding:16px}
  .g2{grid-template-columns:1fr}
  .ed,.ed.haspanel{grid-template-columns:1fr;height:auto}
  .ed-lib,.ed-props{display:none}
  .ed-canvaswrap{height:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ======================= DEMO GUIADA ======================= */
.tour-scrim{position:fixed;inset:0;z-index:159;background:rgba(15,26,20,.55)}
.tour-blk{z-index:159;background:rgba(15,26,20,.55);pointer-events:auto}
.tour-hl{z-index:160;border:2px solid var(--accent-2);border-radius:10px;box-shadow:0 0 0 4px rgba(75,127,85,.2),0 12px 30px -12px rgba(20,38,29,.4);pointer-events:none}
.tour-card{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--sh-lg);padding:16px 18px}
.tour-entry{display:inline-flex;align-items:center;gap:7px;background:var(--accent-2);color:#fff;border:none;border-radius:20px;padding:7px 14px 7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s}
.tour-entry:hover{background:#579061}
.tour-entry svg{width:13px;height:13px}
</style>

/* ------------------------- producción por período ------------------------ */
const PROD={}; // PROD[period][productId] = unidades
PERIODS.forEach(p=>{const m=+p.slice(5);PROD[p]={};PRODUCTS.forEach(pr=>{PROD[p][pr.id]=Math.max(1,Math.round(jit(pr.base*season(m),.13)))})});

/* --------------------------- motor de consulta --------------------------- */
function periodsIn(f){
  return PERIODS.filter(p=>{
    if(f.year!=='all' && p.slice(0,4)!==String(f.year)) return false;
    if(f.month!=='all' && p.slice(5)!==f.month) return false;
    return true;
  });
}
function query(f=S.f, extra=null){
  const ps=new Set(periodsIn(f));
  return REC.filter(r=> ps.has(r.p) && (f.site==='all'||r.site===f.site) && (!extra||extra(r)));
}
const sum=(a,k='kg')=>a.reduce((t,r)=>t+(typeof k==='function'?k(r):r[k]),0);
function byScope(rs){const o={1:0,2:0,3:0};rs.forEach(r=>o[r.scope]+=r.kg);return o}
function byCat(rs){const o={};rs.forEach(r=>{if(r.scope===3)o[r.cat]=(o[r.cat]||0)+r.kg});return o}
function groupSum(rs,key){const o={};rs.forEach(r=>{const k=typeof key==='function'?key(r):r[key];o[k]=(o[k]||0)+r.kg});return o}

/* período anterior comparable */
function prevFilter(f){
  const g={...f};
  if(f.month!=='all'){ let m=+f.month-1,y=+f.year; if(m===0){m=12;y--} if(!PERIODS.some(p=>p.startsWith(y)))return null; g.year=y;g.month=String(m).padStart(2,'0'); }
  else { g.year=+f.year-1; if(!PERIODS.some(p=>p.startsWith(g.year)))return null; }
  return g;
}

/* ---------------------- asignación a productos --------------------------- */
function prodUnits(f){const o={};periodsIn(f).forEach(p=>PRODUCTS.forEach(pr=>{
  if(f.site!=='all'&&pr.site!==f.site)return; o[pr.id]=(o[pr.id]||0)+PROD[p][pr.id]}));return o}
function allocMap(rec,units){
  const a=rec.alloc||'corp';
  if(a.startsWith('line:')){const L=LBI[a.slice(5)];if(!L)return{};
    const w={};let tot=0;Object.keys(L.mix).forEach(pid=>{const m=(units[pid]||0)*PRBI[pid].mass;w[pid]=m;tot+=m});
    if(!tot)return{};Object.keys(w).forEach(k=>w[k]/=tot);return w}
  if(a.startsWith('site:')){
    const st=a.slice(5); const ls=LINES.filter(l=>l.site===st); const w={}; let tot=0;
    ls.forEach(l=>Object.entries(l.mix).forEach(([pid,sh])=>{const mass=(units[pid]||0)*PRBI[pid].mass*sh;w[pid]=(w[pid]||0)+mass;tot+=mass}));
    if(!tot)return{};Object.keys(w).forEach(k=>w[k]/=tot);return w;
  }
  // corp: por masa producida total
  const w={};let tot=0;PRODUCTS.forEach(pr=>{const mass=(units[pr.id]||0)*pr.mass;w[pr.id]=mass;tot+=mass});
  if(!tot)return{};Object.keys(w).forEach(k=>w[k]/=tot);return w;
}
function productFootprint(f){
  const units=prodUnits(f), rs=query(f), out={};
  PRODUCTS.forEach(pr=>{ if(f.site==='all'||pr.site===f.site) out[pr.id]={id:pr.id,units:units[pr.id]||0,total:0,byScope:{1:0,2:0,3:0},byStage:{}} });
  rs.forEach(r=>{const w=allocMap(r,units);
    for(const pid in w){ if(!out[pid])continue; const k=r.kg*w[pid]; out[pid].total+=k; out[pid].byScope[r.scope]+=k;
      const stage=STAGE[r.type]||'Otros'; out[pid].byStage[stage]=(out[pid].byStage[stage]||0)+k; }});
  Object.values(out).forEach(o=>{o.perUnit=o.units?o.total/o.units:0;o.perKg=o.units?o.total/(o.units*PRBI[o.id].mass):0});
  return out;
}
const STAGE={purchase:'Materias primas e insumos',elec:'Energía de proceso',fuel:'Combustión en sitio',fugitive:'Refrigerantes',
  td:'Pérdidas de red',transport:'Logística aguas arriba',waste:'Gestión de residuos',travel:'Viajes',commute:'Movilidad de personas'};

/* ---------------------------- formato ----------------------------------- */
const nf=(n,d=0)=>new Intl.NumberFormat('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
function t(kg,d=1){return nf(kg/1000,d)}          // toneladas
function autoKg(kg){ return kg>=1000? nf(kg/1000,1)+' t' : nf(kg,1)+' kg' }
const pct=(a,b)=>b? (a/b*100):0;
/* ============================ gráficos SVG ============================== */
/* Paleta de gráficos — misma identidad cromática que IVZ Sustainability Hub.
   s1/s2/s3 son los tres Alcances GHG y usan la escala monocromática verde
   (verde bosque · teal · verde salvia) en vez de semáforo rojo/ámbar/verde. */
const C = {s1:'#3F704D',s2:'#0F6A6B',s3:'#7FAE8B',
 pal:['#3F704D','#0F6A6B','#7FAE8B','#C08A2A','#5C7C9A','#A6453A','#3E9394','#9BAF7E','#8A6FA3','#C7A35B','#6E8477','#B07C6B'],
 grey:'#CFD7D1'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qesc=s=>String(s).replace(/'/g,'&#39;'); // para embeber HTML dentro de data-tip='...'

/* ---------- Tooltip de gráficos ----------
   Un único div reutilizado por todos los gráficos SVG (barras, dona, línea).
   Cada elemento hoverable trae su contenido ya armado en data-tip y dispara
   tipShow/tipMove/tipHide inline; así no hace falta delegación por tipo de gráfico. */
function tipShow(ev){
  const el=document.getElementById('charttip'); if(!el)return;
  el.innerHTML=ev.currentTarget.getAttribute('data-tip')||'';
  el.classList.add('on');
  tipMove(ev);
}
function tipMove(ev){
  const el=document.getElementById('charttip'); if(!el||!el.classList.contains('on'))return;
  const pad=16, r=el.getBoundingClientRect();
  let x=ev.clientX+pad, y=ev.clientY-r.height/2;
  if(x+r.width>window.innerWidth-8) x=ev.clientX-r.width-pad;
  if(y<8) y=8; if(y+r.height>window.innerHeight-8) y=window.innerHeight-r.height-8;
  el.style.left=x+'px'; el.style.top=y+'px';
}
function tipHide(){const el=document.getElementById('charttip'); if(el)el.classList.remove('on')}

function donut(items,opt={}){
  const size=opt.size||190,r=size/2,ir=opt.ir||r*0.62,cx=r,cy=r;
  const tot=items.reduce((a,b)=>a+b.value,0)||1; let ang=-Math.PI/2, out='';
  items.forEach((it,i)=>{
    const a=it.value/tot*Math.PI*2, e=ang+a, large=a>Math.PI?1:0;
    const p=(rad,an)=>[cx+rad*Math.cos(an),cy+rad*Math.sin(an)];
    const[x1,y1]=p(r,ang),[x2,y2]=p(r,e),[x3,y3]=p(ir,e),[x4,y4]=p(ir,ang);
    if(a>0.0001){
      const col=it.color||C.pal[i%12];
      const tip=`<div class="tt-h">${esc(it.label)}</div>
        <div class="tt-row"><span class="tt-dot" style="background:${col}"></span><span class="tt-lab">Emisiones</span><span class="tt-val">${autoKg(it.value)}</span></div>
        <div class="tt-row"><span class="tt-lab" style="padding-left:14px">Participación</span><span class="tt-val">${nf(it.value/tot*100,1)}%</span></div>`;
      out+=`<path class="seg donutseg" style="animation-delay:${i*75}ms" d="M${x1} ${y1}A${r} ${r} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${ir} ${ir} 0 ${large} 0 ${x4} ${y4}Z" fill="${col}" data-drill="${esc(it.key||'')}" data-tip='${qesc(tip)}' onmouseenter="tipShow(event)" onmousemove="tipMove(event)" onmouseleave="tipHide()"></path>`;
    }
    ang=e;
  });
  const ctr=opt.center?`<text x="${cx}" y="${cy-3}" text-anchor="middle" style="font-size:19px;fill:var(--ink);font-weight:600">${opt.center}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" style="font-size:9.5px;letter-spacing:.1em">${esc(opt.centerSub||'')}</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto">${out}${ctr}</svg>`;
}
function legend(items,tot){return `<div class="legend">${items.map((it,i)=>`<span><i class="dot" style="background:${it.color||C.pal[i%12]}"></i>${esc(it.label)} <b class="num" style="margin-left:3px">${nf(it.value/(tot||1)*100,1)}%</b></span>`).join('')}</div>`}

function stacked(labels,series,opt={}){
  const w=opt.w||720,h=opt.h||230,pl=42,pr=8,pt=10,pb=24;
  const iw=w-pl-pr, ih=h-pt-pb;
  const tots=labels.map((_,i)=>series.reduce((a,s)=>a+(s.v[i]||0),0));
  const max=Math.max(...tots,1)*1.08;
  const bw=Math.min(38,iw/labels.length*0.62), step=iw/labels.length;
  let g='',bars='',hits='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="grid" x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}"/><text x="${pl-7}" y="${y+3}" text-anchor="end">${nf(max*i/4/1000,max/1000>=10?0:1)}</text>`}
  labels.forEach((lb,i)=>{
    let acc=0; const x=pl+step*i+(step-bw)/2;
    series.forEach(s=>{const v=s.v[i]||0;if(v<=0)return;const bh=v/max*ih;const y=pt+ih-(acc+v)/max*ih;
      bars+=`<rect class="barseg" style="animation-delay:${i*20}ms" x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,.5)}" fill="${s.c}" pointer-events="none"/>`;acc+=v});
    if(labels.length<=13||i%2===0) bars+=`<text x="${x+bw/2}" y="${h-7}" text-anchor="middle">${esc(lb)}</text>`;
    /* zona de hover: cubre toda la columna (no solo el segmento) para que el
       tooltip aparezca con el desglose completo del período, como en el Hub */
    const rows=series.map(s=>`<div class="tt-row"><span class="tt-dot" style="background:${s.c}"></span><span class="tt-lab">${esc(s.n)}</span><span class="tt-val">${autoKg(s.v[i]||0)}</span></div>`).join('');
    const tip=`<div class="tt-h">${esc(lb)}${opt.year?' · '+opt.year:''}</div>${rows}<div class="tt-tot"><span>Total</span><span>${autoKg(tots[i])}</span></div>`;
    hits+=`<rect class="seg nohover" x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent" data-tip='${qesc(tip)}' onmouseenter="tipShow(event)" onmousemove="tipMove(event)" onmouseleave="tipHide()"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}${bars}${hits}<line class="axis" x1="${pl}" y1="${pt+ih}" x2="${w-pr}" y2="${pt+ih}"/><text x="4" y="${pt+6}" style="font-size:9px">tCO₂e</text></svg>`;
}
function lineChart(labels,series,opt={}){
  const w=opt.w||720,h=opt.h||210,pl=42,pr=10,pt=12,pb=24,iw=w-pl-pr,ih=h-pt-pb;
  const all=series.flatMap(s=>s.v); const max=Math.max(...all,1)*1.12, min=0;
  const X=i=>pl+(labels.length<2?iw/2:iw*i/(labels.length-1)), Y=v=>pt+ih-(v-min)/(max-min)*ih;
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="grid" x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}"/><text x="${pl-7}" y="${y+3}" text-anchor="end">${nf(max*i/4/(opt.raw?1:1000),opt.dec??1)}</text>`}
  let paths='',dots='';
  series.forEach(s=>{
    const d=s.v.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    if(s.area) paths+=`<path d="${d} L${X(s.v.length-1)} ${pt+ih} L${X(0)} ${pt+ih}Z" fill="${s.c}" opacity=".10"/>`;
    paths+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" ${s.dash?'stroke-dasharray="4 3"':''}/>`;
    dots+=s.v.map((v,i)=>{
      const val=opt.raw?nf(v,opt.dec??0)+(opt.u||''):autoKg(v);
      const tip=`<div class="tt-h">${esc(labels[i])}</div><div class="tt-row"><span class="tt-dot" style="background:${s.c}"></span><span class="tt-lab">${esc(s.n)}</span><span class="tt-val">${val}</span></div>`;
      return `<circle cx="${X(i)}" cy="${Y(v)}" r="7" fill="transparent" class="seg nohover" data-tip='${qesc(tip)}' onmouseenter="tipShow(event)" onmousemove="tipMove(event)" onmouseleave="tipHide()"/><circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${s.c}" pointer-events="none"/>`;
    }).join('');
  });
  const xl=labels.map((lb,i)=>(labels.length<=13||i%2===0)?`<text x="${X(i)}" y="${h-7}" text-anchor="middle">${esc(lb)}</text>`:'').join('');
  return `<svg class="chart linewrap" viewBox="0 0 ${w} ${h}">${g}${paths}${dots}<line class="axis" x1="${pl}" y1="${pt+ih}" x2="${w-pr}" y2="${pt+ih}"/>${xl}</svg>`;
}
function hbars(items,opt={}){
  const max=Math.max(...items.map(i=>i.value),1);
  return `<div style="display:flex;flex-direction:column;gap:9px">`+items.map((it,i)=>`
    <div class="seg" ${it.key?`data-drill="${esc(it.key)}"`:''} style="cursor:${it.key?'pointer':'default'}">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:3px">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.label)}</span>
        <span class="num dim" style="flex:none">${opt.raw?nf(it.value,opt.dec??0)+(opt.u||''):autoKg(it.value)}</span></div>
      <div class="minibar"><i style="width:${it.value/max*100}%;background:${it.color||C.pal[i%12]}"></i></div>
    </div>`).join('')+`</div>`;
}

  </table></div>`;
}
/* ============================== VISTAS ================================== */
const V={};

function head(title,sub,right=''){return `<div class="page-h"><div><h2>${title}</h2><p>${sub}</p></div><div class="right">${right}</div></div>`}
/* Tarjeta de indicador — anatomía del Hub: nombre + ícono, valor, pie con
   variación y, opcionalmente, una barra de avance. Los argumentos opcionales
   (icon, bar, act) se pueden pasar como 5º parámetro suelto o como objeto. */
function kpi(lab,val,unit,foot,opt){
  const o = typeof opt==='string' ? {icon:opt} : (opt||{});
  const ic = o.icon || 'leaf';
  const bar = (o.bar==null) ? '' :
    `<div class="k-bar"><i style="width:${Math.max(0,Math.min(100,o.bar))}%${o.barColor?';background:'+o.barColor:''}"></i></div>`;
  const act = o.onclick ? ` act" onclick="${o.onclick}" tabindex="0` : '';
  return `<div class="card kpi${act}">
    <div class="k-top"><div class="k-name">${lab}</div><div class="k-ico">${ico(ic)}</div></div>
    <div class="val">${val}<small>${unit||''}</small></div>
    <div class="foot">${foot||''}</div>${bar}</div>`;
}
function deltaTag(cur,prev,invert=false){
  if(prev==null||!prev)return '<span class="dim tiny">sin período comparable</span>';
  const d=(cur-prev)/prev*100, up=d>=0;
  const good = invert ? up : !up;
  const arrow = Math.abs(d)<0.05 ? '–' : (up?'▲':'▼');
  const cls = Math.abs(d)<0.05 ? 'flat' : (good?'good':'bad');
  return `<span class="delta ${cls}">${arrow} ${nf(Math.abs(d),1)}%</span><span class="k-target">vs. período anterior</span>`;
}
function monthLabels(f){ return periodsIn({...f,month:'all'}).map(p=>MONTHS[+p.slice(5)-1]) }
function monthSeriesByScope(f){
  const ps=periodsIn({...f,month:'all'});
  const mk=s=>ps.map(p=>sum(REC.filter(r=>r.p===p&&r.scope===s&&(f.site==='all'||r.site===f.site))));
  return [{n:'Alcance 1',c:C.s1,key:'s1',v:mk(1)},{n:'Alcance 2',c:C.s2,key:'s2',v:mk(2)},{n:'Alcance 3',c:C.s3,key:'s3',v:mk(3)}];
}

function plantaJerarquia(f){
  const rs=query(f);
  const kwhOf=ids=>sum(rs.filter(r=>r.type==='elec'&&ids.includes(r.mach)),'qty');
  const kgOf=ids=>sum(rs.filter(r=>r.mach&&ids.includes(r.mach)));
  const sites=SITES.filter(s=>f.site==='all'||s.id===f.site);
  let tree='';
  const machRow=(m,depth)=>{
    const ids=[m.id];
    return `<div class="nrow ${S.node==='m:'+m.id?'on':''}" style="padding-left:${depth*4}px" onclick="pickNode('m:${m.id}')">
      <span class="cx">▪</span><span class="nm">${esc(m.name)} ${m.line?`<span class="pill" style="font-size:9px">${m.line}</span>`:''}</span>
      <span class="kv">${nf(m.kw)} kW</span><span class="kv" style="width:78px;text-align:right">${nf(kwhOf(ids),0)} kWh</span>
      <span class="kv strong" style="width:74px;text-align:right;color:var(--ink)">${autoKg(kgOf(ids))}</span></div>`;
  };
  sites.forEach(s=>{
    const sMach=MACH.filter(m=>m.site===s.id).map(m=>m.id);
    const open=S.open.has(s.id);
    tree+=`<div class="nrow ${S.node==='s:'+s.id?'on':''}" onclick="toggleNode('${s.id}')">
      <span class="cx">${open?'▾':'▸'}</span><span class="nm strong">${esc(s.name)}</span>
      <span class="kv">${s.type}</span><span class="kv" style="width:78px;text-align:right">${nf(kwhOf(sMach),0)} kWh</span>
      <span class="kv strong" style="width:74px;text-align:right;color:var(--ink)">${autoKg(sum(rs.filter(r=>r.site===s.id)))}</span></div>`;
    if(!open)return;
    tree+='<div class="node">';
    if(S.treeMode==='proc'){
      const sectors=[...new Set(PROCS.filter(p=>p.site===s.id).map(p=>p.sector))];
      sectors.forEach(sec=>{
        const key=s.id+'|'+sec, procs=PROCS.filter(p=>p.site===s.id&&p.sector===sec);
        const mids=MACH.filter(m=>m.site===s.id&&m.sector===sec).map(m=>m.id);
        const o=S.open.has(key);
        tree+=`<div class="nrow" onclick="toggleNode('${key}')"><span class="cx">${o?'▾':'▸'}</span><span class="nm strong">${esc(sec)}</span>
          <span class="kv">${procs.length} procesos</span><span class="kv" style="width:78px;text-align:right">${nf(kwhOf(mids),0)} kWh</span>
          <span class="kv strong" style="width:74px;text-align:right;color:var(--ink)">${autoKg(kgOf(mids))}</span></div>`;
        if(!o)return; tree+='<div class="node">';
        procs.forEach(pc=>{
          const pm=MACH.filter(m=>m.proc===pc.id), pids=pm.map(m=>m.id), o2=S.open.has(pc.id);
          tree+=`<div class="nrow ${S.node==='p:'+pc.id?'on':''}" onclick="S.node='p:${pc.id}';toggleNode('${pc.id}')"><span class="cx">${o2?'▾':'▸'}</span><span class="nm">${esc(pc.name)}</span>
            <span class="kv">${pm.length} equipos</span><span class="kv" style="width:78px;text-align:right">${nf(kwhOf(pids),0)} kWh</span>
            <span class="kv strong" style="width:74px;text-align:right;color:var(--ink)">${autoKg(kgOf(pids))}</span></div>`;
          if(o2){tree+='<div class="node">'+pm.map(m=>machRow(m,0)).join('')+'</div>'}
        });
        tree+='</div>';
      });
    } else {
      const lines=LINES.filter(l=>l.site===s.id);
      lines.forEach(l=>{
        const lm=MACH.filter(m=>m.line===l.id), lids=lm.map(m=>m.id), o=S.open.has(l.id);
        tree+=`<div class="nrow" onclick="toggleNode('${l.id}')"><span class="cx">${o?'▾':'▸'}</span><span class="nm strong">${esc(l.name)}</span>
          <span class="kv">${Object.keys(l.mix).map(p=>PRBI[p].name.split(' ')[0]).join(' / ')}</span>
          <span class="kv" style="width:78px;text-align:right">${nf(kwhOf(lids),0)} kWh</span>
          <span class="kv strong" style="width:74px;text-align:right;color:var(--ink)">${autoKg(kgOf(lids))}</span></div>`;
        if(o){tree+='<div class="node">'+lm.map(m=>machRow(m,0)).join('')+'</div>'}
      });
      const aux=MACH.filter(m=>m.site===s.id&&!m.line), o=S.open.has(s.id+'|aux');
      tree+=`<div class="nrow" onclick="toggleNode('${s.id}|aux')"><span class="cx">${o?'▾':'▸'}</span><span class="nm strong">Servicios auxiliares</span>
        <span class="kv">se prorratean</span><span class="kv" style="width:78px;text-align:right">${nf(kwhOf(aux.map(m=>m.id)),0)} kWh</span>
        <span class="kv strong" style="width:74px;text-align:right;color:var(--ink)">${autoKg(kgOf(aux.map(m=>m.id)))}</span></div>`;
      if(o){tree+='<div class="node">'+aux.map(m=>machRow(m,0)).join('')+'</div>'}
    }
    tree+='</div>';
  });
  return head('Modelo digital de planta','Estructura operativa sobre la que se calculan las emisiones: sitio, sector, proceso, línea productiva y equipo. Cada nivel acumula el consumo y las emisiones de los equipos que contiene.',
   `<div class="seg-tabs"><button onclick="S.plantaTab='plano';render()">Plano</button><button class="on">Jerarquía</button><button onclick="S.plantaTab='flujo';render()">Flujo</button></div>
    <div class="seg-tabs"><button class="${S.treeMode==='proc'?'on':''}" onclick="S.treeMode='proc';render()">Por proceso</button><button class="${S.treeMode==='line'?'on':''}" onclick="S.treeMode='line';render()">Por línea</button></div>`)
  +`<div class="grid g23">
     <div class="card"><div class="card-h"><h3>Estructura operativa</h3><div class="sub">${MACH.filter(m=>f.site==='all'||m.site===f.site).length} equipos modelados</div>
       <div class="right"><span class="eyebrow">kWh · tCO₂e del período</span></div></div>
       <div class="card-b tight"><div class="tree">${tree}</div></div></div>
     <div>${nodeDetail(f)}</div>
   </div>`;
}

  const rs=query(f).filter(r=>r.type==='elec');
  const machs=MACH.filter(m=>f.site==='all'||m.site===f.site).map(m=>{
    const mr=rs.filter(r=>r.mach===m.id), kwh=sum(mr,'qty');
    return {m,kwh,kg:sum(mr),h:kwh/(m.kw*m.lf||1)};

S.dr={scope:null,site:null,src:null};
const enc=s=>encodeURIComponent(String(s)).replace(/'/g,'%27');
function drill(k,v){v=decodeURIComponent(v); if(k==='scope')v=+v;
  S.dr[k]=(S.dr[k]===v?null:v); if(k==='scope'){S.dr.site=null;S.dr.src=null} if(k==='site')S.dr.src=null; render()}
V.trazabilidad=f=>{
  const rs=query(f);
  const d=S.dr;
  const l1=[1,2,3].map(s=>({k:s,label:'Alcance '+s,v:sum(rs.filter(r=>r.scope===s))}));
  const f1=d.scope?rs.filter(r=>r.scope===d.scope):rs;
  const l2=Object.entries(groupSum(f1,'site')).map(([k,v])=>({k,label:SBI[k].name,v}));
  const f2=d.site?f1.filter(r=>r.site===d.site):f1;
  const l3=Object.entries(groupSum(f2,r=>r.source.split(' · ')[0])).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,label:k,v}));
  const f3=d.src?f2.filter(r=>r.source.split(' · ')[0]===d.src):f2;
  const col=(title,items,key,cur,tot)=>`<div class="card" style="min-width:0"><div class="card-h"><h3>${title}</h3><div class="sub">${items.length}</div></div>
    <div class="card-b tight" style="max-height:420px;overflow:auto"><table><tbody>
    ${items.map(it=>`<tr class="clickable" onclick="drill('${key}','${enc(it.k)}')" style="${cur===it.k?'background:var(--accent-soft)':''}">
      <td><div class="${cur===it.k?'strong':''}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px">${esc(it.label)}</div>
        <div class="minibar" style="margin-top:4px"><i style="width:${pct(it.v,tot)}%;background:${cur===it.k?'var(--accent)':'var(--line-2)'}"></i></div></td>
      <td class="r num tiny nowrap" style="width:74px">${autoKg(it.v)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  const path=[d.scope?'Alcance '+d.scope:null,d.site?SBI[d.site].name:null,d.src].filter(Boolean);
  return head('Trazabilidad','Recorrido desde el número consolidado hasta el comprobante que lo originó. Cada corte recalcula el total sobre los registros que quedan por debajo.',
    `${path.length?`<button class="btn ghost" onclick="S.dr={scope:null,site:null,src:null};render()">Limpiar recorrido</button>`:''}`)
  +`<div class="card" data-tour="trace-summary" style="margin-bottom:16px"><div class="card-b" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div><div class="eyebrow">Recorrido actual</div>
        <div style="font-size:14px;margin-top:4px">${path.length?path.map(p=>`<b>${esc(p)}</b>`).join(' <span class="dim">›</span> '):'<span class="dim">Inventario completo del período</span>'}</div></div>
      <div style="margin-left:auto;text-align:right"><div class="eyebrow">Emisiones del corte</div>
        <div class="num" style="font-size:26px;font-weight:600">${t(sum(f3),2)} <small style="font-size:12px;color:var(--muted)">tCO₂e</small></div>
        <div class="tiny dim">${nf(pct(sum(f3),sum(rs)),1)}% del inventario · ${nf(f3.length)} registros</div></div>
    </div></div>
    <div class="grid" data-tour="trace-cols" style="grid-template-columns:repeat(3,1fr)">
      ${col('Alcance',l1,'scope',d.scope,sum(rs))}
      ${col('Sitio',l2,'site',d.site,sum(f1))}
      ${col('Fuente de emisión',l3,'src',d.src,sum(f2))}
    </div>
    <div class="card mt"><div class="card-h"><h3>Registros del corte</h3><div class="sub">clic para abrir la cadena completa hasta el documento de origen</div></div>
      <div class="card-b tight">${recTable(f3.sort((a,b)=>b.kg-a.kg),{limit:40})}</div></div>`;
};

function edTraceSources(id,etype,seen){
  const p=EP();
  const incoming=p.conns.filter(c=>c.b===id&&c.t===etype);
  if(!incoming.length) return [];
  const withPct=incoming.map(c=>({c,pct:c.pct!=null?+c.pct:(100/incoming.length)}));
  const sumPct=withPct.reduce((a,x)=>a+(x.pct||0),0)||1;
  let out=[];
  withPct.forEach(({c,pct})=>{
    const w=pct/sumPct, A=p.els.find(x=>x.id===c.a);
    if(!A||seen.has(A.id))return;
    if(A.p.esFuenteEnergia){ out.push({src:A,weight:w}); }
    else{ edTraceSources(A.id,etype,new Set([...seen,A.id])).forEach(u=>out.push({src:u.src,weight:w*u.weight})); }
  });
  return out;
}
function edEnergyMix(e){
  if(e.p.esFuenteEnergia) return null;
  if(e.p.energia!=='electricidad'&&e.p.energia!=='gas') return null;
  const list=edTraceSources(e.id,e.p.energia,new Set([e.id]));
  if(!list.length) return null;
  const merged={};
  list.forEach(x=>{const k=x.src.id;if(!merged[k])merged[k]={src:x.src,weight:0};merged[k].weight+=x.weight});
  const arr=Object.values(merged).filter(x=>x.weight>0.0005).sort((a,b)=>b.weight-a.weight);
  if(!arr.length) return null;
  const totW=arr.reduce((a,x)=>a+x.weight,0)||1;
  const factor=arr.reduce((a,x)=>{const f=FBI[x.src.p.factor];return a+(f?f.v:0)*(x.weight/totW)},0);
  return {factor,mix:arr.map(x=>({src:x.src,pct:round(x.weight/totW*100,1)}))};
}
/* Cadena de nodos y conexiones aguas arriba de un equipo, para el resaltado
   de «Mostrar suministro energético». */
function edSupplyChain(id){
  const p=EP(),e=p.els.find(x=>x.id===id);
  const nodes=new Set([id]),conns=new Set();
  if(!e) return{nodes,conns};
  const etype=e.p.energia;
  if(etype!=='electricidad'&&etype!=='gas') return{nodes,conns};
  (function walk(nid,seen){
    p.conns.filter(c=>c.b===nid&&c.t===etype).forEach(c=>{
      const A=p.els.find(x=>x.id===c.a);if(!A||seen.has(A.id))return;
      nodes.add(A.id);conns.add(c.id);
      if(!A.p.esFuenteEnergia) walk(A.id,new Set([...seen,A.id]));
    });
  })(id,new Set([id]));
  return {nodes,conns};
}
function edShowSupply(id){S.ed.spotlight=(S.ed.spotlight===id)?null:id;edRender()}
function edCalc(e){
  const p=e.p, kwh = p.energia==='electricidad' ? (p.kwhManual!=null?p.kwhManual:(p.kw*p.fu*p.horas)) : 0;
  let a1=0,a2=0;
  const mix=edEnergyMix(e);
  const f=FBI[p.factor];
  const fv=mix?mix.factor:(f?f.v:null);
  if(fv!=null){
    if(p.energia==='electricidad') a2=kwh*fv;
    else if(p.energia!=='electricidad'&&p.energia!=='ninguna') a1=p.consumo*fv;
  }
  return {kwh:round(kwh,1),a1:round(a1,1),a2:round(a2,1),tot:round(a1+a2,1),mix,fv};
}
function edVisible(e){
  const v=S.ed.view; if(v.m==='all')return true;
  if(v.m==='sector')return e.p.sector===v.v;
  if(v.m==='proceso')return e.p.proceso===v.v;
  if(v.m==='linea')return e.p.linea===v.v;
  if(v.m==='maquina')return e.id===v.v;
  return true;
}
function edKpis(){
  const els=EP().els.filter(edVisible);
  let kw=0,kwh=0,a1=0,a2=0,sinDato=0,sinFactor=0,camposOk=0,campos=0,fuentes=0;
  const req=['name','code'],reqP=['sector','proceso','estado','fuente'];
  els.forEach(e=>{const c=edCalc(e);kw+=e.p.kw;kwh+=c.kwh;a1+=c.a1;a2+=c.a2;
    if(e.p.esFuenteEnergia)fuentes++;
    if(!e.p.kw&&!e.p.consumo)sinDato++;
    if(!e.p.factor&&e.p.energia!=='ninguna'&&!c.mix)sinFactor++;
    req.forEach(k=>{campos++;if(e[k])camposOk++});
    reqP.forEach(k=>{campos++;if(e.p[k]&&e.p[k]!=='Sin asignar'&&e.p[k]!=='Sin dato')camposOk++});
  });
  return {n:els.length,kw:round(kw,1),kwh:round(kwh,0),a1,a2,tot:a1+a2,sinDato,sinFactor,fuentes,compl:campos?Math.round(camposOk/campos*100):0};
}
function edHeat(v,max){ if(!max)return null; const r=Math.min(v/max,1);
  const st=[[234,243,239],[196,226,205],[240,220,150],[226,150,96],[194,96,60]];
  const i=Math.min(Math.floor(r*4),3), fr=r*4-i, a=st[i],b=st[i+1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*fr)},${Math.round(a[1]+(b[1]-a[1])*fr)},${Math.round(a[2]+(b[2]-a[2])*fr)})`;
}
function edStyle(e){
  const L=S.ed.layer, c=edCalc(e), els=EP().els;
  const mx=k=>Math.max(...els.map(x=>k(x)),0);
  if(L==='procesos'){const col=SECT_C[e.p.sector]||'#C4C9C2';return{bg:col+'22',bd:col,tag:e.p.sector}}
  if(L==='electrico'){const m=mx(x=>edCalc(x).kwh);return{bg:edHeat(c.kwh,m),bd:c.kwh>m*.6?'#C2603C':'var(--line-2)',tag:nf(c.kwh,0)+' kWh'}}
  if(L==='combustible'){const m=mx(x=>x.p.energia!=='electricidad'&&x.p.energia!=='ninguna'?x.p.consumo:0);
    const v=(e.p.energia!=='electricidad'&&e.p.energia!=='ninguna')?e.p.consumo:0;
    return{bg:v?edHeat(v,m):null,bd:v?'#C2603C':'var(--line-2)',tag:v?nf(v,0)+' '+e.p.unidadComb:'—',dim:!v}}
  if(L==='a1'){const m=mx(x=>edCalc(x).a1);return{bg:c.a1?edHeat(c.a1,m):null,bd:c.a1?'#C2603C':'var(--line-2)',tag:c.a1?nf(c.a1,0)+' kg':'—',dim:!c.a1}}
  if(L==='a2'){const m=mx(x=>edCalc(x).a2);return{bg:c.a2?edHeat(c.a2,m):null,bd:c.a2?'#C0972F':'var(--line-2)',tag:c.a2?nf(c.a2,0)+' kg':'—',dim:!c.a2}}
  if(L==='producto'){const pr=(e.p.productos||'').split(',')[0].trim();
    const list=[...new Set(els.map(x=>(x.p.productos||'').split(',')[0].trim()).filter(Boolean))];
    const col=pr?C.pal[list.indexOf(pr)%12]:'#C4C9C2';return{bg:pr?col+'22':null,bd:pr?col:'var(--line-2)',tag:pr||'sin producto',dim:!pr}}
  if(L==='medidores'){const has=!!e.p.medidor;return{bg:has?'var(--accent-soft)':null,bd:has?'var(--accent)':'var(--line-2)',tag:has?e.p.medidor:'sin medidor',dim:!has}}
  if(L==='estado'){const col={'En operación':'#3E9C7C','Detenido':'#C0972F','En mantenimiento':'#6E7FA6','Fuera de servicio':'#C2603C','Standby':'#A4AAA3'}[e.p.estado];
    return{bg:col+'22',bd:col,tag:e.p.estado}}
  if(L==='calidad'){const col={'Medidor':'#3E9C7C','Factura':'#3F92B8','Estimado':'#C0972F','Sin dato':'#C2603C'}[e.p.fuente]||'#C4C9C2';
    return{bg:col+'22',bd:col,tag:e.p.fuente}}
  if(e.p.esFuenteEnergia){const col=e.p.energia==='gas'?'#C2603C':'#C0972F';
    return{bg:col+'16',bd:col,tag:e.p.tipoSuministro||''}}
  return {bg:null,bd:'var(--line-2)',tag:e.p.kw?nf(e.p.kw,0)+' kW':(e.p.consumo?nf(e.p.consumo,0)+' '+e.p.unidadComb:'')};
}

function edAdd(k,x,y){edPush();const e=mkEl(k,x,y);EP().els.push(e);S.ed.sel=new Set([e.id]);edRender();edSaved()}
function edDup(){const s=edSel();if(!s.length)return;edPush();
  const ns=s.map(e=>{const c=JSON.parse(JSON.stringify(e));c.id=nid('E');c.code=(e.code||'EQ')+'-copia';c.name=e.name+' (copia)';c.x+=24;c.y+=24;c.locked=false;return c});
  EP().els.push(...ns);S.ed.sel=new Set(ns.map(e=>e.id));edRender();edSaved();toast(ns.length+' elemento'+(ns.length>1?'s duplicados':' duplicado')+' con código y datos propios.','⧉')}
function edDel(){const ids=[...S.ed.sel];if(!ids.length)return;edPush();const p=EP();
  p.els=p.els.filter(e=>!(ids.includes(e.id)&&!e.locked));p.zones=p.zones.filter(z=>!ids.includes(z.id));
  p.conns=p.conns.filter(c=>p.els.some(e=>e.id===c.a)&&p.els.some(e=>e.id===c.b));
  S.ed.sel=new Set();edRender();edSaved()}
function edCopy(){S.ed.clip=JSON.parse(JSON.stringify(edSel()));if(S.ed.clip.length)toast(S.ed.clip.length+' elemento(s) copiados.','⧉')}
function edPaste(){if(!S.ed.clip.length)return;edPush();
  const ns=S.ed.clip.map(e=>{const c=JSON.parse(JSON.stringify(e));c.id=nid('E');c.x+=30;c.y+=30;return c});
  EP().els.push(...ns);S.ed.sel=new Set(ns.map(e=>e.id));edRender();edSaved()}
function edLock(){const s=edSel();if(!s.length)return;edPush();const v=!s[0].locked;s.forEach(e=>e.locked=v);edRender();edSaved()}
function edAlign(how){const s=edSel();if(s.length<2)return;edPush();
  const L=Math.min(...s.map(e=>e.x)),R=Math.max(...s.map(e=>e.x+e.w)),T=Math.min(...s.map(e=>e.y)),B=Math.max(...s.map(e=>e.y+e.h));
  s.forEach(e=>{if(how==='l')e.x=L;if(how==='r')e.x=R-e.w;if(how==='t')e.y=T;if(how==='b')e.y=B-e.h;
    if(how==='cx')e.x=(L+R)/2-e.w/2;if(how==='cy')e.y=(T+B)/2-e.h/2});
  edRender();edSaved()}
function edDist(axis){const s=edSel();if(s.length<3)return;edPush();
  s.sort((a,b)=>axis==='x'?a.x-b.x:a.y-b.y);
  const first=s[0],last=s[s.length-1];
  const span=axis==='x'?(last.x-first.x):(last.y-first.y), step=span/(s.length-1);
  s.forEach((e,i)=>{if(axis==='x')e.x=first.x+step*i;else e.y=first.y+step*i});
  edRender();edSaved();toast('Elementos distribuidos uniformemente.','↔')}
function edGroup(){const s=edSel();if(s.length<2)return;
  const name=prompt('Nombre del sector o agrupación:','Sector nuevo');if(!name)return;edPush();
  const L=Math.min(...s.map(e=>e.x))-22,T=Math.min(...s.map(e=>e.y))-30,
        R=Math.max(...s.map(e=>e.x+e.w))+22,B=Math.max(...s.map(e=>e.y+e.h))+22;
  EP().zones.push({id:nid('Z'),name,x:L,y:T,w:R-L,h:B-T,c:'#3F704D'});
  s.forEach(e=>e.p.sector=name);edRender();edSaved();toast('Agrupados en «'+name+'». El sector se asignó a cada equipo.','▣')}

function edFit(){const els=EP().els.filter(edVisible);if(!els.length)return;
  const w=document.getElementById('edWrap');if(!w)return;const r=w.getBoundingClientRect();
  const L=Math.min(...els.map(e=>e.x)),T=Math.min(...els.map(e=>e.y)),
        R=Math.max(...els.map(e=>e.x+e.w)),B=Math.max(...els.map(e=>e.y+e.h));
  if(!r.width||!r.height)return;
  const z=Math.max(.3,Math.min(r.width/(R-L+120),r.height/(B-T+120),1.6));
  S.ed.zoom=z;S.ed.px=(r.width-(R-L)*z)/2-L*z;S.ed.py=(r.height-(B-T)*z)/2-T*z;edRender()}
function edZoom(d,cx,cy){const w=document.getElementById('edWrap');if(!w)return;const r=w.getBoundingClientRect();
  cx=cx==null?r.width/2:cx;cy=cy==null?r.height/2:cy;
  const z0=S.ed.zoom,z=Math.max(.25,Math.min(2.4,z0*d));
  S.ed.px=cx-(cx-S.ed.px)*(z/z0);S.ed.py=cy-(cy-S.ed.py)*(z/z0);S.ed.zoom=z;edRender()}

function edTransform(){const h=document.getElementById('edCanvasHost');
  if(h)h.style.transform=`translate(${S.ed.px}px,${S.ed.py}px) scale(${S.ed.zoom})`}
function edGeom(e){return{cx:e.x+e.w/2,cy:e.y+e.h/2}}
function edRect(e){return{l:e.x,r:e.x+e.w,t:e.y,b:e.y+e.h,cx:e.x+e.w/2,cy:e.y+e.h/2}}
/* Busca, sobre el tramo intermedio de una conexión ortogonal, un punto que
   no atraviese la caja de otro elemento. Si el punto propuesto queda dentro
   de una caja, lo corre justo afuera de ese elemento (por el lado más
   cercano), siempre que el nuevo punto siga entre las dos puntas. */
function edFreeCoord(mid,rangeMin,rangeMax,boxes,loMin,loMax,axis){
  const hit=boxes.find(b=>axis==='x'
    ?(mid>b.l&&mid<b.r&&rangeMax>b.t&&rangeMin<b.b)
    :(mid>b.t&&mid<b.b&&rangeMax>b.l&&rangeMin<b.r));
  if(!hit) return mid;
  const gap=16;
  const optHi=(axis==='x'?hit.r:hit.b)+gap, optLo=(axis==='x'?hit.l:hit.t)-gap;
  const okHi=optHi<=loMax, okLo=optLo>=loMin;
  if(okHi&&okLo) return Math.abs(optHi-mid)<=Math.abs(optLo-mid)?optHi:optLo;
  if(okHi) return optHi;
  if(okLo) return optLo;
  return mid;
}
/* Ruteo ortogonal (solo tramos rectos a 90°) entre los bordes de dos
   elementos, esquivando el resto de los equipos cuando es posible. Los
   flujos de energía (electricidad/gas) siempre bajan o suben en vertical
   desde la fuente o el tablero, para no confundirse con la línea horizontal
   de materiales y proceso. */
function edOrthoPath(A,B,ctype){
  const Ar=edRect(A), Br=edRect(B);
  const others=EP().els.filter(e=>e.id!==A.id&&e.id!==B.id).map(edRect);
  const dx=Br.cx-Ar.cx, dy=Br.cy-Ar.cy;
  const horiz=(ctype!=='electricidad'&&ctype!=='gas')&&Math.abs(dx)>=Math.abs(dy);
  if(horiz){
    const sx=dx>=0?Ar.r:Ar.l, sy=Ar.cy;
    const ex=dx>=0?Br.l:Br.r, ey=Br.cy;
    if(sy===ey) return `M${sx} ${sy} L${ex} ${ey}`;
    const midx=edFreeCoord((sx+ex)/2,Math.min(sy,ey),Math.max(sy,ey),others,Math.min(sx,ex),Math.max(sx,ex),'x');
    return `M${sx} ${sy} L${midx} ${sy} L${midx} ${ey} L${ex} ${ey}`;
  }
  const sx=Ar.cx, sy=dy>=0?Ar.b:Ar.t;
  const ex=Br.cx, ey=dy>=0?Br.t:Br.b;
  if(sx===ex) return `M${sx} ${sy} L${ex} ${ey}`;
  const midy=edFreeCoord((sy+ey)/2,Math.min(sx,ex),Math.max(sx,ex),others,Math.min(sy,ey),Math.max(sy,ey),'y');
  return `M${sx} ${sy} L${sx} ${midy} L${ex} ${midy} L${ex} ${ey}`;
}
function edRenderConns(){

  p.conns.forEach(c=>{
    const A=p.els.find(x=>x.id===c.a),B=p.els.find(x=>x.id===c.b);if(!A||!B)return;
    if(!edVisible(A)&&!edVisible(B))return;

    const dimmed=chain?!inChain:false;
    out.push(`<path d="${d}" fill="none" stroke="${f.c}" stroke-width="${on||inChain?2.8:1.6}" ${f.dash?`stroke-dasharray="${f.dash}"`:''} opacity="${dimmed?.1:(on?1:.8)}" marker-end="url(#ar-${c.t})"/>
      <path class="hit" d="${d}" fill="none" stroke="transparent" stroke-width="12" data-conn="${c.id}"/>`);
  });
  const defs=Object.entries(FLOW).map(([k,f])=>`<marker id="ar-${k}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="${f.c}"/></marker>`).join('');

}

/* --------------------------- interacción -------------------------------- */
function edPt(ev){const w=document.getElementById('edWrap'),r=w.getBoundingClientRect();
  return {x:(ev.clientX-r.left-S.ed.px)/S.ed.zoom, y:(ev.clientY-r.top-S.ed.py)/S.ed.zoom,
          sx:ev.clientX-r.left, sy:ev.clientY-r.top}}
const snap=v=>S.ed.snap?Math.round(v/20)*20:Math.round(v);
function edMount(){
  const wrap=document.getElementById('edWrap');if(!wrap||wrap._m)return;wrap._m=true;
  const lib=document.getElementById('edLib');
  lib.addEventListener('dragstart',e=>{const it=e.target.closest('[data-lib]');if(!it)return;
    e.dataTransfer.setData('text/plain',it.dataset.lib);e.dataTransfer.effectAllowed='copy'});
  wrap.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
  wrap.addEventListener('drop',e=>{e.preventDefault();const k=e.dataTransfer.getData('text/plain');if(!LIBK[k])return;
    const p=edPt(e);const L=LIBK[k];edAdd(k,snap(p.x-L.w/2),snap(p.y-L.h/2))});

  wrap.addEventListener('wheel',e=>{e.preventDefault();
    const r=wrap.getBoundingClientRect();
    if(e.ctrlKey||e.metaKey){edZoom(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top)}
    else{S.ed.px-=e.deltaX;S.ed.py-=e.deltaY;
      edTransform();document.getElementById('edMini').innerHTML=edRenderMini()}
  },{passive:false});

  wrap.addEventListener('mousedown',e=>{
    if(e.button===1||S.ed.tool==='pan'||e.altKey){e.preventDefault();
      S.ed.drag={t:'pan',x0:e.clientX,y0:e.clientY,px:S.ed.px,py:S.ed.py};return}
    const pt=edPt(e);
    const connEl=e.target.closest('[data-conn]');
    if(connEl){S.ed.sel=new Set([connEl.dataset.conn]);edRender();return}
    const hnd=e.target.closest('[data-hnd]');
    if(hnd){const el=edSel()[0];if(!el)return;e.preventDefault();
      S.ed.drag={t:hnd.dataset.hnd==='rot'?'rot':'resize',k:hnd.dataset.hnd,id:el.id,
        x0:pt.x,y0:pt.y,ox:el.x,oy:el.y,ow:el.w,oh:el.h,orot:el.rot||0};edPush();return}
    const elDiv=e.target.closest('[data-el]');
    if(elDiv){const id=elDiv.dataset.el,el=EP().els.find(x=>x.id===id);
      if(S.ed.tool==='connect'){
        if(!S.ed.connFrom){S.ed.connFrom=id;S.ed.sel=new Set([id]);edRender();toast('Elegí el equipo de destino.','⇢')}
        else if(S.ed.connFrom!==id){edPush();EP().conns.push({id:nid('C'),a:S.ed.connFrom,b:id,t:S.ed.connType});
          S.ed.connFrom=null;S.ed.sel=new Set();edRender();edSaved();toast('Conexión creada: '+FLOW[S.ed.connType].n.toLowerCase()+'.','⇢')}
        return}
      if(!S.ed.sel.has(id)){ if(e.shiftKey)S.ed.sel.add(id); else S.ed.sel=new Set([id]); }
      else if(e.shiftKey){S.ed.sel.delete(id)}
      edRender();
      if(el&&!el.locked){
        S.ed.drag={t:'move',x0:pt.x,y0:pt.y,snap0:edSnap(),items:edSel().filter(x=>!x.locked).map(x=>({id:x.id,ox:x.x,oy:x.y})),moved:false}}
      return}
    const zoneDiv=e.target.closest('[data-zone]');
    if(zoneDiv&&S.ed.tool==='select'){const id=zoneDiv.dataset.zone,z=EP().zones.find(x=>x.id===id);
      S.ed.sel=new Set([id]);edRender();
      S.ed.drag={t:'zonemove',id,x0:pt.x,y0:pt.y,ox:z.x,oy:z.y,snap0:edSnap(),moved:false};return}
    if(S.ed.tool==='zone'){edPush();const z={id:nid('Z'),name:'Sector '+(EP().zones.length+1),x:snap(pt.x),y:snap(pt.y),w:20,h:20,c:'#3F704D'};
      EP().zones.push(z);S.ed.sel=new Set([z.id]);S.ed.drag={t:'zonedraw',id:z.id,x0:pt.x,y0:pt.y};edRender();return}
    if(!e.shiftKey)S.ed.sel=new Set();
    S.ed.drag={t:'marquee',x0:pt.x,y0:pt.y,sx:pt.sx,sy:pt.sy};
    const m=document.createElement('div');m.className='marquee';m.id='edMarquee';wrap.appendChild(m);
    edRender();
  });

  if(!window._edGlobal){window._edGlobal=1;
  window.addEventListener('mousemove',e=>{
    const d=S.ed.drag;if(!d)return;
    if(d.t==='pan'){S.ed.px=d.px+(e.clientX-d.x0);S.ed.py=d.py+(e.clientY-d.y0);
      edTransform();return}
    const pt=edPt(e);
    if(d.t==='move'){const dx=pt.x-d.x0,dy=pt.y-d.y0;
      if(!d.moved&&Math.abs(dx)+Math.abs(dy)>2){d.moved=true;S.ed.undo.push(d.snap0);S.ed.redo=[]}
      if(!d.moved)return;
      d.items.forEach(it=>{const el=EP().els.find(x=>x.id===it.id);el.x=snap(it.ox+dx);el.y=snap(it.oy+dy)});
      edRenderLight();return}
    if(d.t==='zonemove'){const z=EP().zones.find(x=>x.id===d.id);
      if(!d.moved){d.moved=true;S.ed.undo.push(d.snap0);S.ed.redo=[]}
      z.x=snap(d.ox+pt.x-d.x0);z.y=snap(d.oy+pt.y-d.y0);edRenderLight();return}
    if(d.t==='zonedraw'){const z=EP().zones.find(x=>x.id===d.id);
      z.x=snap(Math.min(d.x0,pt.x));z.y=snap(Math.min(d.y0,pt.y));z.w=Math.max(40,snap(Math.abs(pt.x-d.x0)));z.h=Math.max(40,snap(Math.abs(pt.y-d.y0)));edRenderLight();return}
    if(d.t==='resize'){const el=EP().els.find(x=>x.id===d.id);const dx=pt.x-d.x0,dy=pt.y-d.y0;
      if(d.k.includes('e')){el.w=Math.max(36,snap(d.ow+dx))}
      if(d.k.includes('s')){el.h=Math.max(36,snap(d.oh+dy))}
      if(d.k.includes('w')){const nw=Math.max(36,snap(d.ow-dx));el.x=snap(d.ox+(d.ow-nw));el.w=nw}
      if(d.k.includes('n')){const nh=Math.max(36,snap(d.oh-dy));el.y=snap(d.oy+(d.oh-nh));el.h=nh}
      edRenderLight();return}
    if(d.t==='rot'){const el=EP().els.find(x=>x.id===d.id);
      const cx=el.x+el.w/2,cy=el.y+el.h/2;
      el.rot=Math.round((Math.atan2(pt.y-cy,pt.x-cx)*180/Math.PI+90)/5)*5;edRenderLight();return}
    if(d.t==='marquee'){const m=document.getElementById('edMarquee');if(!m)return;
      const x=Math.min(d.sx,pt.sx),y=Math.min(d.sy,pt.sy),w=Math.abs(pt.sx-d.sx),h=Math.abs(pt.sy-d.sy);
      m.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
      const L=Math.min(d.x0,pt.x),T=Math.min(d.y0,pt.y),R=Math.max(d.x0,pt.x),B=Math.max(d.y0,pt.y);
      S.ed.sel=new Set(EP().els.filter(el=>edVisible(el)&&el.x+el.w>L&&el.x<R&&el.y+el.h>T&&el.y<B).map(el=>el.id));
      document.getElementById('edCanvas').innerHTML=edRenderEls();return}
  });
  window.addEventListener('mouseup',()=>{
    const d=S.ed.drag;if(!d)return;S.ed.drag=null;
    const m=document.getElementById('edMarquee');if(m)m.remove();
    if(d.t!=='pan'&&d.t!=='marquee'&&d.moved!==false)edSaved();
    edRender();
  });
  }
  wrap.addEventListener('contextmenu',e=>{
    const elDiv=e.target.closest('[data-el]');if(!elDiv)return;e.preventDefault();
    if(!S.ed.sel.has(elDiv.dataset.el)){S.ed.sel=new Set([elDiv.dataset.el]);edRender()}
    edMenu(e.clientX,e.clientY);
  });
  if(!window._edKeys){window._edKeys=1;document.addEventListener('keydown',edKeys)}
  if(!EP()._fitted){EP()._fitted=true;setTimeout(edFit,30)}
}
function edMenu(x,y){
  document.querySelectorAll('.menu').forEach(m=>m.remove());
  const m=document.createElement('div');m.className='menu';m.style.left=Math.min(x,innerWidth-210)+'px';m.style.top=Math.min(y,innerHeight-300)+'px';
  const it=(l,fn,k='')=>`<button onclick="${fn};document.querySelectorAll('.menu').forEach(m=>m.remove())">${l}<span class="kbd">${k}</span></button>`;
  m.innerHTML=it('Duplicar','edDup()','⌘D')+it('Copiar','edCopy()','⌘C')+it('Pegar','edPaste()','⌘V')
   +'<div class="sep"></div>'+it('Rotar 15°','edRot()')+it('Bloquear / desbloquear','edLock()')
   +'<div class="sep"></div>'+it('Alinear a la izquierda','edAlign(\'l\')')+it('Distribuir horizontal','edDist(\'x\')')
   +it('Agrupar en sector','edGroup()')
   +'<div class="sep"></div>'+it('Eliminar','edDel()','Supr');
  document.body.appendChild(m);
  setTimeout(()=>document.addEventListener('mousedown',function h(){m.remove();document.removeEventListener('mousedown',h)}),0);
