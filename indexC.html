function edKeys(e){
  if(S.view!=='planta')return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea')return;
  const cmd=e.ctrlKey||e.metaKey;
  if(cmd&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?edRedo():edUndo();return}
  if(cmd&&e.key.toLowerCase()==='y'){e.preventDefault();edRedo();return}
  if(cmd&&e.key.toLowerCase()==='d'){e.preventDefault();edDup();return}
  if(cmd&&e.key.toLowerCase()==='c'){edCopy();return}
  if(cmd&&e.key.toLowerCase()==='v'){edPaste();return}
  if(cmd&&e.key.toLowerCase()==='a'){e.preventDefault();edSelAll();return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();edDel();return}
  if(e.key==='Escape'){S.ed.sel=new Set();S.ed.connFrom=null;edRender();return}
  if(e.key==='v')edSetTool('select'); if(e.key==='h')edSetTool('pan');
  if(e.key==='c')edSetTool('connect'); if(e.key==='z')edSetTool('zone');
  if(e.key.startsWith('Arrow')){const s=edSel().filter(x=>!x.locked);if(!s.length)return;e.preventDefault();
    const d=e.shiftKey?20:2;edPush();
    s.forEach(el=>{if(e.key==='ArrowLeft')el.x-=d;if(e.key==='ArrowRight')el.x+=d;if(e.key==='ArrowUp')el.y-=d;if(e.key==='ArrowDown')el.y+=d});
    edRenderLight();edSaved()}
}

/* --------------------------- flujo del proceso --------------------------
   Lectura tipo diagrama del mismo modelo de planta del editor visual:
   materias primas & energía → producción → producto terminado. Se arma
   automáticamente a partir de los elementos y conexiones ya cargados. */
function flowClassify(){
  const p=EP(),els=p.els;
  const matSourceIds=new Set(p.conns.filter(c=>c.t==='material').map(c=>c.a));
  const energyNodes=els.filter(e=>e.p.esFuenteEnergia);
  const matNodes=els.filter(e=>matSourceIds.has(e.id)&&!e.p.esFuenteEnergia);
  const storageNodes=els.filter(e=>['deposito','tanque','almacen'].includes(e.k)&&!matSourceIds.has(e.id));
  const excl=new Set([...matNodes,...energyNodes,...storageNodes].map(e=>e.id));
  const productionNodes=els.filter(e=>!excl.has(e.id));
  const products=[...new Set(els.map(e=>e.p.productos).filter(Boolean))];
  return {energyNodes,matNodes,storageNodes,productionNodes,products};
}
function flowNodeConsumers(id){
  return EP().els.map(x=>{const mix=edEnergyMix(x);if(!mix)return null;
    const m=mix.mix.find(y=>y.src.id===id);return m?{node:x,pct:m.pct}:null}).filter(Boolean);
}
function flowInputsFor(node){
  const p=EP(),byType={};
  p.conns.filter(c=>c.b===node.id).forEach(c=>{const A=p.els.find(x=>x.id===c.a);if(!A)return;
    (byType[c.t]=byType[c.t]||[]).push({A,c})});
  return byType;
}
function flowGoTo(id){S.plantaTab='plano';S.ed.sel=new Set([id]);render()}
function flowCard(e,extra){
  const st=edStyle(e);
  return `<div class="flowcard" onclick="flowGoTo('${e.id}')" title="Ver en el Plano">
    <span class="fic" style="color:${st.bd&&st.bd.startsWith('#')?st.bd:'var(--muted)'}">${ico(e.ic)}</span>
    <div class="fbody"><div class="fnm">${esc(e.name)}</div>
    <div class="fkv">${esc(e.p.tipoSuministro||(e.p.sector&&e.p.sector!=='Sin asignar'?e.p.sector:e.code))}</div>
    ${extra||''}</div></div>`;
}
function flowBadges(node){
  const byType=flowInputsFor(node),rows=[];
  Object.entries(byType).forEach(([t,arr])=>{
    const f=FLOW[t]||FLOW.proceso;
    if(t==='electricidad'||t==='gas'){
      const mix=edEnergyMix(node);
      if(mix&&node.p.energia===t){
        rows.push(`<div class="finrow"><span class="fdot" style="background:${f.c}"></span><span><b>${f.n}:</b> ${mix.mix.map(x=>esc(x.src.name)+' ('+nf(x.pct,0)+'%)').join(', ')}</span></div>`);
        return;
      }
      if(arr.length>1){
        const withPct=arr.map(({A,c})=>({A,pct:c.pct!=null?+c.pct:100/arr.length}));
        const sum=withPct.reduce((a,x)=>a+x.pct,0)||1;
        rows.push(`<div class="finrow"><span class="fdot" style="background:${f.c}"></span><span><b>${f.n}:</b> ${withPct.map(x=>esc(x.A.name)+' ('+nf(x.pct/sum*100,0)+'%)').join(', ')}</span></div>`);
        return;
      }
    }
    rows.push(`<div class="finrow"><span class="fdot" style="background:${f.c}"></span><span><b>${f.n}:</b> ${arr.map(x=>esc(x.A.name)).join(', ')}</span></div>`);
  });
  return rows.join('')||'<div class="finrow dim">Sin entradas conectadas</div>';
}
function plantaFlujo(f){
  const cl=flowClassify();
  const matHtml=cl.matNodes.length?cl.matNodes.map(e=>flowCard(e)).join(''):
    '<div class="flowempty">Sin materias primas conectadas todavía. En el Plano, agregá un depósito o tanque y conectalo con flujo «Materiales» hacia un equipo.</div>';
  const enHtml=cl.energyNodes.length?cl.energyNodes.map(e=>{const n=flowNodeConsumers(e.id).length;
      return flowCard(e,`<div class="fkv2">${esc(e.p.propiedad||'')}${e.p.factor&&FBI[e.p.factor]?' · '+nf(FBI[e.p.factor].v,3)+' kgCO₂e/'+FBI[e.p.factor].unit:' · sin factor'}</div>${n?`<div class="fkv2 accent">alimenta ${n} equipo${n>1?'s':''}</div>`:''}`);
    }).join(''):
    '<div class="flowempty">Sin fuentes de energía en el modelo. En el Plano, arrastrá una desde la categoría «Fuentes de energía» de la biblioteca.</div>';
  const prodHtml=cl.productionNodes.length?cl.productionNodes.map(e=>flowCard(e,flowBadges(e))).join(''):
    '<div class="flowempty">Sin equipos de producción.</div>';
  const storHtml=cl.storageNodes.length?cl.storageNodes.map(e=>flowCard(e)).join(''):'';
  const prodTermHtml=cl.products.length?cl.products.map(pn=>{
      const src=cl.productionNodes.filter(e=>e.p.productos===pn);
      return `<div class="flowcard prod"><span class="fic" style="color:var(--accent)">${ico('box')}</span>
        <div class="fbody"><div class="fnm">${esc(pn)}</div><div class="fkv">${src.length?'desde '+src.map(s=>esc(s.name)).join(', '):'sin proceso asignado'}</div></div></div>`;
    }).join(''):
    '<div class="flowempty">Ningún equipo tiene un producto asignado todavía. Asignalo en «Producción y producto», dentro de la ficha del equipo en el Plano.</div>';
  return head('Flujo del proceso','Lectura tipo diagrama del mismo modelo de planta: cómo entran las materias primas y la energía, cómo se transforman en producción, y qué producto terminado sale al final.',
   `<div class="seg-tabs"><button onclick="S.plantaTab='plano';render()">Plano</button><button onclick="S.plantaTab='jerarquia';render()">Jerarquía</button><button class="on">Flujo</button></div>`)
  +`<div class="flowwrap">
     <div class="flowband">
       <div class="flowband-lbl">① Materias primas &amp; energía</div>
       <div class="flowsub"><div class="flowsub-t">Materias primas</div><div class="flowlist">${matHtml}</div></div>
       <div class="flowsub"><div class="flowsub-t">Fuentes de energía</div><div class="flowlist">${enHtml}</div></div>
     </div>
     <div class="flowarrow">→</div>
     <div class="flowband">
       <div class="flowband-lbl">② Producción</div>
       <div class="flowlist">${prodHtml}</div>
     </div>
     <div class="flowarrow">→</div>
     <div class="flowband">
       <div class="flowband-lbl">③ Producto terminado</div>
       <div class="flowlist">${prodTermHtml}</div>
       ${storHtml?`<div class="flowsub-t" style="margin-top:12px">Almacenamiento</div><div class="flowlist">${storHtml}</div>`:''}
     </div>
   </div>
   <div class="note mt">Este diagrama se arma solo con lo que ya cargaste en el Plano: quién se conecta con quién, con qué tipo de flujo y con qué participación. Para sumar materias primas o fuentes de energía nuevas, hacelo desde la pestaña Plano y volvé acá para ver el flujo actualizado.</div>`;
}

function tourStart(){S.tour.active=true;S.tour.step=0;tourShow(0)}
function tourEnd(){S.tour.active=false;tourClearFrame();closeDrawer();render()}
function tourNext(){if(S.tour.step>=TOUR.length-1){tourEnd();return}tourShow(S.tour.step+1)}
function tourPrev(){if(S.tour.step<=0)return;tourShow(S.tour.step-1)}
function tourRestart(){tourStart()}

function tourShow(i){
  S.tour.step=i;const st=TOUR[i];
  if(st.before){try{st.before()}catch(e){}}
  tourClearFrame();
  setTimeout(()=>tourPaint(),st.wait!=null?st.wait:220);
}
function tourClearFrame(){document.querySelectorAll('.tf,.tour-hl,.tour-card,.tour-scrim').forEach(n=>n.remove())}

function tourPaint(){
  if(!S.tour.active)return;
  tourClearFrame();
  const st=TOUR[S.tour.step];
  const n=TOUR.length,i=S.tour.step;
  const nav=(label,fn,primary,disabled)=>`<button class="btn ${primary?'primary':''} sm" ${disabled?'disabled':''} onclick="${fn}">${label}</button>`;
  const cardInner=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
      <span class="eyebrow">Paso ${i+1} de ${n}</span>
      <button class="btn ghost sm" style="margin-left:auto" onclick="tourEnd()">Salir ✕</button>
    </div>
    <div class="bar-progress" style="margin:8px 0 12px"><i style="width:${(i+1)/n*100}%"></i></div>
    <div style="font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px">${st.title}</div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">${st.body}</div>
    <div style="display:flex;gap:7px;margin-top:16px">
      ${i>0?nav('← Atrás','tourPrev()',false,false):'<span></span>'}
      <span style="flex:1"></span>
      ${i===n-1?nav('Volver a ver la demo','tourRestart()',false,false):''}
      ${nav(i===n-1?'Explorar libremente':'Siguiente →','tourNext()',true,false)}
    </div>`;

  if(!st.target){
    const scrim=document.createElement('div');scrim.className='tour-scrim tf';document.body.appendChild(scrim);
    const card=document.createElement('div');card.className='tour-card tf';card.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:380px;z-index:161';
    card.innerHTML=cardInner;document.body.appendChild(card);
    return;
  }
  const el=document.querySelector(st.target);
  if(!el){ // el objetivo no está en el DOM (p. ej. se cerró algo): reintenta una vez, si no, salta el paso
    if(!st._retried){st._retried=true;setTimeout(tourPaint,180);return}
    st._retried=false;tourNext();return;
  }
  try{el.scrollIntoView({block:'center',behavior:'auto'})}catch(e){}
  requestAnimationFrame(()=>requestAnimationFrame(()=>tourFrame(el,st,cardInner)));
}

function tourFrame(el,st,cardInner){
  const r=el.getBoundingClientRect();
  const pad=8;
  const rect={l:r.left-pad,t:r.top-pad,r:r.right+pad,b:r.bottom+pad};
  const vw=innerWidth,vh=innerHeight;
  const mk=(cls,css)=>{const d=document.createElement('div');d.className=cls+' tf';d.style.cssText=css;document.body.appendChild(d);return d};
  mk('tour-blk','position:fixed;left:0;top:0;width:'+vw+'px;height:'+Math.max(rect.t,0)+'px');
  mk('tour-blk','position:fixed;left:0;top:'+rect.b+'px;width:'+vw+'px;height:'+Math.max(vh-rect.b,0)+'px');
  mk('tour-blk','position:fixed;left:0;top:'+rect.t+'px;width:'+Math.max(rect.l,0)+'px;height:'+(rect.b-rect.t)+'px');
  mk('tour-blk','position:fixed;left:'+rect.r+'px;top:'+rect.t+'px;width:'+Math.max(vw-rect.r,0)+'px;height:'+(rect.b-rect.t)+'px');
  mk('tour-hl','position:fixed;left:'+rect.l+'px;top:'+rect.t+'px;width:'+(rect.r-rect.l)+'px;height:'+(rect.b-rect.t)+'px');

  const cw=360,gap=14;
  let cx,cy,side=st.placement||'bottom';
  if(side==='bottom'){cx=rect.l;cy=rect.b+gap; if(cy+220>vh)side='top'}
  if(side==='top'){cx=rect.l;cy=rect.t-gap;}
  if(side==='right'){cx=rect.r+gap;cy=rect.t;}
  if(side==='left'){cx=rect.l-gap-cw;cy=rect.t;}
  cx=Math.max(12,Math.min(cx,vw-cw-12));
  const card=document.createElement('div');card.className='tour-card tf';
  card.style.cssText=`position:fixed;left:${cx}px;top:0;width:${cw}px;z-index:161;visibility:hidden`;
  card.innerHTML=cardInner;document.body.appendChild(card);
  const ch=card.getBoundingClientRect().height;
  let top=side==='top'?cy-ch:cy;
  top=Math.max(12,Math.min(top,vh-ch-12));
  card.style.top=top+'px';card.style.visibility='visible';
}

function tourResize(){if(S.tour.active)tourPaint()}
window.addEventListener('resize',()=>{clearTimeout(window._tr);window._tr=setTimeout(tourResize,120)});
document.addEventListener('keydown',e=>{
  if(!S.tour.active)return;
  if(e.key==='Escape'){tourEnd();return}
  if(e.key==='ArrowRight'||e.key==='Enter'){tourNext();return}
  if(e.key==='ArrowLeft'){tourPrev();return}
});
